naftiko: 1.0.0-alpha2
info:
  label: PostHog API — oauth_applications
  description: 'PostHog API — oauth_applications. 1 operations. Lead operation: oauth_applications. Self-contained Naftiko
    capability covering one Posthog business surface.'
  tags:
  - Posthog
  - oauth_applications
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    POSTHOG_API_KEY: POSTHOG_API_KEY
capability:
  consumes:
  - type: http
    namespace: posthog-oauth-applications
    baseUri: ''
    description: PostHog API — oauth_applications business capability. Self-contained, no shared references.
    resources:
    - name: api-organizations-organization_id-oauth_applications
      path: /api/organizations/{organization_id}/oauth_applications/
      operations:
      - name: oauthapplicationslist
        method: GET
        description: ViewSet for listing OAuth applications at the organization level (read-only).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Number of results to return per page.
        - name: offset
          in: query
          type: integer
          description: The initial index from which to return the results.
    authentication:
      type: bearer
      token: '{{env.POSTHOG_API_KEY}}'
  exposes:
  - type: rest
    namespace: posthog-oauth-applications-rest
    port: 8080
    description: REST adapter for PostHog API — oauth_applications. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/organizations/{organization-id}/oauth-applications
      name: api-organizations-organization-id-oauth-applications
      description: REST surface for api-organizations-organization_id-oauth_applications.
      operations:
      - method: GET
        name: oauthapplicationslist
        description: ViewSet for listing OAuth applications at the organization level (read-only).
        call: posthog-oauth-applications.oauthapplicationslist
        with:
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: posthog-oauth-applications-mcp
    port: 9090
    transport: http
    description: MCP adapter for PostHog API — oauth_applications. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: viewset-listing-oauth-applications-organization
      description: ViewSet for listing OAuth applications at the organization level (read-only).
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: posthog-oauth-applications.oauthapplicationslist
      with:
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
