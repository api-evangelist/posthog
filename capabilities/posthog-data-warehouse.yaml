      operations:
      - method: GET
        name: environmentsdatamodelingjobsrecentretrieve
        description: Get the most recent non-running job for each saved query from the v2 backend.
        call: posthog-data-warehouse.environmentsdatamodelingjobsrecentretrieve
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/environments/{environment-id}/data-modeling-jobs/running
      name: api-environments-environment-id-data-modeling-jobs-running
      description: REST surface for api-environments-environment_id-data_modeling_jobs-running.
