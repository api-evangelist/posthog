openapi: 3.0.3
info:
  title: PostHog actions annotations API
  version: 1.0.0
  description: ''
tags:
- name: annotations
paths:
  /api/projects/{project_id}/annotations/:
    get:
      operationId: annotations_list
      description: Create, Read, Update and Delete annotations. [See docs](https://posthog.com/docs/data/annotations) for more information on annotations.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - annotations
      security:
      - PersonalAPIKeyAuth:
        - annotation:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnotationList'
          description: ''
      x-explicit-tags:
      - core
    post:
      operationId: annotations_create
      description: Create, Read, Update and Delete annotations. [See docs](https://posthog.com/docs/data/annotations) for more information on annotations.
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - annotations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Annotation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Annotation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Annotation'
      security:
      - PersonalAPIKeyAuth:
        - annotation:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Annotation'
          description: ''
      x-explicit-tags:
      - core
  /api/projects/{project_id}/annotations/{id}/:
    get:
      operationId: annotations_retrieve
      description: Create, Read, Update and Delete annotations. [See docs](https://posthog.com/docs/data/annotations) for more information on annotations.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this annotation.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - annotations
      security:
      - PersonalAPIKeyAuth:
        - annotation:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Annotation'
          description: ''
      x-explicit-tags:
      - core
    put:
      operationId: annotations_update
      description: Create, Read, Update and Delete annotations. [See docs](https://posthog.com/docs/data/annotations) for more information on annotations.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this annotation.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - annotations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Annotation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Annotation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Annotation'
      security:
      - PersonalAPIKeyAuth:
        - annotation:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Annotation'
          description: ''
      x-explicit-tags:
      - core
    patch:
      operationId: annotations_partial_update
      description: Create, Read, Update and Delete annotations. [See docs](https://posthog.com/docs/data/annotations) for more information on annotations.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this annotation.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - annotations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnnotation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnnotation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnnotation'
      security:
      - PersonalAPIKeyAuth:
        - annotation:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Annotation'
          description: ''
      x-explicit-tags:
      - core
    delete:
      operationId: annotations_destroy
      description: Hard delete of this model is not allowed. Use a patch API call to set "deleted" to true
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this annotation.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - annotations
      security:
      - PersonalAPIKeyAuth:
        - annotation:write
      responses:
        '405':
          description: No response body
      x-explicit-tags:
      - core
components:
  schemas:
    AnnotationScopeEnum:
      enum:
      - dashboard_item
      - dashboard
      - project
      - organization
      - recording
      type: string
      description: '* `dashboard_item` - insight

        * `dashboard` - dashboard

        * `project` - project

        * `organization` - organization

        * `recording` - recording'
    BlankEnum:
      enum:
      - ''
    PatchedAnnotation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content:
          type: string
          nullable: true
          description: Annotation text shown on charts to describe the change, release, or incident.
          maxLength: 8192
        date_marker:
          type: string
          format: date-time
          nullable: true
          description: When this annotation happened (ISO 8601 timestamp). Used to position it on charts.
        creation_type:
          allOf:
          - $ref: '#/components/schemas/CreationTypeEnum'
          description: 'Who created this annotation. Use `USR` for user-created notes and `GIT` for bot/deployment notes.


            * `USR` - user

            * `GIT` - GitHub'
        dashboard_item:
          type: integer
          nullable: true
        dashboard_id:
          type: integer
          nullable: true
        dashboard_name:
          type: string
          nullable: true
          readOnly: true
        insight_short_id:
          type: string
          nullable: true
          readOnly: true
        insight_name:
          type: string
          nullable: true
          readOnly: true
        insight_derived_name:
          type: string
          nullable: true
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted:
          type: boolean
          description: Soft-delete flag. Set to true to hide the annotation, or false to restore it.
        scope:
          allOf:
          - $ref: '#/components/schemas/AnnotationScopeEnum'
          description: 'Annotation visibility scope: `project`, `organization`, `dashboard`, or `dashboard_item`. `recording` is deprecated and rejected.


            * `dashboard_item` - insight

            * `dashboard` - dashboard

            * `project` - project

            * `organization` - organization

            * `recording` - recording'
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          nullable: true
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type: boolean
          nullable: true
        hedgehog_config:
          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    Annotation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content:
          type: string
          nullable: true
          description: Annotation text shown on charts to describe the change, release, or incident.
          maxLength: 8192
        date_marker:
          type: string
          format: date-time
          nullable: true
          description: When this annotation happened (ISO 8601 timestamp). Used to position it on charts.
        creation_type:
          allOf:
          - $ref: '#/components/schemas/CreationTypeEnum'
          description: 'Who created this annotation. Use `USR` for user-created notes and `GIT` for bot/deployment notes.


            * `USR` - user

            * `GIT` - GitHub'
        dashboard_item:
          type: integer
          nullable: true
        dashboard_id:
          type: integer
          nullable: true
        dashboard_name:
          type: string
          nullable: true
          readOnly: true
        insight_short_id:
          type: string
          nullable: true
          readOnly: true
        insight_name:
          type: string
          nullable: true
          readOnly: true
        insight_derived_name:
          type: string
          nullable: true
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted:
          type: boolean
          description: Soft-delete flag. Set to true to hide the annotation, or false to restore it.
        scope:
          allOf:
          - $ref: '#/components/schemas/AnnotationScopeEnum'
          description: 'Annotation visibility scope: `project`, `organization`, `dashboard`, or `dashboard_item`. `recording` is deprecated and rejected.


            * `dashboard_item` - insight

            * `dashboard` - dashboard

            * `project` - project

            * `organization` - organization

            * `recording` - recording'
      required:
      - created_at
      - created_by
      - dashboard_name
      - id
      - insight_derived_name
      - insight_name
      - insight_short_id
      - updated_at
    PaginatedAnnotationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    CreationTypeEnum:
      enum:
      - USR
      - GIT
      type: string
      description: '* `USR` - user

        * `GIT` - GitHub'
    NullEnum:
      enum:
      - null
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
