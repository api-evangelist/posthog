            * `revenue_analytics` - revenue_analytics

            * `flag` - flag

            * `workflow_variable` - workflow_variable'
        value:
          type: array
          items:
            type: string
          description: List of values to match. For example `["test@example.com", "ok@example.com"]`.
        operator:
          allOf:
          - $ref: '#/components/schemas/ArrayPropertyFilterOperatorEnum'
          default: exact
          description: 'Array comparison operator.


            * `exact` - exact

            * `is_not` - is_not

            * `in` - in

            * `not_in` - not_in'
      required:
      - key
      - value
    StringMatchOperatorEnum:
      enum:
      - exact
      - is_not
      - icontains
      - not_icontains
      - regex
      - not_regex
      type: string
      description: '* `exact` - exact

        * `is_not` - is_not

        * `icontains` - icontains

        * `not_icontains` - not_icontains

        * `regex` - regex

        * `not_regex` - not_regex'
    PropertyFilterTypeEnum:
