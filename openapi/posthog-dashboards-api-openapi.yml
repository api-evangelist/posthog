          format: date-time
          readOnly: true
          nullable: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
    BulkUpdateTagsError:
      type: object
      properties:
        id:
          type: integer
        reason:
          type: string
      required:
      - id
      - reason
    CopyDashboardTileRequest:
      type: object
      properties:
        fromDashboardId:
          type: integer
          description: Dashboard id the tile currently belongs to.
        tileId:
          type: integer
          description: Dashboard tile id to copy.
      required:
      - fromDashboardId
      - tileId
    SharePassword:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        note:
          type: string
          nullable: true
          maxLength: 100
        created_by_email:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - created_at
      - created_by_email
      - id
      - is_active
  parameters:
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
