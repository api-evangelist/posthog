openapi: 3.0.3
info:
  title: PostHog actions web_experiments API
  version: 1.0.0
  description: ''
tags:
- name: web_experiments
paths:
  /api/projects/{project_id}/web_experiments/:
    get:
      operationId: web_experiments_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - web_experiments
      security:
      - PersonalAPIKeyAuth:
        - experiment:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWebExperimentsAPIList'
          description: ''
      x-explicit-tags: []
    post:
      operationId: web_experiments_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - web_experiments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebExperimentsAPI'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebExperimentsAPI'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebExperimentsAPI'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - experiment:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebExperimentsAPI'
          description: ''
      x-explicit-tags: []
  /api/projects/{project_id}/web_experiments/{id}/:
    get:
      operationId: web_experiments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this web experiment.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - web_experiments
      security:
      - PersonalAPIKeyAuth:
        - experiment:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebExperimentsAPI'
          description: ''
      x-explicit-tags: []
    put:
      operationId: web_experiments_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this web experiment.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - web_experiments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebExperimentsAPI'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebExperimentsAPI'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebExperimentsAPI'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - experiment:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebExperimentsAPI'
          description: ''
      x-explicit-tags: []
    patch:
      operationId: web_experiments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this web experiment.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - web_experiments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWebExperimentsAPI'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWebExperimentsAPI'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWebExperimentsAPI'
      security:
      - PersonalAPIKeyAuth:
        - experiment:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebExperimentsAPI'
          description: ''
      x-explicit-tags: []
    delete:
      operationId: web_experiments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this web experiment.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - web_experiments
      security:
      - PersonalAPIKeyAuth:
        - experiment:write
      responses:
        '204':
          description: No response body
      x-explicit-tags: []
components:
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  schemas:
    PaginatedWebExperimentsAPIList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/WebExperimentsAPI'
    WebExperimentsAPI:
      type: object
      description: Serializer for the exposed /api/web_experiments endpoint, to be used in posthog-js and for headless APIs.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 400
        created_at:
          type: string
          format: date-time
        feature_flag_key:
          type: string
          readOnly: true
        variants:
          description: "Variants for the web experiment. Example:\n\n        {\n            \"control\": {\n                \"transforms\": [\n                    {\n                        \"text\": \"Here comes Superman!\",\n                        \"html\": \"\",\n                        \"selector\": \"#page > #body > .header h1\"\n                    }\n                ],\n                \"conditions\": \"None\",\n                \"rollout_percentage\": 50\n            },\n        }"
      required:
      - feature_flag_key
      - id
      - name
      - variants
    PatchedWebExperimentsAPI:
      type: object
      description: Serializer for the exposed /api/web_experiments endpoint, to be used in posthog-js and for headless APIs.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 400
        created_at:
          type: string
          format: date-time
        feature_flag_key:
          type: string
          readOnly: true
        variants:
          description: "Variants for the web experiment. Example:\n\n        {\n            \"control\": {\n                \"transforms\": [\n                    {\n                        \"text\": \"Here comes Superman!\",\n                        \"html\": \"\",\n                        \"selector\": \"#page > #body > .header h1\"\n                    }\n                ],\n                \"conditions\": \"None\",\n                \"rollout_percentage\": 50\n            },\n        }"
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
