openapi: 3.0.3
info:
  title: PostHog actions data_modeling_jobs API
  version: 1.0.0
  description: ''
tags:
- name: data_modeling_jobs
paths:
  /api/environments/{environment_id}/data_modeling_jobs/:
    get:
      operationId: environments_data_modeling_jobs_list
      description: List data modeling jobs which are "runs" for our saved queries.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: saved_query_id
        schema:
          type: string
          format: uuid
      tags:
      - data_modeling_jobs
      security:
      - PersonalAPIKeyAuth:
        - warehouse_view:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDataModelingJobList'
          description: ''
      deprecated: true
      x-explicit-tags:
      - data_warehouse
  /api/environments/{environment_id}/data_modeling_jobs/{id}/:
    get:
      operationId: environments_data_modeling_jobs_retrieve
      description: List data modeling jobs which are "runs" for our saved queries.
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this data modeling job.
        required: true
      tags:
      - data_modeling_jobs
      security:
      - PersonalAPIKeyAuth:
        - warehouse_view:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataModelingJob'
          description: ''
      deprecated: true
      x-explicit-tags:
      - data_warehouse
  /api/environments/{environment_id}/data_modeling_jobs/recent/:
    get:
      operationId: environments_data_modeling_jobs_recent_retrieve
      description: Get the most recent non-running job for each saved query from the v2 backend.
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - data_modeling_jobs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataModelingJob'
          description: ''
      deprecated: true
      x-explicit-tags:
      - data_warehouse
  /api/environments/{environment_id}/data_modeling_jobs/running/:
    get:
      operationId: environments_data_modeling_jobs_running_retrieve
      description: Get all currently running jobs from the v2 backend.
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - data_modeling_jobs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataModelingJob'
          description: ''
      deprecated: true
      x-explicit-tags:
      - data_warehouse
  /api/projects/{project_id}/data_modeling_jobs/:
    get:
      operationId: data_modeling_jobs_list
      description: List data modeling jobs which are "runs" for our saved queries.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: query
        name: saved_query_id
        schema:
          type: string
          format: uuid
      tags:
      - data_modeling_jobs
      security:
      - PersonalAPIKeyAuth:
        - warehouse_view:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDataModelingJobList'
          description: ''
      x-explicit-tags:
      - data_warehouse
  /api/projects/{project_id}/data_modeling_jobs/{id}/:
    get:
      operationId: data_modeling_jobs_retrieve
      description: List data modeling jobs which are "runs" for our saved queries.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this data modeling job.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - data_modeling_jobs
      security:
      - PersonalAPIKeyAuth:
        - warehouse_view:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataModelingJob'
          description: ''
      x-explicit-tags:
      - data_warehouse
  /api/projects/{project_id}/data_modeling_jobs/recent/:
    get:
      operationId: data_modeling_jobs_recent_retrieve
      description: Get the most recent non-running job for each saved query from the v2 backend.
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - data_modeling_jobs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataModelingJob'
          description: ''
      x-explicit-tags:
      - data_warehouse
  /api/projects/{project_id}/data_modeling_jobs/running/:
    get:
      operationId: data_modeling_jobs_running_retrieve
      description: Get all currently running jobs from the v2 backend.
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - data_modeling_jobs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataModelingJob'
          description: ''
      x-explicit-tags:
      - data_warehouse
components:
  schemas:
    DataModelingJobStatusEnum:
      enum:
      - Cancelled
      - Completed
      - Failed
      - Running
      type: string
      description: '* `Cancelled` - Cancelled

        * `Completed` - Completed

        * `Failed` - Failed

        * `Running` - Running'
    DataModelingJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        saved_query_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DataModelingJobStatusEnum'
          readOnly: true
        rows_materialized:
          type: integer
          readOnly: true
        error:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_run_at:
          type: string
          format: date-time
          readOnly: true
        workflow_id:
          type: string
          readOnly: true
          nullable: true
        workflow_run_id:
          type: string
          readOnly: true
          nullable: true
        rows_expected:
          type: integer
          readOnly: true
          nullable: true
          description: Total rows expected to be materialized
      required:
      - created_at
      - error
      - id
      - last_run_at
      - rows_expected
      - rows_materialized
      - saved_query_id
      - status
      - workflow_id
      - workflow_run_id
    PaginatedDataModelingJobList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/DataModelingJob'
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
