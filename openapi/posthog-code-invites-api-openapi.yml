openapi: 3.0.3
info:
  title: PostHog actions code-invites API
  version: 1.0.0
  description: ''
tags:
- name: code-invites
paths:
  /api/code/invites/check-access/:
    get:
      operationId: code_invites_check_access_retrieve
      description: Check whether the authenticated user has access to PostHog Code.
      summary: Check access
      tags:
      - code-invites
      responses:
        '200':
          description: Access check result
      x-explicit-tags:
      - code-invites
      - tasks
  /api/code/invites/redeem/:
    post:
      operationId: code_invites_redeem_create
      description: Redeem a PostHog Code invite code to enable access.
      summary: Redeem invite code
      tags:
      - code-invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeInviteRedeemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CodeInviteRedeemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CodeInviteRedeemRequest'
        required: true
      responses:
        '200':
          description: Invite code redeemed successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid or expired invite code
      x-explicit-tags:
      - code-invites
      - tasks
components:
  schemas:
    CodeInviteRedeemRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
      required:
      - code
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
      - error
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
