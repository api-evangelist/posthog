openapi: 3.0.3
info:
  title: PostHog actions uploaded_media API
  version: 1.0.0
  description: ''
tags:
- name: uploaded_media
paths:
  /api/projects/{project_id}/uploaded_media/:
    post:
      operationId: uploaded_media_create
      description: "\n    When object storage is available this API allows upload of media which can be used, for example, in text cards on dashboards.\n\n    Uploaded media must have a content type beginning with 'image/' and be less than 4MB.\n    "
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - uploaded_media
      security:
      - PersonalAPIKeyAuth:
        - uploaded_media:write
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: ''
      x-explicit-tags: []
components:
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
