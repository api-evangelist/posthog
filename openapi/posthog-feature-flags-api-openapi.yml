        experiment_set:
          type: array
          items:
            type: integer
          readOnly: true
        experiment_set_metadata:
          type: array
          items:
            type: object
            additionalProperties: true
          readOnly: true
        surveys:
          type: object
          additionalProperties: true
          readOnly: true
        features:
          type: object
          additionalProperties: true
          readOnly: true
        rollback_conditions: {}
        performed_rollback:
          type:
          - boolean
          - 'null'
        can_edit:
          type: boolean
          readOnly: true
        tags:
          type: array
          items: {}
        evaluation_contexts:
          type: array
          items: {}
          writeOnly: true
        usage_dashboard:
          type: integer
          readOnly: true
        analytics_dashboards:
          type: array
          items:
            type: integer
        has_enriched_analytics:
          type:
          - boolean
          - 'null'
        user_access_level:
          type:
          - string
          - 'null'
          readOnly: true
          description: The effective access level the user has for this object
        creation_context:
          allOf:
          - $ref: '#/components/schemas/FeatureFlagCreationContextEnum'
          writeOnly: true
          description: 'Indicates the origin product of the feature flag. Choices: ''feature_flags'', ''experiments'', ''surveys'', ''early_access_features'', ''web_experiments'', ''product_tours''.


            * `feature_flags` - feature_flags

            * `experiments` - experiments

            * `surveys` - surveys

            * `early_access_features` - early_access_features

            * `web_experiments` - web_experiments

            * `product_tours` - product_tours'
        is_remote_configuration:
          type:
          - boolean
          - 'null'
        has_encrypted_payloads:
          type:
          - boolean
          - 'null'
        status:
          type: string
          readOnly: true
        evaluation_runtime:
          description: 'Specifies where this feature flag should be evaluated


            * `server` - Server

            * `client` - Client

            * `all` - All'
          oneOf:
          - $ref: '#/components/schemas/EvaluationRuntimeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        bucketing_identifier:
          description: 'Identifier used for bucketing users into rollout and variants


            * `distinct_id` - User ID (default)

            * `device_id` - Device ID'
          oneOf:
          - $ref: '#/components/schemas/BucketingIdentifierEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        last_called_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last time this feature flag was called (from $feature_flag_called events)
        _create_in_folder:
          type: string
          writeOnly: true
          title: ' create in folder'
        _should_create_usage_dashboard:
          type: boolean
          writeOnly: true
          default: true
          title: ' should create usage dashboard'
        is_used_in_replay_settings:
          type: boolean
          description: Check if this feature flag is used in any team's session recording linked flag setting.
          readOnly: true
      required:
      - can_edit
      - created_by
      - experiment_set
      - experiment_set_metadata
      - features
      - id
      - is_used_in_replay_settings
      - key
      - last_modified_by
      - status
      - surveys
      - updated_at
      - usage_dashboard
      - user_access_level
    FeatureFlagCreateRequestSchema:
      type: object
      properties:
        key:
          type: string
          description: Feature flag key.
        name:
          type: string
          description: Feature flag description (stored in the `name` field for backwards compatibility).
        filters:
          allOf:
          - $ref: '#/components/schemas/FeatureFlagFiltersSchema'
          description: Feature flag targeting configuration.
        active:
          type: boolean
          description: Whether the feature flag is active.
        tags:
          type: array
          items:
            type: string
          description: Organizational tags for this feature flag.
        evaluation_contexts:
          type: array
          items:
            type: string
          description: Evaluation contexts that control where this flag evaluates at runtime.
    FeatureFlagMultivariateSchema:
      type: object
      properties:
        variants:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlagMultivariateVariantSchema'
          description: Variant definitions for multivariate feature flags.
      required:
      - variants
    FeatureFlagFilterPropertySchema:
      oneOf:
      - $ref: '#/components/schemas/FeatureFlagFilterPropertyGenericSchema'
      - $ref: '#/components/schemas/FeatureFlagFilterPropertyExistsSchema'
      - $ref: '#/components/schemas/FeatureFlagFilterPropertyDateSchema'
      - $ref: '#/components/schemas/FeatureFlagFilterPropertySemverSchema'
      - $ref: '#/components/schemas/FeatureFlagFilterPropertyMultiContainsSchema'
      - $ref: '#/components/schemas/FeatureFlagFilterPropertyCohortInSchema'
      - $ref: '#/components/schemas/FeatureFlagFilterPropertyFlagEvaluatesSchema'
    FeatureFlagFilterPropertyCohortInSchemaOperatorEnum:
      enum:
      - in
      - not_in
      type: string
      description: '* `in` - in

        * `not_in` - not_in'
    FeatureFlagFilterPropertyGenericSchema:
      type: object
      properties:
        key:
          type: string
          description: Property key used in this feature flag condition.
        type:
          allOf:
          - $ref: '#/components/schemas/PropertyGroupTypeEnum'
          description: 'Property filter type. Common values are ''person'' and ''cohort''.


            * `cohort` - cohort

            * `person` - person

            * `group` - group'
        cohort_name:
          type:
          - string
          - 'null'
          description: Resolved cohort name for cohort-type filters.
        group_type_index:
          type:
          - integer
          - 'null'
          description: Group type index when using group-based filters.
        value:
          description: Comparison value for the property filter. Supports strings, numbers, booleans, and arrays.
        operator:
          allOf:
          - $ref: '#/components/schemas/FeatureFlagFilterPropertyGenericSchemaOperatorEnum'
          description: 'Operator used to compare the property value.


            * `exact` - exact

            * `is_not` - is_not

            * `icontains` - icontains

            * `not_icontains` - not_icontains

            * `regex` - regex

            * `not_regex` - not_regex

            * `gt` - gt

            * `gte` - gte

            * `lt` - lt

            * `lte` - lte'
      required:
      - key
      - operator
      - value
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
