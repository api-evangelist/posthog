openapi: 3.2.0
info:
  title: PostHog Feature Flags API
  version: 1.0.0
  description: ''
tags:
- name: Feature Flags
paths:
  /api/projects/{project_id}/feature_flags/:
    get:
      operationId: feature_flags_list
      description: 'Create, read, update and delete feature flags. See docs for more information on feature flags.


        If you''re looking to use feature flags on your application, you can either use our JavaScript Library or our dedicated endpoint to check if feature flags are enabled for a given user.'
      parameters:
      - in: query
        name: active
        schema:
          type: string
          enum:
          - STALE
          - 'false'
          - 'true'
      - in: query
        name: created_by_id
        schema:
          type: string
        description: The User ID which initially created the feature flag.
      - in: query
        name: evaluation_runtime
        schema:
          type: string
          enum:
          - both
          - client
          - server
        description: Filter feature flags by their evaluation runtime.
      - in: query
        name: excluded_properties
        schema:
          type: string
        description: JSON-encoded list of feature flag keys to exclude from the results.
      - in: query
        name: has_evaluation_contexts
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Filter feature flags by presence of evaluation contexts. 'true' returns only flags with at least one evaluation context, 'false' returns only flags without.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: query
        name: search
        schema:
          type: string
        description: Search by feature flag key or name. Case insensitive.
      - in: query
        name: tags
        schema:
          type: string
        description: JSON-encoded list of tag names to filter feature flags by.
      - in: query
        name: type
        schema:
          type: string
          enum:
          - boolean
          - experiment
          - multivariant
          - remote_config
      tags:
      - Feature Flags
      security:
      - PersonalAPIKeyAuth:
        - feature_flag:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeatureFlagList'
          description: ''
      x-explicit-tags:
      - feature_flags
      summary: Feature flags list
      x-summary-source: derived
    post:
      operationId: feature_flags_create
      description: 'Create, read, update and delete feature flags. See docs for more information on feature flags.


        If you''re looking to use feature flags on your application, you can either use our JavaScript Library or our dedicated endpoint to check if feature flags are enabled for a given user.'
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Feature Flags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagCreateRequestSchema'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeatureFlagCreateRequestSchema'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeatureFlagCreateRequestSchema'
      security:
      - PersonalAPIKeyAuth:
        - feature_flag:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
          description: ''
      x-explicit-tags:
      - feature_flags
      summary: Feature flags create
      x-summary-source: derived
  /api/projects/{project_id}/feature_flags/{id}/:
    get:
      operationId: feature_flags_retrieve
      description: 'Create, read, update and delete feature flags. See docs for more information on feature flags.


        If you''re looking to use feature flags on your application, you can either use our JavaScript Library or our dedicated endpoint to check if feature flags are enabled for a given user.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this feature flag.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Feature Flags
      security:
      - PersonalAPIKeyAuth:
        - feature_flag:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
          description: ''
      x-explicit-tags:
      - feature_flags
      summary: Feature flags retrieve
      x-summary-source: derived
    put:
      operationId: feature_flags_update
      description: 'Create, read, update and delete feature flags. See docs for more information on feature flags.


        If you''re looking to use feature flags on your application, you can either use our JavaScript Library or our dedicated endpoint to check if feature flags are enabled for a given user.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this feature flag.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Feature Flags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlag'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeatureFlag'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeatureFlag'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - feature_flag:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
          description: ''
      x-explicit-tags:
      - feature_flags
      summary: Feature flags update
      x-summary-source: derived
    patch:
      operationId: feature_flags_partial_update
      description: 'Create, read, update and delete feature flags. See docs for more information on feature flags.


        If you''re looking to use feature flags on your application, you can either use our JavaScript Library or our dedicated endpoint to check if feature flags are enabled for a given user.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this feature flag.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Feature Flags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFeatureFlagPartialUpdateRequestSchema'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFeatureFlagPartialUpdateRequestSchema'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFeatureFlagPartialUpdateRequestSchema'
      security:
      - PersonalAPIKeyAuth:
        - feature_flag:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
          description: ''
      x-explicit-tags:
      - feature_flags
      summary: Feature flags partial update
      x-summary-source: derived
    delete:
      operationId: feature_flags_destroy
      description: Hard delete of this model is not allowed. Use a patch API call to set "deleted" to true
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this feature flag.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Feature Flags
      security:
      - PersonalAPIKeyAuth:
        - feature_flag:write
      responses:
        '405':
          description: No response body
      x-explicit-tags:
      - feature_flags
      summary: Feature flags destroy
      x-summary-source: derived
  /api/projects/{project_id}/feature_flags/{id}/activity/:
