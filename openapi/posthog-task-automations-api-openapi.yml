openapi: 3.0.3
info:
  title: PostHog actions task-automations API
  version: 1.0.0
  description: ''
tags:
- name: task-automations
paths:
  /api/projects/{project_id}/task_automations/:
    get:
      operationId: task_automations_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - task-automations
      security:
      - PersonalAPIKeyAuth:
        - task:read
      - PersonalAPIKeyAuth:
        - task:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskAutomationList'
          description: ''
      x-explicit-tags:
      - task-automations
      - tasks
    post:
      operationId: task_automations_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - task-automations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAutomation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskAutomation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskAutomation'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAutomation'
          description: ''
      x-explicit-tags:
      - task-automations
      - tasks
  /api/projects/{project_id}/task_automations/{id}/:
    get:
      operationId: task_automations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task automation.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - task-automations
      security:
      - PersonalAPIKeyAuth:
        - task:read
      - PersonalAPIKeyAuth:
        - task:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAutomation'
          description: ''
      x-explicit-tags:
      - task-automations
    put:
      operationId: task_automations_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task automation.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - task-automations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAutomation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskAutomation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskAutomation'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAutomation'
          description: ''
      x-explicit-tags:
      - task-automations
    patch:
      operationId: task_automations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task automation.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - task-automations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskAutomation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTaskAutomation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTaskAutomation'
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAutomation'
          description: ''
      x-explicit-tags:
      - task-automations
    delete:
      operationId: task_automations_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task automation.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - task-automations
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '204':
          description: No response body
      x-explicit-tags:
      - task-automations
  /api/projects/{project_id}/task_automations/{id}/run/:
    post:
      operationId: task_automations_run_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task automation.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - task-automations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAutomation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskAutomation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskAutomation'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAutomation'
          description: ''
      x-explicit-tags:
      - task-automations
components:
  schemas:
    TaskAutomation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        prompt:
          type: string
        repository:
          type: string
          maxLength: 255
        github_integration:
          type: integer
          nullable: true
        cron_expression:
          type: string
          maxLength: 100
        timezone:
          type: string
          maxLength: 128
        template_id:
          type: string
          nullable: true
          maxLength: 255
        enabled:
          type: boolean
        last_run_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        last_run_status:
          type: string
          nullable: true
          readOnly: true
        last_task_id:
          type: string
          nullable: true
          readOnly: true
        last_task_run_id:
          type: string
          nullable: true
          readOnly: true
        last_error:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - cron_expression
      - id
      - last_error
      - last_run_at
      - last_run_status
      - last_task_id
      - last_task_run_id
      - name
      - prompt
      - repository
      - updated_at
    PatchedTaskAutomation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        prompt:
          type: string
        repository:
          type: string
          maxLength: 255
        github_integration:
          type: integer
          nullable: true
        cron_expression:
          type: string
          maxLength: 100
        timezone:
          type: string
          maxLength: 128
        template_id:
          type: string
          nullable: true
          maxLength: 255
        enabled:
          type: boolean
        last_run_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        last_run_status:
          type: string
          nullable: true
          readOnly: true
        last_task_id:
          type: string
          nullable: true
          readOnly: true
        last_task_run_id:
          type: string
          nullable: true
          readOnly: true
        last_error:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PaginatedTaskAutomationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/TaskAutomation'
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
