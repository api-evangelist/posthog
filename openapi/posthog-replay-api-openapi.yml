components:
  schemas:
    SessionSummaries:
      type: object
      properties:
        session_ids:
          type: array
          items:
            type: string
          description: List of session IDs to summarize (max 300)
          maxItems: 300
          minItems: 1
        focus_area:
          type: string
          description: Optional focus area for the summarization
          maxLength: 500
      required:
      - session_ids
    SessionRecordingPlaylistTypeEnum:
      enum:
      - collection
      - filters
      type: string
      description: '* `collection` - Collection

        * `filters` - Filters'
    BlankEnum:
      enum:
      - ''
    PaginatedSessionRecordingPlaylistList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/SessionRecordingPlaylist'
    PatchedSessionRecording:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        distinct_id:
          type: string
          readOnly: true
          nullable: true
        viewed:
          type: boolean
          readOnly: true
        viewers:
          type: array
          items:
            type: string
          readOnly: true
        recording_duration:
          type: integer
          readOnly: true
        active_seconds:
          type: integer
          readOnly: true
          nullable: true
        inactive_seconds:
          type: integer
          readOnly: true
          nullable: true
        start_time:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        end_time:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        click_count:
          type: integer
          readOnly: true
          nullable: true
        keypress_count:
          type: integer
          readOnly: true
          nullable: true
        mouse_activity_count:
          type: integer
          readOnly: true
          nullable: true
        console_log_count:
          type: integer
          readOnly: true
          nullable: true
        console_warn_count:
          type: integer
          readOnly: true
          nullable: true
        console_error_count:
          type: integer
          readOnly: true
          nullable: true
        start_url:
          type: string
          readOnly: true
          nullable: true
        person:
          $ref: '#/components/schemas/MinimalPerson'
        retention_period_days:
          type: integer
          readOnly: true
