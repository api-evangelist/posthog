openapi: 3.0.3
info:
  title: PostHog actions hog_flows API
  version: 1.0.0
  description: ''
tags:
- name: hog_flows
paths:
  /api/environments/{environment_id}/hog_flows/:
    get:
      operationId: environments_hog_flows_list
      parameters:
      - in: query
        name: created_at
        schema:
          type: string
          format: date-time
      - in: query
        name: created_by
        schema:
          type: integer
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: query
        name: id
        schema:
          type: string
          format: uuid
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: updated_at
        schema:
          type: string
          format: date-time
      tags:
      - hog_flows
      security:
      - PersonalAPIKeyAuth:
        - hog_flow:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHogFlowMinimalList'
          description: ''
      deprecated: true
      x-explicit-tags:
      - workflows
    post:
      operationId: environments_hog_flows_create
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - hog_flows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HogFlow'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HogFlow'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HogFlow'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - hog_flow:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HogFlow'
          description: ''
      deprecated: true
      x-explicit-tags:
      - workflows
  /api/environments/{environment_id}/hog_flows/{id}/:
    get:
      operationId: environments_hog_flows_retrieve
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
