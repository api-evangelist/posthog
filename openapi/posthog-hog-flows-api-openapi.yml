components:
  schemas:
    ExitConditionEnum:
      enum:
      - exit_on_conversion
      - exit_on_trigger_not_matched
      - exit_on_trigger_not_matched_or_conversion
      - exit_only_at_end
      type: string
      description: '* `exit_on_conversion` - Conversion

        * `exit_on_trigger_not_matched` - Trigger Not Matched

        * `exit_on_trigger_not_matched_or_conversion` - Trigger Not Matched Or Conversion

        * `exit_only_at_end` - Only At End'
    OnErrorEnum:
      enum:
      - continue
      - abort
      - complete
      - branch
      type: string
      description: '* `continue` - continue

        * `abort` - abort

        * `complete` - complete

        * `branch` - branch'
    HogFlowMinimal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          nullable: true
        description:
          type: string
          readOnly: true
        version:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/HogFlowStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        trigger:
          readOnly: true
        trigger_masking:
          readOnly: true
          nullable: true
        conversion:
          readOnly: true
          nullable: true
        exit_condition:
          allOf:
          - $ref: '#/components/schemas/ExitConditionEnum'
          readOnly: true
        edges:
          readOnly: true
        actions:
          readOnly: true
        abort_action:
          type: string
          readOnly: true
          nullable: true
        variables:
          readOnly: true
          nullable: true
        billable_action_types:
          readOnly: true
          nullable: true
      required:
      - abort_action
      - actions
      - billable_action_types
      - conversion
      - created_at
      - created_by
      - description
      - edges
      - exit_condition
      - id
      - name
      - status
      - trigger
      - trigger_masking
      - updated_at
      - variables
      - version
    HogFunctionFilters:
      type: object
      properties:
        source:
          allOf:
          - $ref: '#/components/schemas/HogFunctionFiltersSourceEnum'
          default: events
        actions:
          type: array
          items:
            type: object
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        data_warehouse:
          type: array
          items:
            type: object
            additionalProperties: true
        properties:
          type: array
          items:
            type: object
            additionalProperties: true
        bytecode:
          nullable: true
        transpiled: {}
        filter_test_accounts:
          type: boolean
        bytecode_error:
          type: string
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    AppMetricSeries:
      type: object
      properties:
        name:
          type: string
        values:
          type: array
          items:
            type: integer
      required:
      - name
      - values
    PatchedHogFlow:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          nullable: true
          maxLength: 400
        description:
          type: string
        version:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/HogFlowStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        trigger: {}
        trigger_masking:
          allOf:
          - $ref: '#/components/schemas/HogFlowMasking'
          nullable: true
        conversion:
          nullable: true
        exit_condition:
          $ref: '#/components/schemas/ExitConditionEnum'
        edges: {}
        actions:
          type: array
          items:
            $ref: '#/components/schemas/HogFlowAction'
        abort_action:
          type: string
          readOnly: true
          nullable: true
        variables:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        billable_action_types:
          readOnly: true
          nullable: true
    NullEnum:
      enum:
      - null
    PaginatedHogFlowScheduleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/HogFlowSchedule'
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          nullable: true
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type: boolean
          nullable: true
        hedgehog_config:
          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    AppMetricsTotalsResponse:
      type: object
      properties:
        totals:
          type: object
          additionalProperties:
            type: integer
      required:
      - totals
    HogFlow:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          nullable: true
          maxLength: 400
        description:
          type: string
        version:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/HogFlowStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        trigger: {}
        trigger_masking:
          allOf:
          - $ref: '#/components/schemas/HogFlowMasking'
          nullable: true
        conversion:
          nullable: true
        exit_condition:
          $ref: '#/components/schemas/ExitConditionEnum'
        edges: {}
        actions:
          type: array
          items:
            $ref: '#/components/schemas/HogFlowAction'
        abort_action:
          type: string
          readOnly: true
          nullable: true
        variables:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        billable_action_types:
          readOnly: true
          nullable: true
      required:
      - abort_action
      - actions
      - billable_action_types
      - created_at
      - created_by
      - id
      - updated_at
      - version
    BlastRadius:
      type: object
      properties:
        affected:
          type: integer
          description: Number of users matching the filters
        total:
          type: integer
          description: Total number of users
      required:
      - affected
      - total
    HogFlowSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        rrule:
          type: string
        starts_at:
          type: string
          format: date-time
        timezone:
          type: string
          maxLength: 64
        variables: {}
        status:
          allOf:
          - $ref: '#/components/schemas/HogFlowScheduleStatusEnum'
          readOnly: true
        next_run_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - next_run_at
      - rrule
      - starts_at
      - status
      - updated_at
    PaginatedHogFlowMinimalList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/HogFlowMinimal'
    HogFlowMasking:
      type: object
      properties:
        ttl:
          type: integer
          maximum: 94608000
          minimum: 60
          nullable: true
        threshold:
          type: integer
          nullable: true
        hash:
          type: string
        bytecode:
          nullable: true
      required:
      - hash
    HogFlowStatusEnum:
      enum:
      - draft
      - active
      - archived
      type: string
      description: '* `draft` - Draft

        * `active` - Active

        * `archived` - Archived'
    BlankEnum:
      enum:
      - ''
    HogFunctionFiltersSourceEnum:
      enum:
      - events
      - person-updates
      - data-warehouse-table
      type: string
      description: '* `events` - events

        * `person-updates` - person-updates

        * `data-warehouse-table` - data-warehouse-table'
    HogFlowScheduleStatusEnum:
      enum:
      - active
      - paused
      - completed
      type: string
      description: '* `active` - Active

        * `paused` - Paused

        * `completed` - Completed'
    AppMetricsResponse:
      type: object
      properties:
        labels:
          type: array
          items:
            type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/AppMetricSeries'
      required:
      - labels
      - series
    HogFlowAction:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 400
        description:
          type: string
          default: ''
        on_error:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/OnErrorEnum'
          - $ref: '#/components/schemas/NullEnum'
        created_at:
          type: integer
        updated_at:
          type: integer
        filters:
          allOf:
          - $ref: '#/components/schemas/HogFunctionFilters'
          nullable: true
        type:
          type: string
          maxLength: 100
        config: {}
        output_variable:
          nullable: true
      required:
      - config
      - id
      - name
      - type
    BlastRadiusRequest:
      type: object
      properties:
        filters:
          type: object
          additionalProperties: true
          description: Property filters to apply
        group_type_index:
          type: integer
          nullable: true
          description: Group type index for group-based targeting
      required:
      - filters
  parameters:
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
    ProjectIdPath:
