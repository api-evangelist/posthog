openapi: 3.0.3
info:
  title: PostHog actions advanced_activity_logs API
  version: 1.0.0
  description: ''
tags:
- name: advanced_activity_logs
paths:
  /api/projects/{project_id}/advanced_activity_logs/:
    get:
      operationId: advanced_activity_logs_list
      parameters:
      - in: query
        name: activities
        schema:
          type: array
          items:
            type: string
          default: []
      - in: query
        name: clients
        schema:
          type: array
          items:
            type: string
          default: []
      - in: query
        name: detail_filters
        schema:
          type: string
      - in: query
        name: end_date
        schema:
          type: string
          format: date-time
      - in: query
        name: hogql_filter
        schema:
          type: string
      - in: query
        name: is_system
        schema:
          type: boolean
          nullable: true
      - in: query
        name: item_ids
        schema:
          type: array
          items:
            type: string
          default: []
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        description: Page number for pagination. When provided, uses page-based pagination ordered by most recent first.
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
        description: 'Number of results per page (default: 100, max: 1000). Only used with page-based pagination.'
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: query
        name: scopes
        schema:
          type: array
          items:
            type: string
          default: []
      - in: query
        name: search_text
        schema:
          type: string
      - in: query
        name: start_date
        schema:
          type: string
          format: date-time
      - in: query
        name: users
        schema:
          type: array
          items:
            type: string
            format: uuid
          default: []
      - in: query
        name: was_impersonated
        schema:
          type: boolean
          nullable: true
      tags:
      - advanced_activity_logs
      security:
      - PersonalAPIKeyAuth:
        - activity_log:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityLogList'
          description: ''
      x-explicit-tags:
      - platform_features
  /api/projects/{project_id}/advanced_activity_logs/available_filters/:
    get:
      operationId: advanced_activity_logs_available_filters_retrieve
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - advanced_activity_logs
      security:
      - PersonalAPIKeyAuth:
        - activity_log:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableFiltersResponse'
          description: ''
      x-explicit-tags:
      - platform_features
  /api/projects/{project_id}/advanced_activity_logs/export/:
    post:
      operationId: advanced_activity_logs_export_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - advanced_activity_logs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityLog'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityLog'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityLog'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLog'
          description: ''
      x-explicit-tags:
      - platform_features
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    ActivityLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          $ref: '#/components/schemas/UserBasic'
        unread:
          type: boolean
          description: is the date of this log item newer than the user's bookmark
          readOnly: true
        organization_id:
          type: string
          format: uuid
          nullable: true
        was_impersonated:
          type: boolean
          nullable: true
        is_system:
          type: boolean
          nullable: true
        client:
          type: string
          nullable: true
          maxLength: 32
        activity:
          type: string
          maxLength: 79
        item_id:
          type: string
          nullable: true
          maxLength: 72
        scope:
          type: string
          maxLength: 79
        detail:
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - activity
      - id
      - scope
      - unread
      - user
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          nullable: true
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type: boolean
          nullable: true
        hedgehog_config:
          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    NullEnum:
      enum:
      - null
    StaticFilters:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Users who have logged activity.
        scopes:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Available activity scopes.
        activities:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Available activity types.
        clients:
          type: array
          items:
            type: object
            additionalProperties: true
          description: API clients that have generated activity (from x-posthog-client header).
      required:
      - activities
      - clients
      - scopes
      - users
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    PaginatedActivityLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLog'
    AvailableFiltersResponse:
      type: object
      properties:
        static_filters:
          allOf:
          - $ref: '#/components/schemas/StaticFilters'
          description: Pre-computed filter options for scopes, activities, and users.
        detail_fields:
          type: object
          additionalProperties: true
          description: Discovered detail fields and their value distributions.
      required:
      - detail_fields
      - static_filters
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
