        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        api_token:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        completed_snippet_onboarding:
