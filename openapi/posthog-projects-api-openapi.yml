openapi: 3.0.3
info:
  title: PostHog actions projects API
  version: 1.0.0
  description: ''
tags:
- name: projects
paths:
  /api/organizations/{organization_id}/projects/:
    get:
      operationId: organizations_projects_list
      description: Projects for the current organization.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/OrganizationIdPath'
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - projects
      security:
      - PersonalAPIKeyAuth:
        - project:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectBackwardCompatBasicList'
          description: ''
      x-explicit-tags:
      - core
    post:
      operationId: organizations_projects_create
      description: Projects for the current organization.
      parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectBackwardCompat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectBackwardCompat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectBackwardCompat'
      security:
      - PersonalAPIKeyAuth:
        - project:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBackwardCompat'
          description: ''
      x-explicit-tags:
      - core
  /api/organizations/{organization_id}/projects/{id}/:
    get:
      operationId: organizations_projects_retrieve
      description: Retrieve a project and its settings.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        description: A unique value identifying this project.
        required: true
      - $ref: '#/components/parameters/OrganizationIdPath'
      tags:
      - projects
      security:
      - PersonalAPIKeyAuth:
        - project:read
      responses:
        '200':
