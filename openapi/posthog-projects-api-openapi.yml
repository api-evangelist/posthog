          nullable: true
        survey_config:
          nullable: true
        access_control:
          type: boolean
        week_start_day:
          nullable: true
          description: 'First day of the week for date range filters. 0 = Sunday, 1 = Monday.


            * `0` - Sunday

            * `1` - Monday'
