openapi: 3.0.3
info:
  title: PostHog actions taggers API
  version: 1.0.0
  description: ''
tags:
- name: taggers
paths:
  /api/environments/{project_id}/taggers/:
    get:
      operationId: taggers_list
      parameters:
      - in: query
        name: enabled
        schema:
          type: boolean
        description: Filter by enabled status
      - in: query
        name: id__in
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: order_by
        schema:
          type: array
          items:
            type: string
            enum:
            - -created_at
            - -name
            - -updated_at
            - created_at
            - name
            - updated_at
        description: 'Ordering


          * `created_at` - Created At

          * `-created_at` - Created At (descending)

          * `updated_at` - Updated At

          * `-updated_at` - Updated At (descending)

          * `name` - Name

          * `-name` - Name (descending)'
        explode: false
        style: form
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: query
        name: search
        schema:
          type: string
        description: Search in name or description
      tags:
      - taggers
      security:
      - PersonalAPIKeyAuth:
        - tagger:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaggerList'
          description: ''
      x-explicit-tags:
      - llm_analytics
    post:
      operationId: taggers_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - taggers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tagger'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tagger'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Tagger'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - tagger:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tagger'
          description: ''
      x-explicit-tags:
      - llm_analytics
  /api/environments/{project_id}/taggers/{id}/:
    get:
      operationId: taggers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tagger.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - taggers
      security:
      - PersonalAPIKeyAuth:
        - tagger:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tagger'
          description: ''
      x-explicit-tags: []
    put:
      operationId: taggers_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tagger.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - taggers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tagger'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tagger'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Tagger'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - tagger:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tagger'
          description: ''
      x-explicit-tags: []
    patch:
      operationId: taggers_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tagger.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - taggers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTagger'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTagger'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTagger'
      security:
      - PersonalAPIKeyAuth:
        - tagger:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tagger'
          description: ''
      x-explicit-tags: []
    delete:
      operationId: taggers_destroy
      description: Hard delete of this model is not allowed. Use a patch API call to set "deleted" to true
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tagger.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - taggers
      security:
      - PersonalAPIKeyAuth:
        - tagger:write
      responses:
        '405':
          description: No response body
      x-explicit-tags: []
  /api/environments/{project_id}/taggers/test_hog/:
    post:
      operationId: taggers_test_hog_create
      description: Test Hog tagger code against sample events without saving.
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - taggers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tagger'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tagger'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Tagger'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tagger'
          description: ''
      x-explicit-tags:
      - llm_analytics
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    TaggerModelConfiguration:
      type: object
      description: Nested serializer for model configuration.
      properties:
        provider:
          $ref: '#/components/schemas/LLMProviderEnum'
        model:
          type: string
          maxLength: 100
        provider_key_id:
          type: string
          format: uuid
          nullable: true
        provider_key_name:
          type: string
          nullable: true
          readOnly: true
      required:
      - model
      - provider
      - provider_key_name
    Tagger:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 400
        description:
          type: string
        enabled:
          type: boolean
        tagger_type:
          allOf:
          - $ref: '#/components/schemas/TaggerTypeEnum'
          default: llm
        tagger_config:
          description: Tagger configuration (varies by tagger_type)
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TaggerCondition'
          description: Conditions that scope when the tagger runs
        model_configuration:
          allOf:
          - $ref: '#/components/schemas/TaggerModelConfiguration'
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        deleted:
          type: boolean
      required:
      - created_at
      - created_by
      - id
      - name
      - tagger_config
      - updated_at
    LLMProviderEnum:
      enum:
      - openai
      - anthropic
      - gemini
      - openrouter
      - fireworks
      - azure_openai
      - together_ai
      type: string
      description: '* `openai` - Openai

        * `anthropic` - Anthropic

        * `gemini` - Gemini

        * `openrouter` - Openrouter

        * `fireworks` - Fireworks

        * `azure_openai` - Azure OpenAI

        * `together_ai` - Together AI'
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          nullable: true
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type: boolean
          nullable: true
        hedgehog_config:
          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    TaggerCondition:
      type: object
      properties:
        id:
          type: string
          description: Stable identifier for this condition
          maxLength: 100
        rollout_percentage:
          type: integer
          maximum: 100
          minimum: 0
          default: 100
          description: Percentage of matching events to apply this condition to
        properties:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Property filters that scope when this condition fires
      required:
      - id
    PatchedTagger:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 400
        description:
          type: string
        enabled:
          type: boolean
        tagger_type:
          allOf:
          - $ref: '#/components/schemas/TaggerTypeEnum'
          default: llm
        tagger_config:
          description: Tagger configuration (varies by tagger_type)
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TaggerCondition'
          description: Conditions that scope when the tagger runs
        model_configuration:
          allOf:
          - $ref: '#/components/schemas/TaggerModelConfiguration'
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        deleted:
          type: boolean
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    TaggerTypeEnum:
      enum:
      - llm
      - hog
      type: string
      description: '* `llm` - LLM

        * `hog` - Hog'
    PaginatedTaggerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Tagger'
    NullEnum:
      enum:
      - null
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
