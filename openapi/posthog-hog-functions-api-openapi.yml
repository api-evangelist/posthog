          type: string
          default: day
          minLength: 1
        description: 'Time bucket size for the series. One of: hour, day, week. Defaults to ''day''.


          * `hour` - hour

          * `day` - day

          * `week` - week'
      - in: query
        name: kind
        schema:
          type: string
          minLength: 1
        description: Comma-separated metric kinds to filter by, e.g. 'success,failure'.
      - in: query
        name: name
        schema:
          type: string
          minLength: 1
        description: Comma-separated metric names to filter by.
      tags:
      - hog_functions
      security:
      - PersonalAPIKeyAuth:
        - hog_function:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppMetricsTotalsResponse'
          description: ''
      deprecated: true
      x-explicit-tags:
      - hog_functions
      - cdp
