openapi: 3.0.3
info:
  title: PostHog actions hog_functions API
  version: 1.0.0
  description: ''
tags:
- name: hog_functions
paths:
  /api/environments/{environment_id}/hog_functions/:
    get:
      operationId: environments_hog_functions_list
      parameters:
      - in: query
        name: created_at
        schema:
          type: string
          format: date-time
      - in: query
        name: created_by
        schema:
          type: integer
      - in: query
        name: enabled
        schema:
          type: boolean
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: query
        name: id
        schema:
          type: string
          format: uuid
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: updated_at
        schema:
          type: string
          format: date-time
      tags:
      - hog_functions
      security:
      - PersonalAPIKeyAuth:
        - hog_function:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHogFunctionMinimalList'
          description: ''
      deprecated: true
      x-explicit-tags:
      - hog_functions
      - cdp
    post:
      operationId: environments_hog_functions_create
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - hog_functions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HogFunction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HogFunction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HogFunction'
      security:
      - PersonalAPIKeyAuth:
        - hog_function:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HogFunction'
          description: ''
      deprecated: true
      x-explicit-tags:
      - hog_functions
      - cdp
  /api/environments/{environment_id}/hog_functions/{id}/:
    get:
      operationId: environments_hog_functions_retrieve
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this hog function.
        required: true
      tags:
      - hog_functions
      security:
      - PersonalAPIKeyAuth:
        - hog_function:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HogFunction'
          description: ''
      deprecated: true
      x-explicit-tags:
      - hog_functions
      - cdp
    put:
      operationId: environments_hog_functions_update
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this hog function.
        required: true
      tags:
      - hog_functions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HogFunction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HogFunction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HogFunction'
      security:
      - PersonalAPIKeyAuth:
        - hog_function:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HogFunction'
          description: ''
      deprecated: true
      x-explicit-tags:
      - hog_functions
      - cdp
    patch:
      operationId: environments_hog_functions_partial_update
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this hog function.
        required: true
      tags:
      - hog_functions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHogFunction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHogFunction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHogFunction'
      security:
      - PersonalAPIKeyAuth:
        - hog_function:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HogFunction'
          description: ''
      deprecated: true
      x-explicit-tags:
      - hog_functions
      - cdp
    delete:
      operationId: environments_hog_functions_destroy
      description: Hard delete of this model is not allowed. Use a patch API call to set "deleted" to true
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this hog function.
        required: true
      tags:
      - hog_functions
      responses:
        '405':
          description: No response body
      deprecated: true
      x-explicit-tags:
      - hog_functions
      - cdp
