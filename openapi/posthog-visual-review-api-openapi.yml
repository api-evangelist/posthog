openapi: 3.2.0
info:
  title: PostHog Visual Review API
  version: 1.0.0
  description: ''
tags:
- name: visual_review
paths:
  /api/projects/{project_id}/visual_review/repos/:
    get:
      operationId: visual_review_repos_list
      description: List all projects for the team.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRepoList'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review repos list
      x-summary-source: derived
    post:
      operationId: visual_review_repos_create
      description: Create a new repo.
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepoInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateRepoInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateRepoInput'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - visual_review:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repo'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review repos create
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/repos/{id}/:
    get:
      operationId: visual_review_repos_retrieve
      description: Get a repo by ID.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repo'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review repos retrieve
      x-summary-source: derived
    patch:
      operationId: visual_review_repos_partial_update
      description: Update a repo's settings.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateRepoRequestInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateRepoRequestInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateRepoRequestInput'
      security:
      - PersonalAPIKeyAuth:
        - visual_review:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repo'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review repos partial update
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/repos/{id}/baselines/:
    get:
      operationId: visual_review_repos_baselines_retrieve
      description: 'Snapshots overview for a repo: every identifier with a current baseline (latest non-superseded master/main run per run_type), plus tolerate counts, active quarantine state, and a 30-day stability sparkline. Capped at 5000 entries — sets `truncated` and returns the most recently active when exceeded. Filtering / faceting / search are all done client-side; this endpoint takes no filter query params.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineOverview'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review repos baselines retrieve
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/repos/{id}/quarantine/:
    get:
      operationId: visual_review_repos_quarantine_list
      description: 'List quarantined identifiers. Without filter: active only. With identifier: full history.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: identifier
        schema:
          type: string
        description: Filter by identifier (returns full history)
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: query
        name: run_type
        schema:
          type: string
        description: Filter by run type
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuarantinedIdentifierEntryList'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review repos quarantine list
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/repos/{id}/quarantine/{run_type}/:
    post:
      operationId: visual_review_repos_quarantine_create
      description: Quarantine a snapshot identifier for a specific run type.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: path
        name: run_type
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - visual_review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuarantineInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuarantineInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuarantineInput'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - visual_review:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantinedIdentifierEntry'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review repos quarantine create
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/repos/{id}/quarantine/{run_type}/expire/:
    post:
      operationId: visual_review_repos_quarantine_expire_create
      description: Expire all active quarantine entries for an identifier.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: path
        name: run_type
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - visual_review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuarantineInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuarantineInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuarantineInput'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - visual_review:write
      responses:
        '204':
          description: No response body
      x-explicit-tags:
      - visual_review
      summary: Visual review repos quarantine expire create
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/repos/{id}/thumbnails/{identifier}/:
    get:
      operationId: visual_review_repos_thumbnails_retrieve
      description: Serve a snapshot thumbnail by identifier. Returns WebP with ETag caching.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: identifier
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          description: WebP thumbnail image
      x-explicit-tags:
      - visual_review
      summary: Visual review repos thumbnails retrieve
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/repos/{repo_id}/runs/:
    get:
      operationId: visual_review_repos_runs_list
      description: List runs in this repo, optionally filtered by review state.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: path
        name: repo_id
        schema:
          type: string
        required: true
      - in: query
        name: review_state
        schema:
          type: string
        description: Filter by review state
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRunList'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review repos runs list
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/repos/{repo_id}/runs/counts/:
    get:
      operationId: visual_review_repos_runs_counts_retrieve
      description: Review state counts for runs in this repo.
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: path
        name: repo_id
        schema:
          type: string
        required: true
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStateCounts'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review repos runs counts retrieve
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/repos/{repo_id}/snapshots/{run_type}/{identifier}/:
    get:
      operationId: visual_review_repos_snapshots_list
      description: Deduped baseline timeline for a snapshot identity. Newest first.
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
        description: Snapshot identifier; clients must percent-encode before sending
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: path
        name: repo_id
        schema:
          type: string
        required: true
      - in: path
        name: run_type
        schema:
          type: string
        description: Run type (storybook, playwright)
        required: true
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSnapshotHistoryEntryList'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review repos snapshots list
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/runs/:
    get:
      operationId: visual_review_runs_list
      description: List runs for the team, optionally filtered by review state, PR number, commit SHA, or branch.
      parameters:
      - in: query
        name: branch
        schema:
          type: string
        description: Filter by branch name
      - in: query
        name: commit_sha
        schema:
          type: string
        description: Filter by full commit SHA
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: pr_number
        schema:
          type: integer
        description: Filter by GitHub PR number
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: query
        name: review_state
        schema:
          type: string
        description: Filter by review state
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRunList'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs list
      x-summary-source: derived
    post:
      operationId: visual_review_runs_create
      description: Create a new run from a CI manifest.
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateRunInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateRunInput'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - visual_review:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResult'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs create
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/runs/{id}/:
    get:
      operationId: visual_review_runs_retrieve
      description: Get run status and summary.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs retrieve
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/runs/{id}/add-snapshots/:
    post:
      operationId: visual_review_runs_add_snapshots_create
      description: Add a batch of snapshots to a pending run (shard-based flow).
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSnapshotsInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddSnapshotsInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddSnapshotsInput'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - visual_review:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddSnapshotsResult'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs add snapshots create
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/runs/{id}/approve/:
    post:
      operationId: visual_review_runs_approve_create
      description: 'Approve visual changes for snapshots in this run.


        With approve_all=true, approves all changed+new snapshots and returns

        signed baseline YAML. With specific snapshots, approves only those.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRunRequestInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApproveRunRequestInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApproveRunRequestInput'
      security:
      - PersonalAPIKeyAuth:
        - visual_review:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoApproveResult'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs approve create
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/runs/{id}/auto-approve/:
    post:
      operationId: visual_review_runs_auto_approve_create
      description: 'CLI auto-approve: approve all and return baseline YAML for local write.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:write
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoApproveResult'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs auto approve create
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/runs/{id}/complete/:
    post:
      operationId: visual_review_runs_complete_create
      description: 'Complete a run: detect removals, verify uploads, trigger diff processing.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs complete create
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/runs/{id}/recompute/:
    post:
      operationId: visual_review_runs_recompute_create
      description: Re-evaluate quarantine and counts, update commit status, and optionally rerun the CI job.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecomputeResult'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs recompute create
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/runs/{id}/snapshot-history/:
    get:
      operationId: visual_review_runs_snapshot_history_list
      description: Recent change history for a snapshot identifier across runs.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: identifier
        schema:
          type: string
        description: Snapshot identifier
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSnapshotHistoryEntryList'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs snapshot history list
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/runs/{id}/snapshots/:
    get:
      operationId: visual_review_runs_snapshots_list
      description: Get all snapshots for a run with diff results.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSnapshotList'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs snapshots list
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/runs/{id}/tolerate/:
    post:
      operationId: visual_review_runs_tolerate_create
      description: Mark a changed snapshot as a known tolerated alternate.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkToleratedInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarkToleratedInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkToleratedInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs tolerate create
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/runs/{id}/tolerated-hashes/:
    get:
      operationId: visual_review_runs_tolerated_hashes_list
      description: List known tolerated hashes for a snapshot identifier.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: identifier
        schema:
          type: string
        description: Snapshot identifier
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedToleratedHashEntryList'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs tolerated hashes list
      x-summary-source: derived
  /api/projects/{project_id}/visual_review/runs/counts/:
    get:
      operationId: visual_review_runs_counts_retrieve
      description: Review state counts for the runs list.
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - visual_review
      security:
      - PersonalAPIKeyAuth:
        - visual_review:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStateCounts'
          description: ''
      x-explicit-tags:
      - visual_review
      summary: Visual review runs counts retrieve
      x-summary-source: derived
components:
  schemas:
    PaginatedQuarantinedIdentifierEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
