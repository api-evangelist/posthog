            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInsightVariableList'
          description: ''
      x-explicit-tags:
      - data_warehouse
    post:
      operationId: insight_variables_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - insight_variables
      requestBody:
        content:
          application/json:
            schema:
