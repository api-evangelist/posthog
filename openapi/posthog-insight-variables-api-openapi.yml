        - insight_variable:write
      responses:
        '204':
          description: No response body
      x-explicit-tags:
      - data_warehouse
components:
  schemas:
    PatchedInsightVariable:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: UUID of the SQL variable.
        name:
          type: string
          description: Human-readable name for the SQL variable.
          maxLength: 400
        type:
          allOf:
          - $ref: '#/components/schemas/InsightVariableTypeEnum'
          description: 'Variable type. Controls how the value is rendered and substituted in HogQL.


            * `String` - String

            * `Number` - Number

            * `Boolean` - Boolean

            * `List` - List

            * `Date` - Date'
        default_value:
          nullable: true
          description: Default value used when a query references this variable.
        created_by:
          type: integer
          readOnly: true
          nullable: true
          description: ID of the user who created the SQL variable.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the SQL variable was created.
        code_name:
          type: string
          readOnly: true
          nullable: true
          description: Generated code-safe name used in HogQL as {variables.code_name}. Derived from name.
        values:
          nullable: true
          description: Allowed values for List variables. Null for other variable types.
    InsightVariable:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: UUID of the SQL variable.
        name:
          type: string
          description: Human-readable name for the SQL variable.
          maxLength: 400
        type:
          allOf:
          - $ref: '#/components/schemas/InsightVariableTypeEnum'
          description: 'Variable type. Controls how the value is rendered and substituted in HogQL.


            * `String` - String

            * `Number` - Number

            * `Boolean` - Boolean

            * `List` - List

            * `Date` - Date'
        default_value:
          nullable: true
          description: Default value used when a query references this variable.
        created_by:
          type: integer
          readOnly: true
          nullable: true
          description: ID of the user who created the SQL variable.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the SQL variable was created.
        code_name:
          type: string
          readOnly: true
          nullable: true
          description: Generated code-safe name used in HogQL as {variables.code_name}. Derived from name.
        values:
          nullable: true
          description: Allowed values for List variables. Null for other variable types.
      required:
      - code_name
      - created_at
      - created_by
      - id
      - name
      - type
    PaginatedInsightVariableList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/InsightVariable'
    InsightVariableTypeEnum:
      enum:
      - String
      - Number
      - Boolean
      - List
      - Date
      type: string
      description: '* `String` - String

        * `Number` - Number

        * `Boolean` - Boolean

        * `List` - List

        * `Date` - Date'
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
