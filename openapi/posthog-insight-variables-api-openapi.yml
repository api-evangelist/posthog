          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InsightVariable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InsightVariable'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - insight_variable:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightVariable'
          description: ''
      x-explicit-tags:
      - data_warehouse
  /api/projects/{project_id}/insight_variables/{id}/:
    get:
      operationId: insight_variables_retrieve
      parameters:
