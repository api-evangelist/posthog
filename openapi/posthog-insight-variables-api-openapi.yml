        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightVariable'
          description: ''
      x-explicit-tags:
      - data_warehouse
    put:
      operationId: insight_variables_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this insight variable.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - insight_variables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightVariable'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InsightVariable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InsightVariable'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - insight_variable:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightVariable'
          description: ''
      x-explicit-tags:
      - data_warehouse
    patch:
      operationId: insight_variables_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this insight variable.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - insight_variables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInsightVariable'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInsightVariable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInsightVariable'
      security:
      - PersonalAPIKeyAuth:
        - insight_variable:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightVariable'
          description: ''
      x-explicit-tags:
      - data_warehouse
    delete:
      operationId: insight_variables_destroy
