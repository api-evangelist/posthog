openapi: 3.0.3
info:
  title: PostHog actions insight_variables API
  version: 1.0.0
  description: ''
tags:
- name: insight_variables
paths:
  /api/environments/{environment_id}/insight_variables/:
    get:
      operationId: environments_insight_variables_list
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - insight_variables
      security:
      - PersonalAPIKeyAuth:
        - insight_variable:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInsightVariableList'
          description: ''
      deprecated: true
      x-explicit-tags:
      - data_warehouse
    post:
      operationId: environments_insight_variables_create
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - insight_variables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightVariable'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InsightVariable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InsightVariable'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - insight_variable:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightVariable'
          description: ''
      deprecated: true
      x-explicit-tags:
      - data_warehouse
  /api/environments/{environment_id}/insight_variables/{id}/:
    get:
      operationId: environments_insight_variables_retrieve
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this insight variable.
        required: true
      tags:
      - insight_variables
      security:
      - PersonalAPIKeyAuth:
        - insight_variable:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightVariable'
          description: ''
      deprecated: true
      x-explicit-tags:
      - data_warehouse
    put:
      operationId: environments_insight_variables_update
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this insight variable.
        required: true
      tags:
      - insight_variables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightVariable'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InsightVariable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InsightVariable'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - insight_variable:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightVariable'
          description: ''
      deprecated: true
      x-explicit-tags:
      - data_warehouse
    patch:
      operationId: environments_insight_variables_partial_update
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this insight variable.
        required: true
      tags:
      - insight_variables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInsightVariable'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInsightVariable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInsightVariable'
      security:
      - PersonalAPIKeyAuth:
        - insight_variable:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightVariable'
          description: ''
      deprecated: true
      x-explicit-tags:
      - data_warehouse
    delete:
      operationId: environments_insight_variables_destroy
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this insight variable.
        required: true
      tags:
      - insight_variables
      security:
      - PersonalAPIKeyAuth:
        - insight_variable:write
      responses:
        '204':
          description: No response body
      deprecated: true
      x-explicit-tags:
      - data_warehouse
  /api/projects/{project_id}/insight_variables/:
    get:
      operationId: insight_variables_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - insight_variables
