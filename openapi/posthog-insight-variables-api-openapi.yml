        schema:
          type: string
          format: uuid
        description: A UUID string identifying this insight variable.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - insight_variables
      security:
      - PersonalAPIKeyAuth:
        - insight_variable:read
