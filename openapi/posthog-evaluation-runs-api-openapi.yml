openapi: 3.0.3
info:
  title: PostHog actions evaluation_runs API
  version: 1.0.0
  description: ''
tags:
- name: evaluation_runs
paths:
  /api/environments/{project_id}/evaluation_runs/:
    post:
      operationId: evaluation_runs_create
      description: 'Create a new evaluation run.


        This endpoint validates the request and enqueues a Temporal workflow

        to asynchronously execute the evaluation.'
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - evaluation_runs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRunRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EvaluationRunRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvaluationRunRequest'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - evaluation:write
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: ''
      x-explicit-tags:
      - llm_analytics
components:
  schemas:
    EvaluationRunRequest:
      type: object
      properties:
        evaluation_id:
          type: string
          format: uuid
          description: UUID of the evaluation to run.
        target_event_id:
          type: string
          format: uuid
          description: UUID of the $ai_generation event to evaluate.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the target event (needed for efficient ClickHouse lookup).
        event:
          type: string
          default: $ai_generation
          description: Event name. Defaults to '$ai_generation'.
        distinct_id:
          type: string
          nullable: true
          description: Distinct ID of the event (optional, improves lookup performance).
      required:
      - evaluation_id
      - target_event_id
      - timestamp
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
