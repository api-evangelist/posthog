components:
  schemas:
    PaginatedNotebookMinimalList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/NotebookMinimal'
    BlankEnum:
      enum:
      - ''
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          nullable: true
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type: boolean
          nullable: true
        hedgehog_config:
          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    PatchedNotebook:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: UUID of the notebook.
        short_id:
          type: string
          readOnly: true
          description: Short alphanumeric identifier used in URLs and API lookups.
        title:
          type: string
          nullable: true
          description: Title of the notebook.
          maxLength: 256
        content:
          nullable: true
          description: Notebook content as a ProseMirror JSON document structure.
        text_content:
          type: string
          nullable: true
          description: Plain text representation of the notebook content for search.
        version:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Version number for optimistic concurrency control. Must match the current version when updating content.
        deleted:
          type: boolean
          description: Whether the notebook has been soft-deleted.
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        last_modified_at:
          type: string
          format: date-time
          readOnly: true
        last_modified_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        user_access_level:
          type: string
          nullable: true
          readOnly: true
          description: The effective access level the user has for this object
        _create_in_folder:
          type: string
          writeOnly: true
          title: ' create in folder'
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    NotebookMinimal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: UUID of the notebook.
        short_id:
          type: string
          readOnly: true
          description: Short alphanumeric identifier used in URLs and API lookups.
        title:
          type: string
          readOnly: true
          nullable: true
          description: Title of the notebook.
        deleted:
          type: boolean
          readOnly: true
          description: Whether the notebook has been soft-deleted.
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        last_modified_at:
          type: string
          format: date-time
          readOnly: true
        last_modified_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        user_access_level:
          type: string
          nullable: true
          readOnly: true
          description: The effective access level the user has for this object
        _create_in_folder:
          type: string
          writeOnly: true
          title: ' create in folder'
      required:
      - created_at
      - created_by
      - deleted
      - id
      - last_modified_at
      - last_modified_by
      - short_id
      - title
      - user_access_level
    NotebookCollabSave:
      type: object
      properties:
        client_id:
          type: string
          description: Unique identifier for the client session.
        version:
          type: integer
          description: The collab version the client's steps are based on.
        steps:
          type: array
          items: {}
          description: List of ProseMirror step JSON objects to apply.
        content:
          description: The resulting ProseMirror document after applying the steps locally.
        text_content:
          type: string
          default: ''
          description: Plain text for search indexing.
        title:
          type: string
          description: Updated notebook title.
        cursor_head:
          type: integer
          nullable: true
          description: ProseMirror cursor head position after applying steps.
      required:
      - client_id
      - content
      - steps
      - version
    Notebook:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: UUID of the notebook.
        short_id:
          type: string
          readOnly: true
          description: Short alphanumeric identifier used in URLs and API lookups.
        title:
          type: string
          nullable: true
          description: Title of the notebook.
          maxLength: 256
        content:
          nullable: true
          description: Notebook content as a ProseMirror JSON document structure.
        text_content:
          type: string
          nullable: true
          description: Plain text representation of the notebook content for search.
        version:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Version number for optimistic concurrency control. Must match the current version when updating content.
        deleted:
          type: boolean
          description: Whether the notebook has been soft-deleted.
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        last_modified_at:
          type: string
          format: date-time
          readOnly: true
        last_modified_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        user_access_level:
          type: string
          nullable: true
          readOnly: true
          description: The effective access level the user has for this object
        _create_in_folder:
          type: string
          writeOnly: true
          title: ' create in folder'
      required:
      - created_at
      - created_by
      - id
      - last_modified_at
      - last_modified_by
      - short_id
      - user_access_level
    NullEnum:
      enum:
      - null
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
