components:
  schemas:
    HogQLPropertyFilter:
      additionalProperties: false
      properties:
        key:
          title: Key
          type: string
        label:
          default: null
          title: Label
          type: string
          nullable: true
        type:
          default: hogql
          title: Type
          type: string
          enum:
          - hogql
        value:
          default: null
          title: Value
          anyOf:
          - items:
              anyOf:
              - type: string
              - type: number
              - type: boolean
            type: array
          - type: string
          - type: number
          - type: boolean
          nullable: true
      required:
      - key
      title: HogQLPropertyFilter
      type: object
    ErrorTrackingStackFrame:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        raw_id:
          type: string
          description: Raw frame ID in 'hash/part' format
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        contents: {}
        resolved:
          type: boolean
        context:
          nullable: true
        symbol_set_ref:
          type: string
        release:
          allOf:
          - $ref: '#/components/schemas/ErrorTrackingRelease'
          readOnly: true
      required:
      - contents
      - created_at
      - id
      - raw_id
      - release
      - resolved
    PaginatedErrorTrackingReleaseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ErrorTrackingRelease'
    ErrorTrackingIssueSplitRequest:
      type: object
      properties:
        fingerprints:
          type: array
          items:
            $ref: '#/components/schemas/ErrorTrackingIssueSplitFingerprint'
          description: Fingerprints to split into new issues. Each fingerprint becomes its own new issue.
    ErrorTrackingExternalReferenceIntegrationResult:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
      - kind
    ErrorTrackingIssueMergeResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the merge completed successfully.
      required:
      - success
    PaginatedErrorTrackingStackFrameList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ErrorTrackingStackFrame'
    ErrorTrackingGroupingRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        filters: {}
        assignee:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
              - user
              - role
            id:
              oneOf:
              - type: integer
              - type: string
                format: uuid
          readOnly: true
        description:
          type: string
          nullable: true
        issue:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Issue linked to this rule
          readOnly: true
        order_key:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        disabled_data:
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assignee
      - created_at
      - filters
      - id
      - issue
      - order_key
      - updated_at
    RevenueAnalyticsPropertyFilter:
      additionalProperties: false
      properties:
        key:
          title: Key
          type: string
        label:
          default: null
          title: Label
          type: string
          nullable: true
        operator:
          $ref: '#/components/schemas/PropertyOperator'
        type:
          default: revenue_analytics
          title: Type
          type: string
          enum:
          - revenue_analytics
        value:
          default: null
          title: Value
          anyOf:
          - items:
              anyOf:
              - type: string
              - type: number
              - type: boolean
            type: array
          - type: string
          - type: number
          - type: boolean
          nullable: true
      required:
      - key
      - operator
      title: RevenueAnalyticsPropertyFilter
      type: object
    ErrorTrackingIssueAssignment:
      type: object
      properties:
        id:
          oneOf:
          - type: integer
          - type: string
          nullable: true
          readOnly: true
        type:
          type: string
          readOnly: true
      required:
      - id
      - type
    Key10:
      enum:
      - tag_name
      - text
      - href
      - selector
      title: Key10
      type: string
    ErrorTrackingRecommendation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          readOnly: true
        meta:
          readOnly: true
        computed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        dismissed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        next_refresh_at:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - computed_at
      - created_at
      - dismissed_at
      - id
      - meta
      - next_refresh_at
      - type
      - updated_at
    ErrorTrackingAssignmentRuleUpdateRequest:
      type: object
      properties:
        filters:
          allOf:
          - $ref: '#/components/schemas/PropertyGroupFilterValue'
          nullable: true
          description: Property-group filters that define when this rule matches incoming error events.
        assignee:
          allOf:
          - $ref: '#/components/schemas/ErrorTrackingAssignmentRuleAssigneeRequest'
          nullable: true
          description: User or role to assign matching issues to.
    DurationType:
      enum:
      - duration
      - active_seconds
      - inactive_seconds
      title: DurationType
      type: string
    PatchedErrorTrackingSpikeDetectionConfig:
      type: object
      properties:
        snooze_duration_minutes:
          type: integer
          minimum: 1
          description: Time to wait before alerting again for the same issue after a spike is detected.
        multiplier:
          type: integer
          minimum: 1
          description: The factor by which the current exception count must exceed the baseline to be considered a spike.
        threshold:
          type: integer
          minimum: 1
          description: The minimum number of exceptions required in a 5-minute window before a spike can be detected.
    ErrorTrackingIssueSplitResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the split completed successfully.
        new_issue_ids:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of the new issues created by the split.
      required:
      - new_issue_ids
      - success
    ElementPropertyFilter:
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/Key10'
        label:
          default: null
          title: Label
          type: string
