openapi: 3.0.3
info:
  title: PostHog actions managed_viewsets API
  version: 1.0.0
  description: ''
tags:
- name: managed_viewsets
paths:
  /api/environments/{project_id}/managed_viewsets/{kind}/:
    get:
      operationId: managed_viewsets_retrieve
      description: 'Get all views associated with a specific managed viewset.

        GET /api/environments/{team_id}/managed_viewsets/{kind}/'
      parameters:
      - in: path
        name: kind
        schema:
          enum:
          - revenue_analytics
          type: string
          description: '* `revenue_analytics` - Revenue Analytics'
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - managed_viewsets
      security:
      - PersonalAPIKeyAuth:
        - warehouse_view:read
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - data_warehouse
    put:
      operationId: managed_viewsets_update
      description: 'Enable or disable a managed viewset by kind.

        PUT /api/environments/{team_id}/managed_viewsets/{kind}/ with body {"enabled": true/false}'
      parameters:
      - in: path
        name: kind
        schema:
          enum:
          - revenue_analytics
          type: string
          description: '* `revenue_analytics` - Revenue Analytics'
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - managed_viewsets
      security:
      - PersonalAPIKeyAuth:
        - warehouse_view:write
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - data_warehouse
components:
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
