openapi: 3.0.3
info:
  title: PostHog actions sandbox-environments API
  version: 1.0.0
  description: ''
tags:
- name: sandbox-environments
paths:
  /api/projects/{project_id}/sandbox_environments/:
    get:
      operationId: sandbox_list
      description: API for managing sandbox environments that control network access for task runs.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - sandbox-environments
      security:
      - PersonalAPIKeyAuth:
        - task:read
      - PersonalAPIKeyAuth:
        - task:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSandboxEnvironmentListList'
          description: ''
      x-explicit-tags:
      - sandbox-environments
      - tasks
    post:
      operationId: sandbox_create
      description: API for managing sandbox environments that control network access for task runs.
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - sandbox-environments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxEnvironment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SandboxEnvironment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SandboxEnvironment'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxEnvironment'
          description: ''
      x-explicit-tags:
      - sandbox-environments
      - tasks
  /api/projects/{project_id}/sandbox_environments/{id}/:
    get:
      operationId: sandbox_retrieve
      description: API for managing sandbox environments that control network access for task runs.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this sandbox environment.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - sandbox-environments
      security:
      - PersonalAPIKeyAuth:
        - task:read
      - PersonalAPIKeyAuth:
        - task:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxEnvironment'
          description: ''
      x-explicit-tags:
      - sandbox-environments
    patch:
      operationId: sandbox_partial_update
      description: API for managing sandbox environments that control network access for task runs.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this sandbox environment.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - sandbox-environments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSandboxEnvironment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSandboxEnvironment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSandboxEnvironment'
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxEnvironment'
          description: ''
      x-explicit-tags:
      - sandbox-environments
    delete:
      operationId: sandbox_destroy
      description: API for managing sandbox environments that control network access for task runs.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this sandbox environment.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - sandbox-environments
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '204':
          description: No response body
      x-explicit-tags:
      - sandbox-environments
components:
  schemas:
    PaginatedSandboxEnvironmentListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/SandboxEnvironmentList'
    BlankEnum:
      enum:
      - ''
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          nullable: true
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type: boolean
          nullable: true
        hedgehog_config:
          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    SandboxEnvironment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        network_access_level:
          $ref: '#/components/schemas/NetworkAccessLevelEnum'
        allowed_domains:
          type: array
          items:
            type: string
            maxLength: 255
          description: List of allowed domains for custom network access
        include_default_domains:
          type: boolean
          description: Whether to include default trusted domains (GitHub, npm, PyPI)
        repositories:
          type: array
          items:
            type: string
            maxLength: 255
          description: 'List of repositories this environment applies to (format: org/repo)'
        environment_variables:
          writeOnly: true
          description: Encrypted environment variables (write-only, never returned in responses)
        has_environment_variables:
          type: boolean
          readOnly: true
          description: Whether this environment has any environment variables set
        private:
          type: boolean
          description: If true, only the creator can see this environment. Otherwise visible to whole team.
        internal:
          type: boolean
          readOnly: true
          description: If true, this environment is for internal use (e.g. signals pipeline) and should not be exposed to end users.
        effective_domains:
          type: array
          items:
            type: string
          readOnly: true
          description: Computed domain allowlist based on network_access_level and allowed_domains
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - effective_domains
      - has_environment_variables
      - id
      - internal
      - name
      - updated_at
    SandboxEnvironmentList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        network_access_level:
          $ref: '#/components/schemas/NetworkAccessLevelEnum'
        allowed_domains:
          type: array
          items:
            type: string
            maxLength: 255
          description: List of allowed domains for custom network access
        repositories:
          type: array
          items:
            type: string
            maxLength: 255
          description: 'List of repositories this environment applies to (format: org/repo)'
        private:
          type: boolean
          description: If true, only the creator can see this environment. Otherwise visible to whole team.
        internal:
          type: boolean
          description: If true, this environment is for internal use (e.g. signals pipeline) and should not be exposed to end users.
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - name
      - updated_at
    PatchedSandboxEnvironment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        network_access_level:
          $ref: '#/components/schemas/NetworkAccessLevelEnum'
        allowed_domains:
          type: array
          items:
            type: string
            maxLength: 255
          description: List of allowed domains for custom network access
        include_default_domains:
          type: boolean
          description: Whether to include default trusted domains (GitHub, npm, PyPI)
        repositories:
          type: array
          items:
            type: string
            maxLength: 255
          description: 'List of repositories this environment applies to (format: org/repo)'
        environment_variables:
          writeOnly: true
          description: Encrypted environment variables (write-only, never returned in responses)
        has_environment_variables:
          type: boolean
          readOnly: true
          description: Whether this environment has any environment variables set
        private:
          type: boolean
          description: If true, only the creator can see this environment. Otherwise visible to whole team.
        internal:
          type: boolean
          readOnly: true
          description: If true, this environment is for internal use (e.g. signals pipeline) and should not be exposed to end users.
        effective_domains:
          type: array
          items:
            type: string
          readOnly: true
          description: Computed domain allowlist based on network_access_level and allowed_domains
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    NetworkAccessLevelEnum:
      enum:
      - trusted
      - full
      - custom
      type: string
      description: '* `trusted` - Trusted

        * `full` - Full

        * `custom` - Custom'
    NullEnum:
      enum:
      - null
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
