openapi: 3.0.3
info:
  title: PostHog actions health_issues API
  version: 1.0.0
  description: ''
tags:
- name: health_issues
paths:
  /api/environments/{project_id}/health_issues/:
    get:
      operationId: health_issues_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - health_issues
      security:
      - PersonalAPIKeyAuth:
        - health_issue:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHealthIssueList'
          description: ''
      x-explicit-tags: []
  /api/environments/{project_id}/health_issues/{id}/:
    get:
      operationId: health_issues_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this health issue.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - health_issues
      security:
      - PersonalAPIKeyAuth:
        - health_issue:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthIssue'
          description: ''
      x-explicit-tags: []
    patch:
      operationId: health_issues_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this health issue.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - health_issues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHealthIssue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHealthIssue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHealthIssue'
      security:
      - PersonalAPIKeyAuth:
        - health_issue:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthIssue'
          description: ''
      x-explicit-tags: []
  /api/environments/{project_id}/health_issues/{id}/resolve/:
    post:
      operationId: health_issues_resolve_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this health issue.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - health_issues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthIssue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HealthIssue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HealthIssue'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthIssue'
          description: ''
      x-explicit-tags: []
  /api/environments/{project_id}/health_issues/summary/:
    get:
      operationId: health_issues_summary_retrieve
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - health_issues
      security:
      - PersonalAPIKeyAuth:
        - health_issue:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthIssue'
          description: ''
      x-explicit-tags: []
components:
  schemas:
    HealthIssueStatusEnum:
      enum:
      - active
      - resolved
      type: string
      description: '* `active` - Active

        * `resolved` - Resolved'
    HealthIssue:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/HealthIssueSeverityEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/HealthIssueStatusEnum'
          readOnly: true
        dismissed:
          type: boolean
        payload:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - kind
      - payload
      - resolved_at
      - severity
      - status
      - updated_at
    HealthIssueSeverityEnum:
      enum:
      - critical
      - warning
      - info
      type: string
      description: '* `critical` - Critical

        * `warning` - Warning

        * `info` - Info'
    PatchedHealthIssue:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/HealthIssueSeverityEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/HealthIssueStatusEnum'
          readOnly: true
        dismissed:
          type: boolean
        payload:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    PaginatedHealthIssueList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/HealthIssue'
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
