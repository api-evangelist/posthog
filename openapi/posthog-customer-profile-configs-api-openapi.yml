openapi: 3.0.3
info:
  title: PostHog actions customer_profile_configs API
  version: 1.0.0
  description: ''
tags:
- name: customer_profile_configs
paths:
  /api/environments/{project_id}/customer_profile_configs/:
    get:
      operationId: customer_profile_configs_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - customer_profile_configs
      security:
      - PersonalAPIKeyAuth:
        - customer_profile_config:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerProfileConfigList'
          description: ''
      x-explicit-tags:
      - customer_analytics
    post:
      operationId: customer_profile_configs_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - customer_profile_configs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfileConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerProfileConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerProfileConfig'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - customer_profile_config:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileConfig'
          description: ''
      x-explicit-tags:
      - customer_analytics
  /api/environments/{project_id}/customer_profile_configs/{id}/:
    get:
      operationId: customer_profile_configs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this customer profile config.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - customer_profile_configs
      security:
      - PersonalAPIKeyAuth:
        - customer_profile_config:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileConfig'
          description: ''
      x-explicit-tags: []
    put:
      operationId: customer_profile_configs_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this customer profile config.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - customer_profile_configs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfileConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerProfileConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerProfileConfig'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - customer_profile_config:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileConfig'
          description: ''
      x-explicit-tags: []
    patch:
      operationId: customer_profile_configs_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this customer profile config.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - customer_profile_configs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomerProfileConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomerProfileConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomerProfileConfig'
      security:
      - PersonalAPIKeyAuth:
        - customer_profile_config:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileConfig'
          description: ''
      x-explicit-tags: []
    delete:
      operationId: customer_profile_configs_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this customer profile config.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - customer_profile_configs
      security:
      - PersonalAPIKeyAuth:
        - customer_profile_config:write
      responses:
        '204':
          description: No response body
      x-explicit-tags: []
components:
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  schemas:
    CustomerProfileConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        scope:
          $ref: '#/components/schemas/CustomerProfileConfigScopeEnum'
        content:
          nullable: true
        sidebar:
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - scope
      - updated_at
    PaginatedCustomerProfileConfigList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/CustomerProfileConfig'
    PatchedCustomerProfileConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        scope:
          $ref: '#/components/schemas/CustomerProfileConfigScopeEnum'
        content:
          nullable: true
        sidebar:
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    CustomerProfileConfigScopeEnum:
      enum:
      - person
      - group_0
      - group_1
      - group_2
      - group_3
      - group_4
      type: string
      description: '* `person` - Person

        * `group_0` - Group 0

        * `group_1` - Group 1

        * `group_2` - Group 2

        * `group_3` - Group 3

        * `group_4` - Group 4'
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
