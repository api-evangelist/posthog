openapi: 3.0.3
info:
  title: PostHog actions activity_logs API
  version: 1.0.0
  description: ''
tags:
- name: activity_logs
paths:
  /api/projects/{project_id}/activity_log/:
    get:
      operationId: activity_log_list
      parameters:
      - in: query
        name: item_id
        schema:
          type: string
          minLength: 1
        description: Filter by the ID of the affected resource.
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        description: Page number for pagination. When provided, uses page-based pagination ordered by most recent first.
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
        description: 'Number of results per page (default: 100, max: 1000). Only used with page-based pagination.'
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: query
        name: scope
        schema:
          enum:
          - Cohort
          - FeatureFlag
          - Person
          - Group
          - Insight
          - Plugin
          - PluginConfig
          - HogFunction
          - HogFlow
          - DataManagement
          - EventDefinition
          - PropertyDefinition
          - Notebook
          - Endpoint
          - EndpointVersion
          - Dashboard
          - Replay
          - Experiment
          - ExperimentHoldout
          - ExperimentSavedMetric
          - Survey
          - EarlyAccessFeature
          - SessionRecordingPlaylist
          - Comment
          - Team
          - Project
          - ErrorTrackingIssue
          - DataWarehouseSavedQuery
          - LegalDocument
          - Organization
          - OrganizationDomain
          - OrganizationMembership
          - Role
          - UserGroup
          - BatchExport
          - BatchImport
          - Integration
          - Annotation
          - Tag
          - TaggedItem
          - Subscription
          - PersonalAPIKey
          - ProjectSecretAPIKey
          - User
          - Action
          - AlertConfiguration
          - Threshold
          - AlertSubscription
          - ExternalDataSource
          - ExternalDataSchema
          - LLMTrace
          - WebAnalyticsFilterPreset
          - CustomerProfileConfig
          - Log
          - LogsAlertConfiguration
          - LogsExclusionRule
          - ProductTour
          - Ticket
          type: string
          minLength: 1
        description: 'Filter by a single activity scope, e.g. "FeatureFlag", "Insight", "Dashboard", "Experiment".


          * `Cohort` - Cohort

          * `FeatureFlag` - FeatureFlag

          * `Person` - Person

          * `Group` - Group

          * `Insight` - Insight

          * `Plugin` - Plugin

          * `PluginConfig` - PluginConfig

          * `HogFunction` - HogFunction

          * `HogFlow` - HogFlow

          * `DataManagement` - DataManagement

          * `EventDefinition` - EventDefinition

          * `PropertyDefinition` - PropertyDefinition

          * `Notebook` - Notebook

          * `Endpoint` - Endpoint

          * `EndpointVersion` - EndpointVersion

          * `Dashboard` - Dashboard

          * `Replay` - Replay

          * `Experiment` - Experiment

          * `ExperimentHoldout` - ExperimentHoldout

          * `ExperimentSavedMetric` - ExperimentSavedMetric

          * `Survey` - Survey

          * `EarlyAccessFeature` - EarlyAccessFeature

          * `SessionRecordingPlaylist` - SessionRecordingPlaylist

          * `Comment` - Comment

          * `Team` - Team

          * `Project` - Project

          * `ErrorTrackingIssue` - ErrorTrackingIssue

          * `DataWarehouseSavedQuery` - DataWarehouseSavedQuery

          * `LegalDocument` - LegalDocument

          * `Organization` - Organization

          * `OrganizationDomain` - OrganizationDomain

          * `OrganizationMembership` - OrganizationMembership

          * `Role` - Role

          * `UserGroup` - UserGroup

          * `BatchExport` - BatchExport

          * `BatchImport` - BatchImport

          * `Integration` - Integration

          * `Annotation` - Annotation

          * `Tag` - Tag

          * `TaggedItem` - TaggedItem

          * `Subscription` - Subscription

          * `PersonalAPIKey` - PersonalAPIKey

          * `ProjectSecretAPIKey` - ProjectSecretAPIKey

          * `User` - User

          * `Action` - Action

          * `AlertConfiguration` - AlertConfiguration

          * `Threshold` - Threshold

          * `AlertSubscription` - AlertSubscription

          * `ExternalDataSource` - ExternalDataSource

          * `ExternalDataSchema` - ExternalDataSchema

          * `LLMTrace` - LLMTrace

          * `WebAnalyticsFilterPreset` - WebAnalyticsFilterPreset

          * `CustomerProfileConfig` - CustomerProfileConfig

          * `Log` - Log

          * `LogsAlertConfiguration` - LogsAlertConfiguration

          * `LogsExclusionRule` - LogsExclusionRule

          * `ProductTour` - ProductTour

          * `Ticket` - Ticket'
      - in: query
        name: scopes
        schema:
          type: array
          items:
            enum:
            - Cohort
            - FeatureFlag
            - Person
            - Group
            - Insight
            - Plugin
            - PluginConfig
            - HogFunction
            - HogFlow
            - DataManagement
            - EventDefinition
            - PropertyDefinition
            - Notebook
            - Endpoint
            - EndpointVersion
            - Dashboard
            - Replay
            - Experiment
            - ExperimentHoldout
            - ExperimentSavedMetric
            - Survey
            - EarlyAccessFeature
            - SessionRecordingPlaylist
            - Comment
            - Team
            - Project
            - ErrorTrackingIssue
            - DataWarehouseSavedQuery
            - LegalDocument
            - Organization
            - OrganizationDomain
            - OrganizationMembership
            - Role
            - UserGroup
            - BatchExport
            - BatchImport
            - Integration
            - Annotation
            - Tag
            - TaggedItem
            - Subscription
            - PersonalAPIKey
            - ProjectSecretAPIKey
            - User
            - Action
            - AlertConfiguration
            - Threshold
            - AlertSubscription
            - ExternalDataSource
            - ExternalDataSchema
            - LLMTrace
            - WebAnalyticsFilterPreset
            - CustomerProfileConfig
            - Log
            - LogsAlertConfiguration
            - LogsExclusionRule
