            - Ticket
            type: string
            description: '* `Cohort` - Cohort

              * `FeatureFlag` - FeatureFlag

              * `Person` - Person

              * `Group` - Group

              * `Insight` - Insight

              * `Plugin` - Plugin

              * `PluginConfig` - PluginConfig

              * `HogFunction` - HogFunction

              * `HogFlow` - HogFlow

              * `DataManagement` - DataManagement

              * `EventDefinition` - EventDefinition

              * `PropertyDefinition` - PropertyDefinition

              * `Notebook` - Notebook

              * `Endpoint` - Endpoint

              * `EndpointVersion` - EndpointVersion

              * `Dashboard` - Dashboard

              * `Replay` - Replay

              * `Experiment` - Experiment

              * `ExperimentHoldout` - ExperimentHoldout

              * `ExperimentSavedMetric` - ExperimentSavedMetric

              * `Survey` - Survey

              * `EarlyAccessFeature` - EarlyAccessFeature

              * `SessionRecordingPlaylist` - SessionRecordingPlaylist

              * `Comment` - Comment

              * `Team` - Team

              * `Project` - Project

              * `ErrorTrackingIssue` - ErrorTrackingIssue

              * `DataWarehouseSavedQuery` - DataWarehouseSavedQuery

              * `LegalDocument` - LegalDocument

              * `Organization` - Organization

              * `OrganizationDomain` - OrganizationDomain

              * `OrganizationMembership` - OrganizationMembership

              * `Role` - Role

              * `UserGroup` - UserGroup

              * `BatchExport` - BatchExport

              * `BatchImport` - BatchImport

              * `Integration` - Integration

              * `Annotation` - Annotation

              * `Tag` - Tag

              * `TaggedItem` - TaggedItem

              * `Subscription` - Subscription

              * `PersonalAPIKey` - PersonalAPIKey

              * `ProjectSecretAPIKey` - ProjectSecretAPIKey

              * `User` - User

              * `Action` - Action

              * `AlertConfiguration` - AlertConfiguration

              * `Threshold` - Threshold

              * `AlertSubscription` - AlertSubscription

              * `ExternalDataSource` - ExternalDataSource

              * `ExternalDataSchema` - ExternalDataSchema

              * `LLMTrace` - LLMTrace

              * `WebAnalyticsFilterPreset` - WebAnalyticsFilterPreset

              * `CustomerProfileConfig` - CustomerProfileConfig

              * `Log` - Log

              * `LogsAlertConfiguration` - LogsAlertConfiguration

              * `LogsExclusionRule` - LogsExclusionRule

              * `ProductTour` - ProductTour

              * `Ticket` - Ticket'
        description: Filter by multiple activity scopes, comma-separated. Values must be valid ActivityScope enum values. E.g. "FeatureFlag,Insight".
      - in: query
        name: user
        schema:
          type: string
          format: uuid
        description: Filter by user UUID who performed the action.
      tags:
      - activity_logs
      security:
      - PersonalAPIKeyAuth:
        - activity_log:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityLogList'
          description: ''
      x-explicit-tags:
      - activity_logs
      - platform_features
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    ActivityLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          $ref: '#/components/schemas/UserBasic'
        unread:
          type: boolean
          description: is the date of this log item newer than the user's bookmark
          readOnly: true
        organization_id:
          type: string
          format: uuid
          nullable: true
        was_impersonated:
          type: boolean
          nullable: true
        is_system:
          type: boolean
          nullable: true
        client:
          type: string
          nullable: true
          maxLength: 32
        activity:
          type: string
          maxLength: 79
        item_id:
          type: string
          nullable: true
          maxLength: 72
        scope:
          type: string
          maxLength: 79
        detail:
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - activity
      - id
      - scope
      - unread
      - user
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          nullable: true
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type: boolean
          nullable: true
        hedgehog_config:
          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    PaginatedActivityLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLog'
    NullEnum:
      enum:
      - null
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
