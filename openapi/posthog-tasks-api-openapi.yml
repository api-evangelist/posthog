openapi: 3.2.0
info:
  title: PostHog Tasks API
  version: 1.0.0
  description: ''
tags:
- name: Tasks
paths:
  /api/projects/{project_id}/tasks/:
    get:
      operationId: tasks_list
      description: Get a list of tasks for the current project, with optional filtering by origin product, stage, organization, repository, and created_by.
      summary: List tasks
      parameters:
      - in: query
        name: created_by
        schema:
          type: integer
        description: Filter by creator user ID
      - in: query
        name: internal
        schema:
          type: boolean
        description: When true, list internal tasks instead of user-facing ones. Honored only in debug environments; ignored in production. Defaults to excluding internal tasks.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: organization
        schema:
          type: string
          minLength: 1
        description: Filter by repository organization
      - in: query
        name: origin_product
        schema:
          type: string
          minLength: 1
        description: Filter by origin product
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: query
        name: repository
        schema:
          type: string
          minLength: 1
        description: Filter by repository name (can include org/repo format)
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive substring search over task title and description. A numeric value also matches the task number. An empty value disables the filter.
      - in: query
        name: stage
        schema:
          type: string
          minLength: 1
        description: Filter by task run stage
      - in: query
        name: status
        schema:
          enum:
          - not_started
          - queued
          - in_progress
          - completed
          - failed
          - cancelled
          type: string
          minLength: 1
        description: 'Filter tasks by the status of their most recent run.


          * `not_started` - not_started

          * `queued` - queued

          * `in_progress` - in_progress

          * `completed` - completed

          * `failed` - failed

          * `cancelled` - cancelled'
      tags:
      - Tasks
      security:
      - PersonalAPIKeyAuth:
        - task:read
      - PersonalAPIKeyAuth:
        - task:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskList'
          description: List of tasks
      x-explicit-tags:
      - tasks
    post:
      operationId: tasks_create
      description: API for managing tasks within a project. Tasks represent units of work to be performed by an agent.
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
      x-explicit-tags:
      - tasks
      summary: Tasks create
      x-summary-source: derived
  /api/projects/{project_id}/tasks/{id}/:
    get:
      operationId: tasks_retrieve
      description: API for managing tasks within a project. Tasks represent units of work to be performed by an agent.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Tasks
      security:
      - PersonalAPIKeyAuth:
        - task:read
      - PersonalAPIKeyAuth:
        - task:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
      x-explicit-tags:
      - tasks
      summary: Tasks retrieve
      x-summary-source: derived
    put:
      operationId: tasks_update
      description: API for managing tasks within a project. Tasks represent units of work to be performed by an agent.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
      x-explicit-tags:
      - tasks
      summary: Tasks update
      x-summary-source: derived
    patch:
      operationId: tasks_partial_update
      description: API for managing tasks within a project. Tasks represent units of work to be performed by an agent.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTask'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTask'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTask'
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
      x-explicit-tags:
      - tasks
      summary: Tasks partial update
      x-summary-source: derived
    delete:
      operationId: tasks_destroy
      description: API for managing tasks within a project. Tasks represent units of work to be performed by an agent.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Tasks
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '204':
          description: No response body
      x-explicit-tags:
      - tasks
      summary: Tasks destroy
      x-summary-source: derived
  /api/projects/{project_id}/tasks/{id}/run/:
    post:
      operationId: tasks_run_create
      description: Create a new task run and kick off the workflow.
      summary: Run task
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRunCreateRequestSchema'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskRunCreateRequestSchema'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskRunCreateRequestSchema'
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: Task with updated latest run
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunErrorResponse'
          description: Invalid task run payload
        '404':
          description: Task not found
      x-explicit-tags:
      - tasks
  /api/projects/{project_id}/tasks/{id}/staged_artifacts/finalize_upload/:
    post:
      operationId: tasks_staged_artifacts_finalize_upload_create
      description: Verify staged S3 uploads and cache their metadata so they can be attached to the next run created for this task.
      summary: Finalize staged direct uploads for task attachments
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStagedArtifactsFinalizeUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskStagedArtifactsFinalizeUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskStagedArtifactsFinalizeUploadRequest'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStagedArtifactsFinalizeUploadResponse'
          description: Finalized staged artifacts available for the next task run
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid artifact payload
        '404':
          description: Task not found
      x-explicit-tags:
      - tasks
  /api/projects/{project_id}/tasks/{id}/staged_artifacts/prepare_upload/:
    post:
      operationId: tasks_staged_artifacts_prepare_upload_create
      description: Reserve S3 object keys for task attachments before creating a new run and return presigned POST forms for direct uploads.
      summary: Prepare staged direct uploads for task attachments
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStagedArtifactsPrepareUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskStagedArtifactsPrepareUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskStagedArtifactsPrepareUploadRequest'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - task:write
      - PersonalAPIKeyAuth:
        - task:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStagedArtifactsPrepareUploadResponse'
          description: Prepared staged uploads for the requested artifacts
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid artifact payload
        '404':
          description: Task not found
      x-explicit-tags:
      - tasks
  /api/projects/{project_id}/tasks/repositories/:
    get:
      operationId: tasks_repositories_retrieve
      description: Return the set of repositories referenced by non-deleted, non-internal tasks in the current project. Used to populate repository filter pickers without being constrained by task list pagination.
      summary: List distinct task repositories
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - Tasks
      security:
      - PersonalAPIKeyAuth:
        - task:read
      - PersonalAPIKeyAuth:
        - task:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRepositoriesResponse'
          description: Distinct repositories used by tasks in the current project.
      x-explicit-tags:
      - tasks
  /api/projects/{project_id}/tasks/repository_readiness/:
    get:
      operationId: tasks_repository_readiness_retrieve
      description: Get autonomy readiness details for a specific repository in the current project.
      summary: Get repository readiness
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: query
        name: refresh
        schema:
          type: boolean
          default: false
      - in: query
        name: repository
        schema:
          type: string
          minLength: 1
        description: Repository in org/repo format
        required: true
      - in: query
        name: window_days
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 7
      tags:
      - Tasks
      security:
      - PersonalAPIKeyAuth:
        - task:read
      - PersonalAPIKeyAuth:
        - task:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryReadinessResponse'
          description: Repository readiness status
      x-explicit-tags:
      - tasks
components:
  schemas:
    TaskStagedArtifactsPrepareUploadRequest:
      type: object
      properties:
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/TaskStagedArtifactPrepareUpload'
          description: Array of staged artifacts to prepare before creating a run
      required:
      - artifacts
    CapabilityState:
      type: object
      properties:
        state:
          allOf:
          - $ref: '#/components/schemas/CapabilityStateStateEnum'
          description: 'Current state of the capability


            * `needs_setup` - needs_setup

            * `detected` - detected

            * `waiting_for_data` - waiting_for_data

            * `ready` - ready

            * `not_applicable` - not_applicable

            * `unknown` - unknown'
        estimated:
          type: boolean
          description: Whether the state is estimated from static analysis
        reason:
          type: string
          description: Human-readable explanation
        evidence:
          type: object
          additionalProperties: true
          description: Supporting evidence
      required:
      - estimated
      - reason
      - state
    TaskRunCreateRequestSchema:
      oneOf:
      - $ref: '#/components/schemas/ClaudeTaskRunCreateSchema'
      - $ref: '#/components/schemas/CodexTaskRunCreateSchema'
      - $ref: '#/components/schemas/TaskRunResumeRequestSchema'
    PatchedTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        task_number:
          type:
          - integer
          - 'null'
          readOnly: true
        slug:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        title_manually_set:
          type: boolean
        description:
          type: string
        origin_product:
          $ref: '#/components/schemas/OriginProductEnum'
        repository:
          type:
          - string
          - 'null'
          maxLength: 255
        github_integration:
          type:
          - integer
          - 'null'
          description: GitHub integration for this task
        github_user_integration:
          type:
          - string
          - 'null'
          format: uuid
          description: User-scoped GitHub integration to use for user-authored cloud runs.
        signal_report:
          type:
          - string
          - 'null'
          format: uuid
        signal_report_task_relationship:
          allOf:
          - $ref: '#/components/schemas/SignalReportTaskRelationshipEnum'
          writeOnly: true
        json_schema:
          description: JSON schema for the task. This is used to validate the output of the task.
        internal:
          type: boolean
          description: If true, this task is for internal use and should not be exposed to end users.
        latest_run:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Latest run details for this task
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        ci_prompt:
          type:
          - string
          - 'null'
          description: Custom prompt for CI fixes. If blank, a default prompt will be used.
    ClaudeRuntimeAdapterEnum:
      enum:
      - claude
      type: string
      description: '* `claude` - claude'
    TaskRunArtifactTypeEnum:
      enum:
      - plan
      - context
      - reference
      - output
      - artifact
      - tree_snapshot
      - user_attachment
      type: string
      description: '* `plan` - plan

        * `context` - context

        * `reference` - reference

        * `output` - output

        * `artifact` - artifact

        * `tree_snapshot` - tree_snapshot

        * `user_attachment` - user_attachment'
    TaskRunErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable validation error
        error:
          type: string
          description: Human-readable error message
        type:
          type: string
          description: Machine-readable error type
        code:
          type: string
          description: Machine-readable error code
        attr:
          type: string
          description: Request field associated with the error
        missing_artifact_ids:
          type: array
          items:
            type: string
          description: Artifact ids that could not be resolved for the run
    CodexRuntimeAdapterEnum:
      enum:
      - codex
      type: string
      description: '* `codex` - codex'
    ClaudeTaskRunCreateSchema:
      type: object
      description: Request body for creating a new task run
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/TaskExecutionModeEnum'
          default: background
          description: 'Execution mode: ''interactive'' for user-connected runs, ''background'' for autonomous runs


            * `interactive` - interactive

            * `background` - background'
        branch:
          type:
          - string
          - 'null'
          description: Git branch to checkout in the sandbox
          maxLength: 255
        resume_from_run_id:
          type: string
          format: uuid
          description: ID of a previous run to resume from. Must belong to the same task.
        pending_user_message:
          type: string
          description: Initial or follow-up user message to include in the run prompt.
        pending_user_artifact_ids:
          type: array
          items:
            type: string
            maxLength: 128
          description: Identifiers for staged task artifacts that should be attached to the initial run prompt.
        sandbox_environment_id:
          type: string
          format: uuid
          description: Optional sandbox environment to apply for this cloud run.
        pr_authorship_mode:
          allOf:
          - $ref: '#/components/schemas/PrAuthorshipModeEnum'
          description: 'Whether pull requests for this run should be authored by the user or the bot.


            * `user` - user

            * `bot` - bot'
        run_source:
          allOf:
          - $ref: '#/components/schemas/RunSourceEnum'
          description: 'High-level source that triggered this run, used to distinguish manual and signal-based cloud runs.


            * `manual` - manual

            * `signal_report` - signal_report'
        signal_report_id:
          type: string
          description: Optional signal report identifier when this run was started from Inbox.
        runtime_adapter:
          allOf:
          - $ref: '#/components/schemas/ClaudeRuntimeAdapterEnum'
          description: 'Agent runtime adapter to launch for this run. Must be ''claude'' for Claude runtimes.


            * `claude` - claude'
        model:
          type: string
          description: LLM model identifier to run in the Claude runtime.
        reasoning_effort:
          allOf:
          - $ref: '#/components/schemas/ReasoningEffortEnum'
          description: 'Reasoning effort to request for models that expose an effort control.


            * `low` - low

            * `medium` - medium

            * `high` - high

            * `xhigh` - xhigh

            * `max` - max'
        github_user_token:
          type: string
          writeOnly: true
          description: Optional GitHub user token from PostHog Code for user-authored cloud pull requests. Prefer linking GitHub from Settings → Linked accounts so the server can manage tokens; this field remains supported for callers that still manage their own tokens.
        initial_permission_mode:
          allOf:
          - $ref: '#/components/schemas/ClaudeTaskRunCreateSchemaInitialPermissionModeEnum'
          description: 'Initial permission mode for Claude runtimes.


            * `default` - default

            * `acceptEdits` - acceptEdits

            * `plan` - plan

            * `bypassPermissions` - bypassPermissions

            * `auto` - auto'
      required:
      - model
      - runtime_adapter
    RepositoryReadinessResponse:
      type: object
      properties:
        repository:
          type: string
          description: Normalized repository identifier
        classification:
          type: string
          description: Repository classification
        excluded:
          type: boolean
          description: Whether the repository is excluded from readiness checks
        coreSuggestions:
          allOf:
          - $ref: '#/components/schemas/CapabilityState'
          description: Tracking capability state
        replayInsights:
          allOf:
          - $ref: '#/components/schemas/CapabilityState'
          description: Computer vision capability state
        errorInsights:
          allOf:
          - $ref: '#/components/schemas/CapabilityState'
          description: Error tracking capability state
        overall:
          type: string
          description: Overall readiness state
        evidenceTaskCount:
          type: integer
          description: Count of replay-derived evidence tasks
        windowDays:
          type: integer
          description: Lookback window in days
        generatedAt:
          type: string
          description: ISO timestamp when the response was generated
        cacheAgeSeconds:
          type: integer
          description: Age of cached response in seconds
        scan:
          allOf:
          - $ref: '#/components/schemas/ScanEvidence'
          description: Scan evidence details
      required:
      - cacheAgeSeconds
      - classification
      - coreSuggestions
      - errorInsights
      - evidenceTaskCount
      - excluded
      - generatedAt
      - overall
      - replayInsights
      - repository
      - windowDays
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    ClaudeTaskRunCreateSchemaInitialPermissionModeEnum:
      enum:
      - default
      - acceptEdits
      - plan
      - bypassPermissions
      - auto
      type: string
      description: '* `default` - default

        * `acceptEdits` - acceptEdits

        * `plan` - plan

        * `bypassPermissions` - bypassPermissions

        * `auto` - auto'
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
      - error
    TaskRunArtifactResponse:
      type: object
      properties:
        id:
          type: string
          description: Stable identifier for the artifact within this run
        name:
          type: string
          description: Artifact file name
        type:
          type: string
          description: Artifact classification (plan, context, etc.)
        source:
          type: string
          description: Source of the artifact, such as agent_output or user_attachment
        size:
          type: integer
          description: Artifact size in bytes
        content_type:
          type: string
          description: Optional MIME type
        storage_path:
          type: string
          description: S3 object key for the artifact
        uploaded_at:
          type: string
          description: Timestamp when the artifact was uploaded
      required:
      - name
      - storage_path
      - type
      - uploaded_at
    TaskStagedArtifactsPrepareUploadResponse:
      type: object
      properties:
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/TaskStagedArtifactPrepareUploadResponse'
          description: Prepared staged uploads for the requested artifacts
      required:
      - artifacts
    RunSourceEnum:
      enum:
      - manual
      - signal_report
      type: string
      description: '* `manual` - manual

        * `signal_report` - signal_report'
    TaskRepositoriesResponse:
      type: object
      properties:
        repositories:
          type: array
          items:
            type: string
          description: Distinct repositories in use by non-deleted, non-internal tasks for the current team.
      required:
      - repositories
    NullEnum:
      enum:
      - null
    BlankEnum:
      enum:
      - ''
    TaskStagedArtifactPrepareUpload:
      type: object
      properties:
        name:
          type: string
          description: File name to associate with the staged artifact
          maxLength: 255
        type:
          allOf:
          - $ref: '#/components/schemas/TaskRunArtifactTypeEnum'
          description: 'Classification for the artifact


            * `plan` - plan

            * `context` - context

            * `reference` - reference

            * `output` - output

            * `artifact` - artifact

            * `tree_snapshot` - tree_snapshot

            * `user_attachment` - user_attachment'
        source:
          type: string
          default: ''
          description: Optional source label for the artifact, such as agent_output or user_attachment
          maxLength: 64
        size:
          type: integer
          maximum: 31457280
          minimum: 1
          description: Expected upload size in bytes (max 31457280 bytes)
        content_type:
          type: string
          description: Optional MIME type for the artifact upload
          maxLength: 255
      required:
      - name
      - size
      - type
    SignalReportTaskRelationshipEnum:
      enum:
      - implementation
      type: string
      description: '* `implementation` - Implementation'
    CodexTaskRunCreateSchemaInitialPermissionModeEnum:
      enum:
      - auto
      - read-only
      - full-access
      type: string
      description: '* `auto` - auto

        * `read-only` - read-only

        * `full-access` - full-access'
    ReasoningEffortEnum:
      enum:
      - low
      - medium
      - high
      - xhigh
      - max
      type: string
      description: '* `low` - low

        * `medium` - medium

        * `high` - high

        * `xhigh` - xhigh

        * `max` - max'
    CodexTaskRunCreateSchema:
      type: object
      description: Request body for creating a new task run
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/TaskExecutionModeEnum'
          default: background
          description: 'Execution mode: ''interactive'' for user-connected runs, ''background'' for autonomous runs


            * `interactive` - interactive

            * `background` - background'
        branch:
          type:
          - string
          - 'null'
          description: Git branch to checkout in the sandbox
          maxLength: 255
        resume_from_run_id:
          type: string
          format: uuid
          description: ID of a previous run to resume from. Must belong to the same task.
        pending_user_message:
          type: string
          description: Initial or follow-up user message to include in the run prompt.
        pending_user_artifact_ids:
          type: array
          items:
            type: string
            maxLength: 128
          description: Identifiers for staged task artifacts that should be attached to the initial run prompt.
        sandbox_environment_id:
          type: string
          format: uuid
          description: Optional sandbox environment to apply for this cloud run.
        pr_authorship_mode:
          allOf:
          - $ref: '#/components/schemas/PrAuthorshipModeEnum'
          description: 'Whether pull requests for this run should be authored by the user or the bot.


            * `user` - user

            * `bot` - bot'
        run_source:
          allOf:
          - $ref: '#/components/schemas/RunSourceEnum'
          description: 'High-level source that triggered this run, used to distinguish manual and signal-based cloud runs.


            * `manual` - manual

            * `signal_report` - signal_report'
        signal_report_id:
          type: string
          description: Optional signal report identifier when this run was started from Inbox.
        runtime_adapter:
          allOf:
          - $ref: '#/components/schemas/CodexRuntimeAdapterEnum'
          description: 'Agent runtime adapter to launch for this run. Must be ''codex'' for Codex runtimes.


            * `codex` - codex'
        model:
          type: string
          description: LLM model identifier to run in the Codex runtime.
        reasoning_effort:
          allOf:
          - $ref: '#/components/schemas/ReasoningEffortEnum'
          description: 'Reasoning effort to request for models that expose an effort control.


            * `low` - low

            * `medium` - medium

            * `high` - high

            * `xhigh` - xhigh

            * `max` - max'
        github_user_token:
          type: string
          writeOnly: true
          description: Optional GitHub user token from PostHog Code for user-authored cloud pull requests. Prefer linking GitHub from Settings → Linked accounts so the server can manage tokens; this field remains supported for callers that still manage their own tokens.
        initial_permission_mode:
          allOf:
          - $ref: '#/components/schemas/CodexTaskRunCreateSchemaInitialPermissionModeEnum'
          description: 'Initial permission mode for Codex runtimes.


            * `auto` - auto

            * `read-only` - read-only

            * `full-access` - full-access'
      required:
      - model
      - runtime_adapter
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type:
          - string
          - 'null'
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type:
          - boolean
          - 'null'
        hedgehog_config:
          type:
          - object
          - 'null'
          additionalProperties: true
          readOnly: true
        role_at_organization:
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    TaskExecutionModeEnum:
      enum:
      - interactive
      - background
      type: string
      description: '* `interactive` - interactive

        * `background` - background'
    TaskStagedArtifactsFinalizeUploadRequest:
      type: object
      properties:
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/TaskStagedArtifactFinalizeUpload'
          description: Array of staged artifacts to finalize after upload
      required:
      - artifacts
    PrAuthorshipModeEnum:
      enum:
      - user
      - bot
      type: string
      description: '* `user` - user

        * `bot` - bot'
    OriginProductEnum:
      enum:
      - error_tracking
      - eval_clusters
      - user_created
      - automation
      - slack
      - support_queue
      - session_summaries
      - signal_report
      type: string
      description: '* `error_tracking` - Error Tracking

        * `eval_clusters` - Eval Clusters

        * `user_created` - User Created

        * `automation` - Automation

        * `slack` - Slack

        * `support_queue` - Support Queue

        * `session_summaries` - Session Summaries

        * `signal_report` - Signal Report'
    CapabilityStateStateEnum:
      enum:
      - needs_setup
      - detected
      - waiting_for_data
      - ready
      - not_applicable
      - unknown
      type: string
      description: '* `needs_setup` - needs_setup

        * `detected` - detected

        * `waiting_for_data` - waiting_for_data

        * `ready` - ready

        * `not_applicable` - not_applicable

        * `unknown` - unknown'
    TaskStagedArtifactsFinalizeUploadResponse:
      type: object
      properties:
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/TaskRunArtifactResponse'
          description: Finalized staged artifacts available for attachment to a new run
      required:
      - artifacts
    TaskStagedArtifactPrepareUploadResponse:
      type: object
      properties:
        id:
          type: string
          description: Stable identifier for the prepared staged artifact within this task
        name:
          type: string
          description: Artifact file name
        type:
          type: string
          description: Artifact classification (plan, context, etc.)
        source:
          type: string
          description: Source of the artifact, such as agent_output or user_attachment
        size:
          type: integer
          description: Expected upload size in bytes
        content_type:
          type: string
          description: Optional MIME type
        storage_path:
          type: string
          description: S3 object key reserved for the staged artifact
        expires_in:
          type: integer
          description: Presigned POST expiry in seconds
        presigned_post:
          allOf:
          - $ref: '#/components/schemas/S3PresignedPost'
          description: Presigned S3 POST configuration for uploading the file
      required:
      - expires_in
      - id
      - name
      - presigned_post
      - size
      - storage_path
      - type
    TaskRunResumeRequestSchema:
      type: object
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/TaskExecutionModeEnum'
          default: background
          description: 'Execution mode: ''interactive'' for user-connected runs, ''background'' for autonomous runs


            * `interactive` - interactive

            * `background` - background'
        branch:
          type:
          - string
          - 'null'
          description: Git branch to checkout in the sandbox
          maxLength: 255
        resume_from_run_id:
          type: string
          format: uuid
          description: ID of a previous run to resume from. Must belong to the same task.
        pending_user_message:
          type: string
          description: Initial or follow-up user message to include in the run prompt.
        sandbox_environment_id:
          type: string
          format: uuid
          description: Optional sandbox environment to apply for this cloud run.
        pr_authorship_mode:
          allOf:
          - $ref: '#/components/schemas/PrAuthorshipModeEnum'
          description: 'Whether pull requests for this run should be authored by the user or the bot.


            * `user` - user

            * `bot` - bot'
        run_source:
          allOf:
          - $ref: '#/components/schemas/RunSourceEnum'
          description: 'High-level source that triggered this run, used to distinguish manual and signal-based cloud runs.


            * `manual` - manual

            * `signal_report` - signal_report'
        signal_report_id:
          type: string
          description: Optional signal report identifier when this run was started from Inbox.
        github_user_token:
          type: string
          writeOnly: true
          description: Optional GitHub user token from PostHog Code for user-authored cloud pull requests. Prefer linking GitHub from Settings → Linked accounts so the server can manage tokens; this field remains supported for callers that still manage their own tokens.
    ScanEvidence:
      type: object
      properties:
        filesScanned:
          type: integer
          description: Number of files scanned
        detectedFilesCount:
          type: integer
          description: Total candidate files detected
        eventNameCount:
          type: integer
          description: Number of distinct event names found
        foundPosthogInit:
          type: boolean
          description: Whether posthog.init() was found in scanned files
        foundPosthogCapture:
          type: boolean
          description: Whether posthog.capture() was found in scanned files
        foundErrorSignal:
          type: boolean
          description: Whether error tracking signals were found in scanned files
      required:
      - detectedFilesCount
      - eventNameCount
      - filesScanned
      - foundErrorSignal
      - foundPosthogCapture
      - foundPosthogInit
    PaginatedTaskList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    S3PresignedPost:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Presigned S3 POST URL
        fields:
          type: object
          additionalProperties:
            type: string
          description: Form fields that must be submitted verbatim with the file upload
      required:
      - fields
      - url
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        task_number:
          type:
          - integer
          - 'null'
          readOnly: true
        slug:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        title_manually_set:
          type: boolean
        description:
          type: string
        origin_product:
          $ref: '#/components/schemas/OriginProductEnum'
        repository:
          type:
          - string
          - 'null'
          maxLength: 255
        github_integration:
          type:
          - integer
          - 'null'
          description: GitHub integration for this task
        github_user_integration:
          type:
          - string
          - 'null'
          format: uuid
          description: User-scoped GitHub integration to use for user-authored cloud runs.
        signal_report:
          type:
          - string
          - 'null'
          format: uuid
        signal_report_task_relationship:
          allOf:
          - $ref: '#/components/schemas/SignalReportTaskRelationshipEnum'
          writeOnly: true
        json_schema:
          description: JSON schema for the task. This is used to validate the output of the task.
        internal:
          type: boolean
          description: If true, this task is for internal use and should not be exposed to end users.
        latest_run:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Latest run details for this task
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        ci_prompt:
          type:
          - string
          - 'null'
          description: Custom prompt for CI fixes. If blank, a default prompt will be used.
      required:
      - created_at
      - created_by
      - id
      - latest_run
      - slug
      - task_number
      - updated_at
    TaskStagedArtifactFinalizeUpload:
      type: object
      properties:
        id:
          type: string
          description: Stable identifier returned by the staged prepare upload endpoint
        name:
          type: string
          description: File name associated with the staged artifact
          maxLength: 255
        type:
          allOf:
          - $ref: '#/components/schemas/TaskRunArtifactTypeEnum'
          description: 'Classification for the artifact


            * `plan` - plan

            * `context` - context

            * `reference` - reference

            * `output` - output

            * `artifact` - artifact

            * `tree_snapshot` - tree_snapshot

            * `user_attachment` - user_attachment'
        source:
          type: string
          default: ''
          description: Optional source label for the artifact, such as agent_output or user_attachment
          maxLength: 64
        storage_path:
          type: string
          description: S3 object key returned by the prepare step
          maxLength: 500
        content_type:
          type: string
          description: Optional MIME type recorded for the artifact
          maxLength: 255
      required:
      - id
      - name
      - storage_path
      - type
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
