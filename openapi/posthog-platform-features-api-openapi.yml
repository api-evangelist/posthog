components:
  schemas:
    ChangeRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action_key:
          type: string
          readOnly: true
        action_version:
          type: integer
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
          nullable: true
        intent:
          readOnly: true
        intent_display:
          readOnly: true
        policy_snapshot:
          readOnly: true
        validation_status:
          allOf:
          - $ref: '#/components/schemas/ValidationStatusEnum'
          readOnly: true
        validation_errors:
          readOnly: true
          nullable: true
        validated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        state:
          allOf:
          - $ref: '#/components/schemas/ChangeRequestStateEnum'
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        applied_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        applied_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        apply_error:
          type: string
          readOnly: true
        result_data:
          readOnly: true
          nullable: true
        approvals:
          type: array
          items:
            type: object
            additionalProperties: true
          readOnly: true
        can_approve:
          type: boolean
          description: Check if current user can approve this change request.
          readOnly: true
        can_cancel:
          type: boolean
          readOnly: true
        is_requester:
          type: boolean
          description: Check if current user is the requester.
          readOnly: true
        user_decision:
          type: string
          nullable: true
          description: Get the current user's approval decision if they have voted.
          readOnly: true
      required:
      - action_key
      - action_version
      - applied_at
      - applied_by
      - apply_error
      - approvals
      - can_approve
      - can_cancel
      - created_at
      - created_by
      - expires_at
      - id
      - intent
      - intent_display
      - is_requester
      - policy_snapshot
      - resource_id
      - resource_type
      - result_data
      - state
      - updated_at
      - user_decision
      - validated_at
      - validation_errors
      - validation_status
    PaginatedRoleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    ValidationStatusEnum:
      enum:
      - valid
      - invalid
      - expired
      - stale
      type: string
      description: '* `valid` - Valid

        * `invalid` - Invalid

        * `expired` - Expired

        * `stale` - Stale (resource changed)'
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        members:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Members assigned to this role
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - is_default
      - members
      - name
    NullEnum:
      enum:
      - null
