  /api/organizations/{organization_id}/welcome/current/:
    get:
      operationId: welcome_current_retrieve
      description: Aggregated payload for the invited-user welcome screen.
      parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      tags:
      - platform_features
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WelcomeResponse'
          description: ''
        '404':
          description: Current organization not found
      x-explicit-tags:
      - platform_features
      summary: Welcome current retrieve
      x-summary-source: derived
  /api/projects/{project_id}/advanced_activity_logs/:
    get:
      operationId: advanced_activity_logs_list
      parameters:
      - in: query
        name: activities
        schema:
          type: array
          items:
            type: string
          default: []
      - in: query
        name: clients
        schema:
          type: array
          items:
            type: string
          default: []
      - in: query
        name: detail_filters
        schema:
          type: string
      - in: query
        name: end_date
        schema:
          type: string
          format: date-time
      - in: query
        name: hogql_filter
        schema:
          type: string
      - in: query
        name: is_system
        schema:
          type:
          - boolean
          - 'null'
      - in: query
        name: item_ids
        schema:
          type: array
          items:
            type: string
          default: []
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        description: Page number for pagination. When provided, uses page-based pagination ordered by most recent first.
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
        description: 'Number of results per page (default: 100, max: 1000). Only used with page-based pagination.'
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: query
        name: scopes
        schema:
          type: array
          items:
            type: string
          default: []
      - in: query
        name: search_text
        schema:
          type: string
      - in: query
        name: start_date
        schema:
          type: string
          format: date-time
      - in: query
        name: users
        schema:
          type: array
          items:
            type: string
            format: uuid
          default: []
      - in: query
        name: was_impersonated
        schema:
          type:
          - boolean
          - 'null'
      tags:
      - platform_features
      security:
      - PersonalAPIKeyAuth:
        - activity_log:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityLogList'
          description: ''
