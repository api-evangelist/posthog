        schema:
          type: integer
      - in: query
        name: order
        schema:
          type: string
          enum:
          - -joined_at
          - joined_at
        description: Sort order. Defaults to `-joined_at`.
      - $ref: '#/components/parameters/OrganizationIdPath'
      tags:
      - platform_features
      security:
      - PersonalAPIKeyAuth:
        - organization_member:read
