      operationId: advanced_activity_logs_export_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - platform_features
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityLog'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityLog'
          multipart/form-data:
