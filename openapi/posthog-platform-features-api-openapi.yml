openapi: 3.2.0
info:
  title: PostHog Platform Features API
  version: 1.0.0
  description: ''
tags:
- name: platform_features
paths:
  /api/environments/{project_id}/approval_policies/:
    get:
      operationId: approval_policies_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - platform_features
      security:
      - PersonalAPIKeyAuth:
        - approvals:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalPolicyList'
          description: ''
      x-explicit-tags:
      - platform_features
      summary: Approval policies list
      x-summary-source: derived
    post:
      operationId: approval_policies_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - platform_features
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalPolicy'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalPolicy'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalPolicy'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - approvals:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPolicy'
          description: ''
      x-explicit-tags:
      - platform_features
      summary: Approval policies create
      x-summary-source: derived
  /api/environments/{project_id}/approval_policies/{id}/:
    get:
      operationId: approval_policies_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval policy.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - platform_features
      security:
      - PersonalAPIKeyAuth:
        - approvals:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPolicy'
          description: ''
      x-explicit-tags:
      - platform_features
      summary: Approval policies retrieve
      x-summary-source: derived
    put:
      operationId: approval_policies_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval policy.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - platform_features
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalPolicy'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalPolicy'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalPolicy'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - approvals:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPolicy'
          description: ''
      x-explicit-tags:
      - platform_features
      summary: Approval policies update
      x-summary-source: derived
    patch:
      operationId: approval_policies_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval policy.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - platform_features
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApprovalPolicy'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApprovalPolicy'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApprovalPolicy'
      security:
      - PersonalAPIKeyAuth:
        - approvals:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPolicy'
          description: ''
      x-explicit-tags:
      - platform_features
      summary: Approval policies partial update
      x-summary-source: derived
    delete:
      operationId: approval_policies_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this approval policy.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - platform_features
      security:
      - PersonalAPIKeyAuth:
        - approvals:write
      responses:
        '204':
          description: No response body
      x-explicit-tags:
      - platform_features
      summary: Approval policies destroy
      x-summary-source: derived
  /api/environments/{project_id}/change_requests/:
    get:
      operationId: change_requests_list
      parameters:
      - in: query
        name: action_key
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: query
        name: requester
        schema:
          type: number
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - platform_features
      security:
      - PersonalAPIKeyAuth:
        - approvals:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChangeRequestList'
          description: ''
      x-explicit-tags:
      - platform_features
      summary: Change requests list
      x-summary-source: derived
  /api/environments/{project_id}/change_requests/{id}/:
    get:
      operationId: change_requests_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this change request.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - platform_features
      security:
      - PersonalAPIKeyAuth:
        - approvals:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
          description: ''
      x-explicit-tags:
      - platform_features
      summary: Change requests retrieve
      x-summary-source: derived
  /api/environments/{project_id}/change_requests/{id}/approve/:
    post:
      operationId: change_requests_approve_create
      description: 'Approve a change request.

        If quorum is reached, automatically applies the change immediately.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this change request.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - platform_features
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
      security:
      - PersonalAPIKeyAuth:
        - approvals:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
          description: ''
      x-explicit-tags:
      - platform_features
      summary: Change requests approve create
      x-summary-source: derived
  /api/environments/{project_id}/change_requests/{id}/cancel/:
    post:
      operationId: change_requests_cancel_create
      description: 'Cancel a change request.

        Only the requester can cancel their own pending change request.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this change request.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - platform_features
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
      security:
      - PersonalAPIKeyAuth:
        - approvals:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
          description: ''
      x-explicit-tags:
      - platform_features
      summary: Change requests cancel create
      x-summary-source: derived
  /api/environments/{project_id}/change_requests/{id}/reject/:
    post:
      operationId: change_requests_reject_create
      description: Reject a change request.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this change request.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - platform_features
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
      security:
      - PersonalAPIKeyAuth:
        - approvals:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
          description: ''
      x-explicit-tags:
      - platform_features
      summary: Change requests reject create
      x-summary-source: derived
