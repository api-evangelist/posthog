openapi: 3.0.3
info:
  title: PostHog actions members API
  version: 1.0.0
  description: ''
tags:
- name: members
paths:
  /api/organizations/{organization_id}/members/:
    get:
      operationId: members_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: order
        schema:
          type: string
          enum:
          - -joined_at
          - joined_at
        description: Sort order. Defaults to `-joined_at`.
      - $ref: '#/components/parameters/OrganizationIdPath'
      tags:
      - members
      security:
      - PersonalAPIKeyAuth:
        - organization_member:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationMemberList'
          description: ''
      x-explicit-tags:
      - core
      - platform_features
  /api/organizations/{organization_id}/members/{user__uuid}/:
    put:
      operationId: members_update
      parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - in: path
        name: user__uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationMember'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationMember'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationMember'
      security:
      - PersonalAPIKeyAuth:
        - organization_member:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
          description: ''
      x-explicit-tags:
      - core
      - platform_features
    patch:
      operationId: members_partial_update
      parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - in: path
        name: user__uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationMember'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationMember'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationMember'
      security:
      - PersonalAPIKeyAuth:
        - organization_member:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
          description: ''
      x-explicit-tags:
      - core
      - platform_features
    delete:
      operationId: members_destroy
      parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - in: path
        name: user__uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      security:
      - PersonalAPIKeyAuth:
        - organization_member:write
      responses:
        '204':
          description: No response body
      x-explicit-tags:
      - core
      - platform_features
  /api/organizations/{organization_id}/members/{user__uuid}/scoped_api_keys/:
    get:
      operationId: members_scoped_api_keys_retrieve
      parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      - in: path
        name: user__uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
          description: ''
      x-explicit-tags:
      - core
      - platform_features
components:
  schemas:
    OrganizationMembershipLevelEnum:
      enum:
      - 1
      - 8
      - 15
      type: integer
      description: '* `1` - member

        * `8` - administrator

        * `15` - owner'
    BlankEnum:
      enum:
      - ''
    PatchedOrganizationMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        level:
          $ref: '#/components/schemas/OrganizationMembershipLevelEnum'
        joined_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_2fa_enabled:
          type: boolean
          readOnly: true
        has_social_auth:
          type: boolean
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          nullable: true
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type: boolean
          nullable: true
        hedgehog_config:
          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    PaginatedOrganizationMemberList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMember'
    OrganizationMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        level:
          $ref: '#/components/schemas/OrganizationMembershipLevelEnum'
        joined_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_2fa_enabled:
          type: boolean
          readOnly: true
        has_social_auth:
          type: boolean
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
      required:
      - has_social_auth
      - id
      - is_2fa_enabled
      - joined_at
      - last_login
      - updated_at
      - user
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    NullEnum:
      enum:
      - null
  parameters:
    OrganizationIdPath:
      in: path
      name: organization_id
      required: true
      schema:
        type: string
      description: ID of the organization you're trying to access. To find the ID of the organization, make a call to /api/organizations/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
