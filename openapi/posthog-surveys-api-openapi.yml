          nullable: true
        response_sampling_limit:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        response_sampling_daily_limits:
          nullable: true
        enable_partial_responses:
          type: boolean
          nullable: true
        enable_iframe_embedding:
          type: boolean
          nullable: true
        translations:
          nullable: true
        _create_in_folder:
          type: string
          writeOnly: true
          title: ' create in folder'
        form_content:
          nullable: true
