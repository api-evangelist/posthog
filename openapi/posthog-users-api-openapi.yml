      enum:
      - above
      - below
      - hidden
      type: string
      description: '* `above` - Above

        * `below` - Below

        * `hidden` - Hidden'
    UserGitHubIntegrationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: PostHog UserIntegration row id.
        kind:
          type: string
          description: Integration kind; always `github` for this API.
        installation_id:
          type: string
          description: GitHub App installation id.
        repository_selection:
          type: string
          nullable: true
          description: Repository selection mode from GitHub (e.g. selected or all).
        account:
          allOf:
          - $ref: '#/components/schemas/UserGitHubAccount'
          nullable: true
          description: Installation account metadata from GitHub.
        uses_shared_installation:
          type: boolean
          description: True when this installation id matches a team-level GitHub integration on the active project.
        created_at:
          type: string
          format: date-time
          description: When this integration row was created.
      required:
      - created_at
      - id
      - installation_id
      - kind
      - uses_shared_installation
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    UserGitHubLinkStartRequest:
      type: object
      properties:
        team_id:
          type: integer
          nullable: true
          description: Optional team/project id (e.g. PostHog Code); web UI uses the session's current team.
        connect_from:
          type: string
          description: Optional client hint (e.g. posthog_code) for return routing after OAuth.
    OrganizationBasic:
      type: object
      description: 'Serializer for `Organization` model with minimal attributes to speeed up loading and transfer times.

        Also used for nested serializers.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 64
        slug:
          type: string
          maxLength: 48
          pattern: ^[-a-zA-Z0-9_]+$
        logo_media_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        membership_level:
          allOf:
          - $ref: '#/components/schemas/EffectiveMembershipLevelEnum'
          nullable: true
          readOnly: true
        members_can_use_personal_api_keys:
          type: boolean
        is_active:
          type: boolean
          nullable: true
          title: Active
          description: Set this to 'No' to temporarily disable an organization.
        is_not_active_reason:
          type: string
          nullable: true
          title: De-activated reason
          description: (optional) reason for why the organization has been de-activated. This will be displayed to users on the web app.
          maxLength: 200
        is_pending_deletion:
          type: boolean
          nullable: true
          description: Set to True when org deletion has been initiated. Blocks all UI access until the async task completes.
      required:
      - id
      - logo_media_id
      - membership_level
      - name
      - slug
    BlankEnum:
      enum:
      - ''
    UserGitHubIntegrationListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserGitHubIntegrationItem'
          description: GitHub personal integrations for the authenticated user.
      required:
      - results
