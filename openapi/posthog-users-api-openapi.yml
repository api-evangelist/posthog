  /api/users/request_email_verification/:
    post:
      operationId: users_request_email_verification_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
  /api/users/verify_email/:
    post:
      operationId: users_verify_email_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
components:
  schemas:
    GitHubReposResponse:
      type: object
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/GitHubRepo'
        has_more:
          type: boolean
          description: Whether more repositories are available beyond this page.
      required:
      - has_more
      - repositories
    GitHubReposRefreshResponse:
      type: object
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/GitHubRepo'
          description: The refreshed repository cache.
      required:
      - repositories
    PaginatedUserGitHubIntegrationListResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserGitHubIntegrationListResponse'
    UserGitHubLinkStartResponse:
      type: object
      properties:
        install_url:
          type: string
          description: URL to open in the browser to install or authorize the GitHub App for this user.
        connect_flow:
          type: string
          description: OAuth or install flow used for this GitHub connection.
      required:
      - connect_flow
      - install_url
    PendingInvite:
      type: object
      description: Shape of each item in UserSerializer.pending_invites.
      properties:
        id:
          type: string
        target_email:
          type: string
          format: email
        organization_id:
          type: string
        organization_name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - id
      - organization_id
      - organization_name
      - target_email
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    User:
      type: object
      properties:
        date_joined:
          type: string
          format: date-time
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          readOnly: true
          nullable: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        pending_email:
          type: string
          format: email
          readOnly: true
          nullable: true
          title: Pending email address awaiting verification
        is_email_verified:
          type: boolean
          readOnly: true
          nullable: true
        notification_settings:
          type: object
          additionalProperties: true
          description: Map of notification preferences. Keys include `plugin_disabled`, `all_weekly_report_disabled`, `project_weekly_digest_disabled`, `error_tracking_weekly_digest_project_enabled`, `web_analytics_weekly_digest_project_enabled`, `organization_member_join_email_disabled`, `data_pipeline_error_threshold` (number between 0.0 and 1.0), and other per-topic switches. Values are either booleans, or (for per-project/per-resource keys) a map of IDs to booleans. Only the keys you send are updated — other preferences stay as-is.
        anonymize_data:
          type: boolean
          nullable: true
          description: Whether PostHog should anonymize events captured for this user when identified.
        allow_impersonation:
          type: boolean
          nullable: true
        toolbar_mode:
