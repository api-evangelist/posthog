openapi: 3.2.0
info:
  title: PostHog Users API
  version: 1.0.0
  description: ''
tags:
- name: Users
paths:
  /api/users/{user_id}/signal_autonomy/:
    get:
      operationId: users_signal_autonomy_retrieve
      description: 'Per-user signal autonomy config (singleton keyed by user).


        GET /api/users//signal_autonomy/ → current config (or 404)

        POST /api/users//signal_autonomy/ → create or update

        DELETE /api/users//signal_autonomy/ → remove (opt out)'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - Users
      security:
      - PersonalAPIKeyAuth:
        - user:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalUserAutonomyConfig'
          description: ''
      x-explicit-tags:
      - users
      - signals
      summary: Users signal autonomy retrieve
      x-summary-source: derived
    post:
      operationId: users_signal_autonomy_create
      description: 'Per-user signal autonomy config (singleton keyed by user).


        GET /api/users//signal_autonomy/ → current config (or 404)

        POST /api/users//signal_autonomy/ → create or update

        DELETE /api/users//signal_autonomy/ → remove (opt out)'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalUserAutonomyConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignalUserAutonomyConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignalUserAutonomyConfig'
      security:
      - PersonalAPIKeyAuth:
        - user:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalUserAutonomyConfig'
          description: ''
      x-explicit-tags:
      - users
      - signals
      summary: Users signal autonomy create
      x-summary-source: derived
    delete:
      operationId: users_signal_autonomy_destroy
      description: 'Per-user signal autonomy config (singleton keyed by user).


        GET /api/users//signal_autonomy/ → current config (or 404)

        POST /api/users//signal_autonomy/ → create or update

        DELETE /api/users//signal_autonomy/ → remove (opt out)'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - Users
      security:
      - PersonalAPIKeyAuth:
        - user:write
      responses:
        '204':
          description: No response body
      x-explicit-tags:
      - users
      - signals
      summary: Users signal autonomy destroy
      x-summary-source: derived
components:
  schemas:
    NullEnum:
      enum:
      - null
    AutostartPriorityEnum:
      enum:
      - P0
      - P1
      - P2
      - P3
      - P4
      type: string
      description: '* `P0` - P0

        * `P1` - P1

        * `P2` - P2

        * `P3` - P3

        * `P4` - P4'
    _User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
      required:
      - email
      - first_name
      - id
      - last_name
      - uuid
    BlankEnum:
      enum:
      - ''
    SignalUserAutonomyConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/_User'
          readOnly: true
        autostart_priority:
          oneOf:
          - $ref: '#/components/schemas/AutostartPriorityEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
      - user
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
