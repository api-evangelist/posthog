openapi: 3.0.3
info:
  title: PostHog actions users API
  version: 1.0.0
  description: ''
tags:
- name: users
paths:
  /api/users/:
    get:
      operationId: users_list
      parameters:
      - in: query
        name: email
        schema:
          type: string
      - in: query
        name: is_staff
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - users
      security:
      - PersonalAPIKeyAuth:
        - user:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
      x-explicit-tags:
      - core
  /api/users/{user_id}/signal_autonomy/:
    get:
      operationId: users_signal_autonomy_retrieve
      description: 'Per-user signal autonomy config (singleton keyed by user).


        GET    /api/users/<id>/signal_autonomy/ → current config (or 404)

        POST   /api/users/<id>/signal_autonomy/ → create or update

        DELETE /api/users/<id>/signal_autonomy/ → remove (opt out)'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - PersonalAPIKeyAuth:
        - user:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalUserAutonomyConfig'
          description: ''
      x-explicit-tags:
      - users
      - signals
    post:
      operationId: users_signal_autonomy_create
      description: 'Per-user signal autonomy config (singleton keyed by user).


        GET    /api/users/<id>/signal_autonomy/ → current config (or 404)

        POST   /api/users/<id>/signal_autonomy/ → create or update

        DELETE /api/users/<id>/signal_autonomy/ → remove (opt out)'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalUserAutonomyConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignalUserAutonomyConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignalUserAutonomyConfig'
      security:
      - PersonalAPIKeyAuth:
        - user:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalUserAutonomyConfig'
          description: ''
      x-explicit-tags:
      - users
      - signals
    delete:
      operationId: users_signal_autonomy_destroy
      description: 'Per-user signal autonomy config (singleton keyed by user).


        GET    /api/users/<id>/signal_autonomy/ → current config (or 404)

        POST   /api/users/<id>/signal_autonomy/ → create or update

        DELETE /api/users/<id>/signal_autonomy/ → remove (opt out)'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - PersonalAPIKeyAuth:
        - user:write
      responses:
        '204':
          description: No response body
      x-explicit-tags:
      - users
      - signals
  /api/users/{uuid}/:
    get:
      operationId: users_retrieve
      description: Retrieve a user's profile and settings. Pass `@me` as the UUID to fetch the authenticated user; non-staff callers may only access their own account.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - PersonalAPIKeyAuth:
        - user:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
      x-explicit-tags:
      - core
    put:
      operationId: users_update
      description: Replace the authenticated user's profile and settings. Pass `@me` as the UUID to update the authenticated user. Prefer the PATCH endpoint for partial updates — PUT requires every writable field to be provided.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - user:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
      x-explicit-tags:
      - core
    patch:
      operationId: users_partial_update
      description: Update one or more of the authenticated user's profile fields or settings.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - PersonalAPIKeyAuth:
        - user:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
      x-explicit-tags:
      - core
    delete:
      operationId: users_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      responses:
        '204':
          description: No response body
      x-explicit-tags:
      - core
  /api/users/{uuid}/github_login/:
    get:
      operationId: users_github_login_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - PersonalAPIKeyAuth:
        - user:read
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
  /api/users/{uuid}/hedgehog_config/:
    get:
      operationId: users_hedgehog_config_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - PersonalAPIKeyAuth:
        - user:read
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
    patch:
      operationId: users_hedgehog_config_partial_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - PersonalAPIKeyAuth:
        - user:write
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
  /api/users/{uuid}/integrations/:
    get:
      operationId: users_integrations_list
      description: '`/api/users/@me/integrations/` — manage the user''s personal GitHub integrations.'
      summary: List personal GitHub integrations
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: path
        name: uuid
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - PersonalAPIKeyAuth:
        - user:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserGitHubIntegrationListResponseList'
          description: ''
      x-explicit-tags:
      - core
  /api/users/{uuid}/integrations/github/{installation_id}/:
    delete:
      operationId: users_integrations_github_destroy
      description: Remove a specific GitHub installation by its installation_id.
      summary: Disconnect a personal GitHub integration
      parameters:
      - in: path
        name: installation_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: uuid
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - PersonalAPIKeyAuth:
        - user:write
      responses:
        '204':
          description: Integration removed.
      x-explicit-tags:
      - core
  /api/users/{uuid}/integrations/github/{installation_id}/branches/:
    get:
      operationId: users_integrations_github_branches_retrieve
      description: List branches for a repository accessible to a personal GitHub installation.
      summary: List branches for a personal GitHub installation repository
      parameters:
      - in: path
        name: installation_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
        description: Maximum number of branches to return
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Number of branches to skip
      - in: query
        name: repo
        schema:
          type: string
          minLength: 1
        description: Repository in owner/repo format
        required: true
      - in: query
        name: search
        schema:
          type: string
          default: ''
        description: Optional case-insensitive branch name search query.
      - in: path
        name: uuid
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - PersonalAPIKeyAuth:
        - user:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubBranchesResponse'
          description: ''
      x-explicit-tags:
      - core
  /api/users/{uuid}/integrations/github/{installation_id}/repos/:
    get:
      operationId: users_integrations_github_repos_retrieve
      description: List repositories accessible to a specific GitHub installation (paginated, cached).
      summary: List repositories for a personal GitHub installation
      parameters:
      - in: path
        name: installation_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
        description: Maximum number of repositories to return per request (max 500).
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Number of repositories to skip before returning results.
      - in: query
        name: search
        schema:
          type: string
          default: ''
        description: Optional case-insensitive repository name search query.
      - in: path
        name: uuid
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - PersonalAPIKeyAuth:
        - user:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubReposResponse'
          description: ''
      x-explicit-tags:
      - core
  /api/users/{uuid}/integrations/github/{installation_id}/repos/refresh/:
    post:
      operationId: users_integrations_github_repos_refresh_create
      description: Refresh repositories accessible to a specific GitHub installation.
      summary: Refresh repositories for a personal GitHub installation
      parameters:
      - in: path
        name: installation_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: uuid
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - PersonalAPIKeyAuth:
        - user:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubReposRefreshResponse'
          description: ''
      x-explicit-tags:
      - core
  /api/users/{uuid}/integrations/github/start/:
    post:
      operationId: users_integrations_github_start_create
      description: 'Start GitHub linking: either full App install or OAuth-only (user-to-server).


        ``**_kwargs`` absorbs ``parent_lookup_uuid`` from the nested

        ``/api/users/{uuid}/integrations/`` router (same pattern as ``local_evaluation``

        under projects).


        Usually returns ``install_url`` pointing at ``/installations/new`` so the

        user can pick any GitHub org (new or already connected).  GitHub''s install

        page handles both cases: orgs where the app is installed show "Configure"

        (no admin needed), orgs where it isn''t show "Install" (needs admin).


        **PostHog Code fast path:** when ``connect_from`` is ``"posthog_code"``,

        the current project already has a team-level GitHub installation, and the

        user has no ``UserIntegration`` for that installation yet, we skip the org

        picker and redirect straight to ``/login/oauth/authorize`` so the user

        only authorizes themselves and returns to PostHog Code immediately.


        In both cases the response key is ``install_url`` for compatibility with callers.'
      summary: Start GitHub personal integration linking
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGitHubLinkStartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserGitHubLinkStartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserGitHubLinkStartRequest'
      security:
      - PersonalAPIKeyAuth:
        - user:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGitHubLinkStartResponse'
          description: ''
      x-explicit-tags:
      - core
  /api/users/{uuid}/scene_personalisation/:
    post:
      operationId: users_scene_personalisation_create
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
  /api/users/{uuid}/start_2fa_setup/:
    get:
      operationId: users_start_2fa_setup_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
  /api/users/{uuid}/two_factor_backup_codes/:
    post:
      operationId: users_two_factor_backup_codes_create
      description: Generate new backup codes, invalidating any existing ones
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
