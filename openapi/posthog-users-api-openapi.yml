        is_2fa_enabled:
          type: boolean
          readOnly: true
        has_social_auth:
          type: boolean
          readOnly: true
        has_sso_enforcement:
          type: boolean
          readOnly: true
        has_seen_product_intro_for:
          nullable: true
        scene_personalisation:
          type: array
          items:
            $ref: '#/components/schemas/ScenePersonalisationBasic'
          readOnly: true
