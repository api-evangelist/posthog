      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
  /api/users/{uuid}/two_factor_disable/:
    post:
      operationId: users_two_factor_disable_create
      description: Disable 2FA and remove all related devices
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
  /api/users/{uuid}/two_factor_start_setup/:
    get:
      operationId: users_two_factor_start_setup_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
  /api/users/{uuid}/two_factor_status/:
    get:
      operationId: users_two_factor_status_retrieve
      description: Get current 2FA status including backup codes if enabled
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
  /api/users/{uuid}/two_factor_validate/:
    post:
      operationId: users_two_factor_validate_create
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
