          readOnly: true
        deleted:
          type: boolean
          nullable: true
        name:
          type: string
          description: Unique name for the view. Used as the table name in HogQL queries and the node name in the data modeling Node.
          maxLength: 128
        query:
          nullable: true
          description: 'HogQL query definition as a JSON object with a "query" key containing the SQL string and a "kind" key containing the query type. Example: {"query": "SELECT * FROM events LIMIT 100", "kind": "HogQLQuery"}'
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        sync_frequency:
          type: string
          nullable: true
          readOnly: true
        columns:
          type: array
          items:
            type: object
            additionalProperties: true
          readOnly: true
        status:
          readOnly: true
          nullable: true
          description: 'The status of when this SavedQuery last ran.


            * `Cancelled` - Cancelled

            * `Modified` - Modified

            * `Completed` - Completed

            * `Failed` - Failed

            * `Running` - Running'
          oneOf:
          - $ref: '#/components/schemas/SavedQueryStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        last_run_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        managed_viewset_kind:
          type: string
          nullable: true
          readOnly: true
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: Optional folder ID used to organize this view in the SQL editor sidebar.
        folder_name:
          type: string
          readOnly: true
          nullable: true
          description: Folder name used to organize this view in the SQL editor sidebar.
        latest_error:
          type: string
          readOnly: true
          nullable: true
        edited_history_id:
          type: string
          writeOnly: true
          nullable: true
          description: Activity log ID from the last known edit. Used for conflict detection.
        latest_history_id:
          type: integer
          nullable: true
          readOnly: true
        soft_update:
          type: boolean
          writeOnly: true
          nullable: true
          description: If true, skip column inference and validation. For saving drafts.
        dag_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
          description: Optional DAG to place this view into
        is_materialized:
          type: boolean
          readOnly: true
          nullable: true
        origin:
          readOnly: true
          nullable: true
          description: 'Where this SavedQuery is created.


            * `data_warehouse` - Data Warehouse

            * `endpoint` - Endpoint

            * `managed_viewset` - Managed Viewset'
          oneOf:
          - $ref: '#/components/schemas/OriginEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_test:
          type: boolean
          description: Whether this view is for testing only and will auto-expire.
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When this test view should be automatically deleted.
        user_access_level:
          type: string
          nullable: true
          readOnly: true
          description: The effective access level the user has for this object
      required:
      - columns
      - created_at
      - created_by
      - expires_at
      - folder_name
      - id
      - is_materialized
      - last_run_at
      - latest_error
      - latest_history_id
      - managed_viewset_kind
      - name
      - origin
      - status
      - sync_frequency
      - user_access_level
    SyncTypeEnum:
      enum:
      - full_refresh
      - incremental
      - append
      - webhook
      - cdc
      type: string
      description: '* `full_refresh` - full_refresh

        * `incremental` - incremental

        * `append` - append

        * `webhook` - webhook

        * `cdc` - cdc'
    PatchedInsightVariable:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: UUID of the SQL variable.
        name:
          type: string
          description: Human-readable name for the SQL variable.
          maxLength: 400
        type:
          allOf:
          - $ref: '#/components/schemas/InsightVariableTypeEnum'
          description: 'Variable type. Controls how the value is rendered and substituted in HogQL.


            * `String` - String

            * `Number` - Number

            * `Boolean` - Boolean

            * `List` - List

            * `Date` - Date'
        default_value:
          nullable: true
          description: Default value used when a query references this variable.
        created_by:
          type: integer
          readOnly: true
          nullable: true
          description: ID of the user who created the SQL variable.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the SQL variable was created.
        code_name:
          type: string
          readOnly: true
          nullable: true
          description: Generated code-safe name used in HogQL as {variables.code_name}. Derived from name.
        values:
          nullable: true
          description: Allowed values for List variables. Null for other variable types.
    BlankEnum:
      enum:
      - ''
    AccessMethodEnum:
      enum:
      - warehouse
      - direct
      type: string
      description: '* `warehouse` - warehouse

        * `direct` - direct'
    ExternalDataSourceConnectionOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        prefix:
          type: string
          readOnly: true
          nullable: true
        engine:
          readOnly: true
          nullable: true
          description: 'Backend engine detected for the direct connection.


            * `duckdb` - duckdb

            * `postgres` - postgres'
          oneOf:
          - $ref: '#/components/schemas/EngineEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - engine
      - id
      - prefix
  parameters:
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
