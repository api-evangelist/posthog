components:
  schemas:
    DataWarehouseSavedQueryFolder:
      type: object
      description: Mixin for serializers to add user access control fields
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Display name for the folder used to organize saved queries in the SQL editor sidebar.
          maxLength: 128
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        view_count:
          type: integer
          readOnly: true
        user_access_level:
          type: string
          nullable: true
          readOnly: true
          description: The effective access level the user has for this object
      required:
      - created_at
      - created_by
      - id
      - name
      - user_access_level
      - view_count
    SyncFrequencyEnum:
      enum:
      - never
      - 1min
      - 5min
      - 15min
      - 30min
      - 1hour
      - 6hour
      - 12hour
      - 24hour
      - 7day
      - 30day
      type: string
      description: '* `never` - never

        * `1min` - 1min

        * `5min` - 5min

        * `15min` - 15min

        * `30min` - 30min

        * `1hour` - 1hour

        * `6hour` - 6hour

        * `12hour` - 12hour

        * `24hour` - 24hour

        * `7day` - 7day

        * `30day` - 30day'
    PatchedExternalDataSourceBulkUpdateSchemas:
      type: object
      properties:
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDataSourceBulkUpdateSchema'
          description: Schema updates to apply in a single batch.
    ProvisionWarehouseResponse:
      type: object
      properties:
        status:
          type: string
        team:
          type: string
      required:
      - status
      - team
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    DataWarehouseSavedQueryMinimal:
      type: object
      description: Lightweight serializer for list views - excludes large query field to reduce memory usage.
      properties:
        id:
          type: string
