              $ref: '#/components/schemas/ProvisionWarehouseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProvisionWarehouseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProvisionWarehouseRequest'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - warehouse_view:write
