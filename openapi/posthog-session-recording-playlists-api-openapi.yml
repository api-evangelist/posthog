          type: string
      tags:
      - session_recording_playlists
      security:
      - PersonalAPIKeyAuth:
        - session_recording_playlist:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessionRecordingPlaylistList'
