components:
  schemas:
    SessionRecordingPlaylistTypeEnum:
      enum:
      - collection
      - filters
      type: string
      description: '* `collection` - Collection

        * `filters` - Filters'
    BlankEnum:
      enum:
      - ''
    PaginatedSessionRecordingPlaylistList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/SessionRecordingPlaylist'
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          nullable: true
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type: boolean
          nullable: true
        hedgehog_config:
          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    PatchedSessionRecordingPlaylist:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        short_id:
          type: string
          readOnly: true
        name:
          type: string
          nullable: true
          description: Human-readable name for the playlist.
          maxLength: 400
        derived_name:
          type: string
          nullable: true
          maxLength: 400
        description:
          type: string
          description: Optional description of the playlist's purpose or contents.
        pinned:
          type: boolean
          description: Whether this playlist is pinned to the top of the list.
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        deleted:
          type: boolean
          description: Set to true to soft-delete the playlist.
        filters:
          description: JSON object with recording filter criteria. Only used when type is 'filters'. Defines which recordings match this saved filter view. When updating a filters-type playlist, you must include the existing filters alongside any other changes — omitting filters will be treated as removing them.
        last_modified_at:
          type: string
          format: date-time
          readOnly: true
        last_modified_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        recordings_counts:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              oneOf:
              - type: integer
              - type: boolean
              nullable: true
          readOnly: true
        type:
          nullable: true
          description: 'Playlist type: ''collection'' for manually curated recordings, ''filters'' for saved filter views. Required on create, cannot be changed after.


            * `collection` - Collection

            * `filters` - Filters'
          oneOf:
          - $ref: '#/components/schemas/SessionRecordingPlaylistTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_synthetic:
          type: boolean
          description: Return whether this is a synthetic playlist
          readOnly: true
        _create_in_folder:
          type: string
          writeOnly: true
          title: ' create in folder'
    SessionRecordingPlaylist:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        short_id:
          type: string
          readOnly: true
        name:
          type: string
          nullable: true
          description: Human-readable name for the playlist.
          maxLength: 400
        derived_name:
          type: string
          nullable: true
          maxLength: 400
        description:
          type: string
          description: Optional description of the playlist's purpose or contents.
        pinned:
          type: boolean
          description: Whether this playlist is pinned to the top of the list.
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        deleted:
          type: boolean
          description: Set to true to soft-delete the playlist.
        filters:
          description: JSON object with recording filter criteria. Only used when type is 'filters'. Defines which recordings match this saved filter view. When updating a filters-type playlist, you must include the existing filters alongside any other changes — omitting filters will be treated as removing them.
        last_modified_at:
          type: string
          format: date-time
          readOnly: true
        last_modified_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        recordings_counts:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              oneOf:
              - type: integer
              - type: boolean
              nullable: true
          readOnly: true
        type:
          nullable: true
          description: 'Playlist type: ''collection'' for manually curated recordings, ''filters'' for saved filter views. Required on create, cannot be changed after.


            * `collection` - Collection

            * `filters` - Filters'
          oneOf:
          - $ref: '#/components/schemas/SessionRecordingPlaylistTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_synthetic:
          type: boolean
          description: Return whether this is a synthetic playlist
          readOnly: true
        _create_in_folder:
          type: string
          writeOnly: true
          title: ' create in folder'
      required:
      - created_at
      - created_by
      - id
      - is_synthetic
      - last_modified_at
      - last_modified_by
      - recordings_counts
      - short_id
    NullEnum:
      enum:
      - null
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
