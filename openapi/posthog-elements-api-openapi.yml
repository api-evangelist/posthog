openapi: 3.0.3
info:
  title: PostHog actions elements API
  version: 1.0.0
  description: ''
tags:
- name: elements
paths:
  /api/environments/{environment_id}/elements/:
    get:
      operationId: environments_elements_list
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - elements
      security:
      - PersonalAPIKeyAuth:
        - element:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedElementList'
          description: ''
      deprecated: true
      x-explicit-tags:
      - product_analytics
    post:
      operationId: environments_elements_create
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - elements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Element'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Element'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Element'
      security:
      - PersonalAPIKeyAuth:
        - element:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
          description: ''
      deprecated: true
      x-explicit-tags:
      - product_analytics
  /api/environments/{environment_id}/elements/{id}/:
    get:
      operationId: environments_elements_retrieve
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this element.
        required: true
      tags:
      - elements
      security:
      - PersonalAPIKeyAuth:
        - element:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
          description: ''
      deprecated: true
      x-explicit-tags:
      - product_analytics
    put:
      operationId: environments_elements_update
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this element.
        required: true
      tags:
      - elements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Element'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Element'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Element'
      security:
      - PersonalAPIKeyAuth:
        - element:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
          description: ''
      deprecated: true
      x-explicit-tags:
      - product_analytics
    patch:
      operationId: environments_elements_partial_update
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this element.
        required: true
      tags:
      - elements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedElement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedElement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedElement'
      security:
      - PersonalAPIKeyAuth:
        - element:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
          description: ''
      deprecated: true
      x-explicit-tags:
      - product_analytics
    delete:
      operationId: environments_elements_destroy
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this element.
        required: true
      tags:
      - elements
      security:
      - PersonalAPIKeyAuth:
        - element:write
      responses:
        '204':
          description: No response body
      deprecated: true
      x-explicit-tags:
      - product_analytics
  /api/environments/{environment_id}/elements/stats/:
    get:
      operationId: environments_elements_stats_retrieve
      description: 'The original version of this API always and only returned $autocapture elements

        If no include query parameter is sent this remains true.

        Now, you can pass a combination of include query parameters to get different types of elements

        Currently only $autocapture and $rageclick and $dead_click are supported'
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - elements
      security:
      - PersonalAPIKeyAuth:
        - element:read
      responses:
        '200':
          description: No response body
      deprecated: true
      x-explicit-tags:
      - product_analytics
  /api/environments/{environment_id}/elements/values/:
    get:
      operationId: environments_elements_values_retrieve
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - elements
      security:
      - PersonalAPIKeyAuth:
        - element:read
      responses:
        '200':
          description: No response body
      deprecated: true
      x-explicit-tags:
      - product_analytics
  /api/projects/{project_id}/elements/:
    get:
      operationId: elements_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - elements
      security:
      - PersonalAPIKeyAuth:
        - element:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedElementList'
          description: ''
      x-explicit-tags:
      - product_analytics
    post:
      operationId: elements_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - elements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Element'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Element'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Element'
      security:
      - PersonalAPIKeyAuth:
        - element:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
          description: ''
      x-explicit-tags:
      - product_analytics
  /api/projects/{project_id}/elements/{id}/:
    get:
      operationId: elements_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this element.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - elements
      security:
      - PersonalAPIKeyAuth:
        - element:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
          description: ''
      x-explicit-tags:
      - product_analytics
    put:
      operationId: elements_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this element.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - elements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Element'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Element'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Element'
      security:
      - PersonalAPIKeyAuth:
        - element:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
          description: ''
      x-explicit-tags:
      - product_analytics
    patch:
      operationId: elements_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this element.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - elements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedElement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedElement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedElement'
      security:
      - PersonalAPIKeyAuth:
        - element:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
          description: ''
      x-explicit-tags:
      - product_analytics
    delete:
      operationId: elements_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this element.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - elements
      security:
      - PersonalAPIKeyAuth:
        - element:write
      responses:
        '204':
          description: No response body
      x-explicit-tags:
      - product_analytics
  /api/projects/{project_id}/elements/stats/:
    get:
      operationId: elements_stats_retrieve
      description: 'The original version of this API always and only returned $autocapture elements

        If no include query parameter is sent this remains true.

        Now, you can pass a combination of include query parameters to get different types of elements

        Currently only $autocapture and $rageclick and $dead_click are supported'
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - elements
      security:
      - PersonalAPIKeyAuth:
        - element:read
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - product_analytics
  /api/projects/{project_id}/elements/values/:
    get:
      operationId: elements_values_retrieve
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - elements
      security:
      - PersonalAPIKeyAuth:
        - element:read
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - product_analytics
components:
  schemas:
    PatchedElement:
      type: object
      properties:
        text:
          type: string
          nullable: true
          maxLength: 10000
        tag_name:
          type: string
          nullable: true
          maxLength: 1000
        attr_class:
          type: array
          items:
            type: string
            maxLength: 200
          nullable: true
        href:
          type: string
          nullable: true
          maxLength: 10000
        attr_id:
          type: string
          nullable: true
          maxLength: 10000
        nth_child:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        nth_of_type:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        attributes: {}
        order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
    Element:
      type: object
      properties:
        text:
          type: string
          nullable: true
          maxLength: 10000
        tag_name:
          type: string
          nullable: true
          maxLength: 1000
        attr_class:
          type: array
          items:
            type: string
            maxLength: 200
          nullable: true
        href:
          type: string
          nullable: true
          maxLength: 10000
        attr_id:
          type: string
          nullable: true
          maxLength: 10000
        nth_child:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        nth_of_type:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        attributes: {}
        order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
    PaginatedElementList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Element'
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
