components:
  schemas:
    TestHogResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TestHogResultItem'
        message:
          type: string
          description: Optional message, e.g. when no recent events were found.
      required:
      - results
    TranslateRequest:
      type: object
      properties:
        text:
          type: string
          description: The text to translate
          maxLength: 10000
        target_language:
          type: string
          default: en
          description: 'Target language code (default: ''en'' for English)'
          maxLength: 10
      required:
      - text
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    LLMProviderKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider:
          $ref: '#/components/schemas/LLMProviderEnum'
        name:
          type: string
          maxLength: 255
        state:
          allOf:
          - $ref: '#/components/schemas/LLMProviderKeyStateEnum'
          readOnly: true
        error_message:
          type: string
          readOnly: true
          nullable: true
        api_key:
          type: string
          writeOnly: true
        api_key_masked:
          type: string
          readOnly: true
        azure_endpoint:
          type: string
          format: uri
          writeOnly: true
          description: Azure OpenAI endpoint URL
        api_version:
          type: string
          writeOnly: true
          description: Azure OpenAI API version
          maxLength: 20
        azure_endpoint_display:
          type: string
          nullable: true
          readOnly: true
          description: Azure endpoint (read-only, for display)
        api_version_display:
          type: string
          nullable: true
          readOnly: true
          description: Azure API version (read-only, for display)
        set_as_active:
          type: boolean
          writeOnly: true
          default: false
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - api_key_masked
      - api_version_display
      - azure_endpoint_display
      - created_at
      - created_by
      - error_message
      - id
      - last_used_at
      - name
      - provider
      - state
    OutputTypeEnum:
      enum:
      - boolean
      type: string
      description: '* `boolean` - Boolean (Pass/Fail)'
    PaginatedLLMSkillListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/LLMSkillList'
    PaginatedEvaluationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Evaluation'
    LLMSkillVersionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_latest:
          type: boolean
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - is_latest
      - version
    EvaluationConfig:
      type: object
      properties:
        trial_eval_limit:
          type: integer
          readOnly: true
          description: Maximum number of llm_judge runs the team may execute on PostHog trial credits.
        trial_evals_used:
          type: integer
          readOnly: true
          description: Number of llm_judge runs already consumed against the trial credit pool.
        trial_evals_remaining:
          type: integer
          readOnly: true
          description: Number of trial evaluation runs remaining before the team must supply its own provider key.
        active_provider_key:
          allOf:
          - $ref: '#/components/schemas/LLMProviderKey'
          readOnly: true
          nullable: true
          description: Provider key currently used to run llm_judge evaluations. Null when the team is on trial credits.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the evaluation config row was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the evaluation config row was last modified.
      required:
      - active_provider_key
      - created_at
      - trial_eval_limit
      - trial_evals_remaining
      - trial_evals_used
      - updated_at
    TextReprResponse:
      type: object
      properties:
        text:
          type: string
          description: Generated text representation of the event
        metadata:
          allOf:
          - $ref: '#/components/schemas/TextReprMetadata'
          description: Metadata about the text representation
      required:
      - metadata
      - text
    NullEnum:
      enum:
      - null
    PatchedScoreDefinitionMetadata:
      type: object
      properties:
        name:
          type: string
          description: Updated scorer name.
          maxLength: 255
        description:
          type: string
          nullable: true
          description: Updated scorer description.
        archived:
          type: boolean
          description: Whether the scorer is archived.
    PaginatedReviewQueueList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueue'
    LLMPromptList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          description: Unique prompt name using letters, numbers, hyphens, and underscores only.
        prompt:
          readOnly: true
          description: Prompt payload as JSON or string data.
        version:
          type: integer
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted:
          type: boolean
          readOnly: true
        is_latest:
          type: boolean
          readOnly: true
        latest_version:
          type: integer
          readOnly: true
        version_count:
          type: integer
          readOnly: true
        first_version_created_at:
          type: string
          readOnly: true
        outline:
          type: array
          items:
            $ref: '#/components/schemas/LLMPromptOutlineEntry'
          readOnly: true
        prompt_preview:
          type: string
          readOnly: true
        prompt_size_bytes:
          type: integer
          readOnly: true
      required:
      - created_at
      - created_by
      - deleted
      - first_version_created_at
      - id
      - is_latest
      - latest_version
      - name
      - outline
      - prompt
      - prompt_preview
      - prompt_size_bytes
      - updated_at
      - version
      - version_count
    LLMSkillResolveResponse:
      type: object
      properties:
        skill:
          $ref: '#/components/schemas/LLMSkill'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/LLMSkillVersionSummary'
        has_more:
          type: boolean
      required:
      - has_more
      - skill
      - versions
    BooleanScoreDefinitionConfig:
      type: object
      properties:
        true_label:
          type: string
          description: Optional label for a true value.
        false_label:
          type: string
          description: Optional label for a false value.
    SentimentBatchResponse:
      type: object
      properties:
        results:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SentimentResult'
      required:
      - results
    LLMSkill:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Unique skill name. Lowercase letters, numbers, and hyphens only. Max 64 characters.
          maxLength: 64
        description:
          type: string
          description: What this skill does and when to use it. Max 4096 characters.
          maxLength: 4096
        body:
          type: string
          description: The SKILL.md instruction content (markdown).
        license:
          type: string
          description: License name or reference to a bundled license file.
          maxLength: 255
        compatibility:
          type: string
          description: Environment requirements (intended product, system packages, network access, etc.).
          maxLength: 500
        allowed_tools:
          type: array
          items:
            type: string
          description: List of pre-approved tools the skill may use.
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary key-value metadata.
        files:
          type: array
          items:
            $ref: '#/components/schemas/LLMSkillFileManifest'
          readOnly: true
          description: Bundled files manifest. Each entry is path + content_type only; fetch content via /llm_skills/name/{name}/files/{path}/.
        outline:
          type: array
          items:
            $ref: '#/components/schemas/LLMSkillOutlineEntry'
          readOnly: true
          description: Flat list of markdown headings parsed from the skill body. Useful as a lightweight table of contents.
        version:
          type: integer
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted:
          type: boolean
          readOnly: true
        is_latest:
          type: boolean
          readOnly: true
        latest_version:
          type: integer
          readOnly: true
        version_count:
          type: integer
          readOnly: true
        first_version_created_at:
          type: string
          readOnly: true
      required:
      - body
      - created_at
      - created_by
      - deleted
      - description
      - files
      - first_version_created_at
      - id
      - is_latest
      - latest_version
      - name
      - outline
      - updated_at
      - version
      - version_count
    DeliveryStatusEnum:
      enum:
      - pending
      - delivered
      - partial_failure
      - failed
      type: string
      description: '* `pending` - Pending

        * `delivered` - Delivered

        * `partial_failure` - Partial Failure

        * `failed` - Failed'
    LLMSkillEditOperation:
      type: object
      properties:
        old:
          type: string
          description: Text to find in the target content. Must match exactly once.
        new:
          type: string
          description: Replacement text.
      required:
      - new
      - old
    StructuredSummary:
      type: object
      properties:
        title:
          type: string
          description: Concise title (no longer than 10 words) summarizing the trace/event
        flow_diagram:
          type: string
          description: Mermaid flowchart code showing the main flow
        summary_bullets:
          type: array
          items:
            $ref: '#/components/schemas/SummaryBullet'
          description: Main summary bullets
        interesting_notes:
          type: array
          items:
            $ref: '#/components/schemas/InterestingNote'
          description: Interesting notes (0-2 for minimal, more for detailed)
      required:
      - flow_diagram
      - interesting_notes
      - summary_bullets
      - title
    LLMSkillFileManifest:
      type: object
      properties:
        path:
          type: string
          maxLength: 500
        content_type:
          type: string
          maxLength: 100
      required:
      - path
    EvaluationTypeEnum:
      enum:
      - llm_judge
      - hog
      type: string
      description: '* `llm_judge` - LLM as a judge

        * `hog` - Hog'
    FilterEnum:
      enum:
      - all
      - pass
      - fail
      - na
      type: string
      description: '* `all` - all

        * `pass` - pass

        * `fail` - fail

        * `na` - na'
    EvaluationReportFrequencyEnum:
      enum:
      - scheduled
      - every_n
      type: string
      description: '* `scheduled` - Scheduled

        * `every_n` - Every N'
    BlankEnum:
      enum:
      - ''
    TestHogRequest:
      type: object
      properties:
        source:
          type: string
          description: Hog source code to test. Must return a boolean (true = pass, false = fail) or null for N/A.
          minLength: 1
        sample_count:
          type: integer
          maximum: 10
          minimum: 1
          default: 5
          description: Number of recent $ai_generation events to test against (1–10, default 5).
        allows_na:
          type: boolean
          default: false
          description: Whether the evaluation can return N/A for non-applicable generations.
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Optional trigger conditions to filter which events are sampled.
      required:
      - source
    EvaluationRunRequest:
      type: object
      properties:
        evaluation_id:
          type: string
          format: uuid
          description: UUID of the evaluation to run.
        target_event_id:
          type: string
          format: uuid
          description: UUID of the $ai_generation event to evaluate.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the target event (needed for efficient ClickHouse lookup).
        event:
          type: string
          default: $ai_generation
          description: Event name. Defaults to '$ai_generation'.
        distinct_id:
          type: string
          nullable: true
          description: Distinct ID of the event (optional, improves lookup performance).
      required:
      - evaluation_id
      - target_event_id
      - timestamp
    LLMSkillDuplicate:
      type: object
      properties:
        new_name:
          type: string
          description: Name for the duplicated skill. Must be unique.
          maxLength: 64
      required:
      - new_name
    LLMProviderKeyStateEnum:
      enum:
      - unknown
      - ok
      - invalid
      - error
      type: string
      description: '* `unknown` - Unknown

        * `ok` - Ok

        * `invalid` - Invalid

        * `error` - Error'
    SummaryBullet:
      type: object
      properties:
        text:
          type: string
        line_refs:
          type: string
      required:
      - line_refs
      - text
    PaginatedTraceReviewList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/TraceReview'
    PatchedEvaluationReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        evaluation:
          type: string
          format: uuid
          description: UUID of the evaluation this report config belongs to.
        frequency:
          allOf:
          - $ref: '#/components/schemas/EvaluationReportFrequencyEnum'
          description: 'How report generation is triggered. ''every_n'' fires once N new evaluation results have accumulated (subject to cooldown_minutes and daily_run_cap). ''scheduled'' fires on the cadence defined by rrule + starts_at + timezone_name.


            * `scheduled` - Scheduled

            * `every_n` - Every N'
        rrule:
          type: string
          description: RFC 5545 recurrence rule string (e.g. 'FREQ=WEEKLY;BYDAY=MO'). Must not contain DTSTART — the anchor is set via starts_at. Required when frequency is 'scheduled'; ignored otherwise.
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: Anchor datetime for the rrule (ISO 8601, UTC — must end in 'Z'). Local-time interpretation is controlled by timezone_name. Required when frequency is 'scheduled'; ignored otherwise.
        timezone_name:
          type: string
          description: IANA timezone name used to expand the rrule in local time so e.g. '9am' stays at 9am across DST transitions (e.g. 'America/New_York'). Defaults to 'UTC'.
          maxLength: 64
        next_delivery_date:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        delivery_targets:
          description: 'List of delivery targets. Each entry is either {type: ''email'', value: ''user@example.com''} or {type: ''slack'', integration_id: <int>, channel: ''<channel>''}. Slack integration_id must belong to this team.'
        max_sample_size:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Maximum number of evaluation runs included in each report. Defaults to 200.
        enabled:
          type: boolean
          description: Whether report delivery is active. Disabled configs do not fire.
        deleted:
          type: boolean
          description: Set to true to soft-delete this report config.
        last_delivered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        report_prompt_guidance:
          type: string
          description: Optional custom instructions appended to the AI report prompt to steer focus, scope, or section choices without modifying the base prompt.
        trigger_threshold:
          type: integer
          maximum: 10000
          minimum: 10
          nullable: true
          description: Number of new evaluation results that triggers a report (every_n mode only). Min 10, max 10000. Defaults to 100. Required when frequency is 'every_n'.
        cooldown_minutes:
          type: integer
          maximum: 1440
          minimum: 60
          description: Minimum minutes between count-triggered reports to prevent spam (every_n mode only). Min 60, max 1440 (24 hours). Defaults to 60.
        daily_run_cap:
          type: integer
          maximum: 24
          minimum: 1
          description: Maximum count-triggered report runs per calendar day (UTC). Min 1, max 24 (one per cooldown window). Defaults to 10.
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PaginatedScoreDefinitionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ScoreDefinition'
    LLMSkillFileEdit:
      type: object
      properties:
        path:
          type: string
          description: Path of the bundled file to edit. Must match an existing file on the current skill version.
          maxLength: 500
        edits:
          type: array
          items:
            $ref: '#/components/schemas/LLMSkillEditOperation'
          description: Sequential find/replace operations to apply to this file's content.
      required:
      - edits
      - path
    EvaluationConfigSetActiveKeyRequest:
      type: object
      properties:
        key_id:
          type: string
          format: uuid
          description: UUID of an existing LLM provider key (state must be 'ok') to mark as the active key for running llm_judge evaluations team-wide.
      required:
      - key_id
    LLMPromptOutlineEntry:
      type: object
      properties:
        level:
          type: integer
          maximum: 6
          minimum: 1
          description: Markdown heading level (1-6).
        text:
          type: string
          description: Heading text with markdown link syntax preserved.
      required:
      - level
      - text
    BatchCheckRequest:
      type: object
      properties:
        trace_ids:
          type: array
          items:
            type: string
          description: List of trace IDs to check for cached summaries
          maxItems: 100
        mode:
          allOf:
          - $ref: '#/components/schemas/DetailModeValueEnum'
          default: minimal
          description: 'Summary detail level to check for


            * `minimal` - minimal

            * `detailed` - detailed'
        model:
          type: string
