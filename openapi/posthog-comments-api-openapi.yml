openapi: 3.0.3
info:
  title: PostHog actions comments API
  version: 1.0.0
  description: ''
tags:
- name: comments
paths:
  /api/projects/{project_id}/comments/:
    get:
      operationId: comments_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: item_id
        schema:
          type: string
          minLength: 1
        description: Filter by the ID of the resource being commented on.
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: query
        name: scope
        schema:
          type: string
          minLength: 1
        description: Filter by resource type (e.g. Dashboard, FeatureFlag, Insight, Replay).
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
        description: Full-text search within comment content.
      - in: query
        name: source_comment
        schema:
          type: string
          minLength: 1
        description: Filter replies to a specific parent comment.
      tags:
      - comments
      security:
      - PersonalAPIKeyAuth:
        - comment:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommentList'
          description: ''
      x-explicit-tags:
      - core
      - platform_features
    post:
      operationId: comments_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Comment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Comment'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - comment:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
      x-explicit-tags:
      - core
      - platform_features
  /api/projects/{project_id}/comments/{id}/:
    get:
      operationId: comments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this comment.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - comments
      security:
      - PersonalAPIKeyAuth:
        - comment:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
      x-explicit-tags:
      - core
      - platform_features
    put:
      operationId: comments_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this comment.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Comment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Comment'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - comment:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
      x-explicit-tags:
      - core
      - platform_features
    patch:
      operationId: comments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this comment.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedComment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedComment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedComment'
      security:
      - PersonalAPIKeyAuth:
        - comment:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
      x-explicit-tags:
      - core
      - platform_features
    delete:
      operationId: comments_destroy
      description: Hard delete of this model is not allowed. Use a patch API call to set "deleted" to true
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this comment.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - comments
      security:
      - PersonalAPIKeyAuth:
        - comment:write
      responses:
        '405':
          description: No response body
      x-explicit-tags:
      - core
      - platform_features
  /api/projects/{project_id}/comments/{id}/thread/:
    get:
      operationId: comments_thread_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this comment.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - comments
      security:
      - PersonalAPIKeyAuth:
        - comment:read
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
      - platform_features
  /api/projects/{project_id}/comments/count/:
    get:
      operationId: comments_count_retrieve
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - comments
      security:
      - PersonalAPIKeyAuth:
        - comment:read
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
      - platform_features
components:
  schemas:
    PaginatedCommentList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    BlankEnum:
      enum:
      - ''
    PatchedComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        deleted:
          type: boolean
          nullable: true
        mentions:
          type: array
          items:
            type: integer
          writeOnly: true
        slug:
          type: string
          writeOnly: true
        content:
          type: string
          nullable: true
        rich_content:
          nullable: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        item_id:
          type: string
          nullable: true
          maxLength: 72
        item_context:
          nullable: true
        scope:
          type: string
          maxLength: 79
        source_comment:
          type: string
          format: uuid
          nullable: true
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          nullable: true
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type: boolean
          nullable: true
        hedgehog_config:
          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        deleted:
          type: boolean
          nullable: true
        mentions:
          type: array
          items:
            type: integer
          writeOnly: true
        slug:
          type: string
          writeOnly: true
        content:
          type: string
          nullable: true
        rich_content:
          nullable: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        item_id:
          type: string
          nullable: true
          maxLength: 72
        item_context:
          nullable: true
        scope:
          type: string
          maxLength: 79
        source_comment:
          type: string
          format: uuid
          nullable: true
      required:
      - created_at
      - created_by
      - id
      - scope
      - version
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    NullEnum:
      enum:
      - null
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
