openapi: 3.0.3
info:
  title: PostHog actions saved API
  version: 1.0.0
  description: ''
tags:
- name: saved
paths:
  /api/environments/{environment_id}/saved/:
    get:
      operationId: environments_saved_list
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - saved
      security:
      - PersonalAPIKeyAuth:
        - heatmap:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHeatmapScreenshotResponseList'
          description: ''
      deprecated: true
      x-explicit-tags: []
    post:
      operationId: environments_saved_create
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - saved
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeatmapScreenshotResponse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HeatmapScreenshotResponse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HeatmapScreenshotResponse'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - heatmap:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapScreenshotResponse'
          description: ''
      deprecated: true
      x-explicit-tags: []
  /api/environments/{environment_id}/saved/{short_id}/:
    get:
      operationId: environments_saved_retrieve
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: short_id
        schema:
          type: string
        required: true
      tags:
      - saved
      security:
      - PersonalAPIKeyAuth:
        - heatmap:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapScreenshotResponse'
          description: ''
      deprecated: true
      x-explicit-tags: []
    patch:
      operationId: environments_saved_partial_update
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: short_id
        schema:
          type: string
        required: true
      tags:
      - saved
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHeatmapScreenshotResponse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHeatmapScreenshotResponse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHeatmapScreenshotResponse'
      security:
      - PersonalAPIKeyAuth:
        - heatmap:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapScreenshotResponse'
          description: ''
      deprecated: true
      x-explicit-tags: []
    delete:
      operationId: environments_saved_destroy
      description: Hard delete of this model is not allowed. Use a patch API call to set "deleted" to true
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: short_id
        schema:
          type: string
        required: true
      tags:
      - saved
      security:
      - PersonalAPIKeyAuth:
        - heatmap:write
      responses:
        '405':
          description: No response body
      deprecated: true
      x-explicit-tags: []
  /api/environments/{environment_id}/saved/{short_id}/regenerate/:
    post:
      operationId: environments_saved_regenerate_create
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: short_id
        schema:
          type: string
        required: true
      tags:
      - saved
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeatmapScreenshotResponse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HeatmapScreenshotResponse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HeatmapScreenshotResponse'
        required: true
      responses:
        '200':
          description: No response body
      deprecated: true
      x-explicit-tags: []
  /api/projects/{project_id}/saved/:
    get:
      operationId: saved_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - saved
      security:
      - PersonalAPIKeyAuth:
        - heatmap:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHeatmapScreenshotResponseList'
          description: ''
      x-explicit-tags: []
    post:
      operationId: saved_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - saved
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeatmapScreenshotResponse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HeatmapScreenshotResponse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HeatmapScreenshotResponse'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - heatmap:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapScreenshotResponse'
          description: ''
      x-explicit-tags: []
  /api/projects/{project_id}/saved/{short_id}/:
    get:
      operationId: saved_retrieve
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: path
        name: short_id
        schema:
          type: string
        required: true
      tags:
      - saved
      security:
      - PersonalAPIKeyAuth:
        - heatmap:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapScreenshotResponse'
          description: ''
      x-explicit-tags: []
    patch:
      operationId: saved_partial_update
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: path
        name: short_id
        schema:
          type: string
        required: true
      tags:
      - saved
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHeatmapScreenshotResponse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHeatmapScreenshotResponse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHeatmapScreenshotResponse'
      security:
      - PersonalAPIKeyAuth:
        - heatmap:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapScreenshotResponse'
          description: ''
      x-explicit-tags: []
    delete:
      operationId: saved_destroy
      description: Hard delete of this model is not allowed. Use a patch API call to set "deleted" to true
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: path
        name: short_id
        schema:
          type: string
        required: true
      tags:
      - saved
      security:
      - PersonalAPIKeyAuth:
        - heatmap:write
      responses:
        '405':
          description: No response body
      x-explicit-tags: []
  /api/projects/{project_id}/saved/{short_id}/regenerate/:
    post:
      operationId: saved_regenerate_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      - in: path
        name: short_id
        schema:
          type: string
        required: true
      tags:
      - saved
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeatmapScreenshotResponse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HeatmapScreenshotResponse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HeatmapScreenshotResponse'
        required: true
      responses:
        '200':
          description: No response body
      x-explicit-tags: []
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    HeatmapScreenshotResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        short_id:
          type: string
          readOnly: true
        name:
          type: string
          nullable: true
          maxLength: 400
        url:
          type: string
          format: uri
          maxLength: 2000
        data_url:
          type: string
          format: uri
          nullable: true
          description: URL for fetching heatmap data
          maxLength: 2000
        target_widths: {}
        type:
          $ref: '#/components/schemas/HeatmapScreenshotResponseTypeEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/HeatmapScreenshotResponseStatusEnum'
          readOnly: true
        has_content:
          type: boolean
          readOnly: true
        snapshots:
          type: array
          items:
            type: object
            additionalProperties: true
          readOnly: true
        deleted:
          type: boolean
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        exception:
          type: string
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - exception
      - has_content
      - id
      - short_id
      - snapshots
      - status
      - updated_at
      - url
    PatchedHeatmapScreenshotResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        short_id:
          type: string
          readOnly: true
        name:
          type: string
          nullable: true
          maxLength: 400
        url:
          type: string
          format: uri
          maxLength: 2000
        data_url:
          type: string
          format: uri
          nullable: true
          description: URL for fetching heatmap data
          maxLength: 2000
        target_widths: {}
        type:
          $ref: '#/components/schemas/HeatmapScreenshotResponseTypeEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/HeatmapScreenshotResponseStatusEnum'
          readOnly: true
        has_content:
          type: boolean
          readOnly: true
        snapshots:
          type: array
          items:
            type: object
            additionalProperties: true
          readOnly: true
        deleted:
          type: boolean
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        exception:
          type: string
          readOnly: true
          nullable: true
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          nullable: true
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type: boolean
          nullable: true
        hedgehog_config:
          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    HeatmapScreenshotResponseStatusEnum:
      enum:
      - processing
      - completed
      - failed
      type: string
      description: '* `processing` - Processing

        * `completed` - Completed

        * `failed` - Failed'
    PaginatedHeatmapScreenshotResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/HeatmapScreenshotResponse'
    HeatmapScreenshotResponseTypeEnum:
      enum:
      - screenshot
      - iframe
      - recording
      type: string
      description: '* `screenshot` - Screenshot

        * `iframe` - Iframe

        * `recording` - Recording'
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    NullEnum:
      enum:
      - null
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
