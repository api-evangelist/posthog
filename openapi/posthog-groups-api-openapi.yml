components:
  schemas:
    Group:
      type: object
      properties:
        group_type_index:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        group_key:
          type: string
          maxLength: 400
        group_properties: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - group_key
      - group_type_index
    CreateGroup:
      type: object
      properties:
        group_type_index:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        group_key:
          type: string
          maxLength: 400
        group_properties:
          nullable: true
      required:
      - group_key
      - group_type_index
    PaginatedGroupList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Group'
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
