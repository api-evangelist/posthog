openapi: 3.0.3
info:
  title: PostHog actions exports API
  version: 1.0.0
  description: ''
tags:
- name: exports
paths:
  /api/environments/{environment_id}/exports/:
    get:
      operationId: environments_exports_list
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - exports
      security:
      - PersonalAPIKeyAuth:
        - export:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExportedAssetList'
          description: ''
      deprecated: true
      x-explicit-tags:
      - core
    post:
      operationId: environments_exports_create
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - exports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportedAsset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExportedAsset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExportedAsset'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - export:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportedAsset'
          description: ''
      deprecated: true
      x-explicit-tags:
      - core
  /api/environments/{environment_id}/exports/{id}/:
    get:
      operationId: environments_exports_retrieve
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exported asset.
        required: true
      tags:
      - exports
      security:
      - PersonalAPIKeyAuth:
        - export:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportedAsset'
          description: ''
      deprecated: true
      x-explicit-tags:
      - core
  /api/environments/{environment_id}/exports/{id}/content/:
    get:
      operationId: environments_exports_content_retrieve
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exported asset.
        required: true
      tags:
      - exports
      security:
      - PersonalAPIKeyAuth:
        - export:read
      responses:
        '200':
          description: No response body
      deprecated: true
      x-explicit-tags:
      - core
  /api/projects/{project_id}/exports/:
    get:
      operationId: exports_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - exports
      security:
      - PersonalAPIKeyAuth:
        - export:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExportedAssetList'
          description: ''
      x-explicit-tags:
      - core
    post:
      operationId: exports_create
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - exports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportedAsset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExportedAsset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExportedAsset'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - export:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportedAsset'
          description: ''
      x-explicit-tags:
      - core
  /api/projects/{project_id}/exports/{id}/:
    get:
      operationId: exports_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exported asset.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - exports
      security:
      - PersonalAPIKeyAuth:
        - export:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportedAsset'
          description: ''
      x-explicit-tags:
      - core
  /api/projects/{project_id}/exports/{id}/content/:
    get:
      operationId: exports_content_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exported asset.
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - exports
      security:
      - PersonalAPIKeyAuth:
        - export:read
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
components:
  schemas:
    ExportedAsset:
      type: object
      description: Standard ExportedAsset serializer that doesn't return content.
      properties:
        id:
          type: integer
          readOnly: true
        dashboard:
          type: integer
          nullable: true
        insight:
          type: integer
          nullable: true
        export_format:
          $ref: '#/components/schemas/ExportFormatEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        has_content:
          type: boolean
          readOnly: true
        export_context:
          nullable: true
        filename:
          type: string
          readOnly: true
        expires_after:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        exception:
          type: string
          readOnly: true
          nullable: true
      required:
      - created_at
      - exception
      - expires_after
      - export_format
      - filename
      - has_content
      - id
    PaginatedExportedAssetList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExportedAsset'
    ExportFormatEnum:
      enum:
      - image/png
      - application/pdf
      - text/csv
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - video/webm
      - video/mp4
      - image/gif
      - application/json
      type: string
      description: '* `image/png` - image/png

        * `application/pdf` - application/pdf

        * `text/csv` - text/csv

        * `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet` - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

        * `video/webm` - video/webm

        * `video/mp4` - video/mp4

        * `image/gif` - image/gif

        * `application/json` - application/json'
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
