    SimpleExternalDataSourceSerializers:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        status:
          type: string
          readOnly: true
        source_type:
          allOf:
          - $ref: '#/components/schemas/ExternalDataSourceTypeEnum'
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - source_type
      - status
    BlankEnum:
