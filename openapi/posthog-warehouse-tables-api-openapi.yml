openapi: 3.0.3
info:
  title: PostHog actions warehouse_tables API
  version: 1.0.0
  description: ''
tags:
- name: warehouse_tables
paths:
  /api/environments/{environment_id}/warehouse_tables/:
    get:
      operationId: environments_warehouse_tables_list
      description: Create, Read, Update and Delete Warehouse Tables.
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - warehouse_tables
      security:
      - PersonalAPIKeyAuth:
        - warehouse_table:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTableList'
          description: ''
      deprecated: true
      x-explicit-tags:
      - data_warehouse
    post:
      operationId: environments_warehouse_tables_create
      description: Create, Read, Update and Delete Warehouse Tables.
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - warehouse_tables
      requestBody:
