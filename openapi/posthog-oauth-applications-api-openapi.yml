openapi: 3.0.3
info:
  title: PostHog actions oauth_applications API
  version: 1.0.0
  description: ''
tags:
- name: oauth_applications
paths:
  /api/organizations/{organization_id}/oauth_applications/:
    get:
      operationId: oauth_applications_list
      description: ViewSet for listing OAuth applications at the organization level (read-only).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/OrganizationIdPath'
      tags:
      - oauth_applications
      security:
      - PersonalAPIKeyAuth:
        - organization:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationOAuthApplicationList'
          description: ''
      x-explicit-tags:
      - core
components:
  schemas:
    PaginatedOrganizationOAuthApplicationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationOAuthApplication'
    OrganizationOAuthApplication:
      type: object
      description: Serializer for organization-scoped OAuth applications (read-only).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        client_id:
          type: string
          maxLength: 100
        redirect_uris_list:
          type: array
          items:
            type: string
          readOnly: true
        is_verified:
          type: boolean
          description: True if this application has been verified by PostHog
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - id
      - redirect_uris_list
      - updated
  parameters:
    OrganizationIdPath:
      in: path
      name: organization_id
      required: true
      schema:
        type: string
      description: ID of the organization you're trying to access. To find the ID of the organization, make a call to /api/organizations/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
