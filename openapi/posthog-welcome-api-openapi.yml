openapi: 3.0.3
info:
  title: PostHog actions welcome API
  version: 1.0.0
  description: ''
tags:
- name: welcome
paths:
  /api/organizations/{organization_id}/welcome/current/:
    get:
      operationId: welcome_current_retrieve
      description: Aggregated payload for the invited-user welcome screen.
      parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      tags:
      - welcome
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WelcomeResponse'
          description: ''
        '404':
          description: Current organization not found
      x-explicit-tags:
      - platform_features
components:
  schemas:
    WelcomeResponse:
      type: object
      properties:
        organization_name:
          type: string
        inviter:
          allOf:
          - $ref: '#/components/schemas/_WelcomeInviter'
          nullable: true
        team_members:
          type: array
          items:
            $ref: '#/components/schemas/_WelcomeTeamMember'
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/_WelcomeRecentActivity'
        popular_dashboards:
          type: array
          items:
            $ref: '#/components/schemas/_WelcomePopularDashboard'
        products_in_use:
          type: array
          items:
            type: string
        suggested_next_steps:
          type: array
          items:
            $ref: '#/components/schemas/_WelcomeSuggestedStep'
        is_organization_first_user:
          type: boolean
      required:
      - inviter
      - is_organization_first_user
      - organization_name
      - popular_dashboards
      - products_in_use
      - recent_activity
      - suggested_next_steps
      - team_members
    LastActiveEnum:
      enum:
      - today
      - this_week
      - inactive
      - never
      type: string
      description: '* `today` - today

        * `this_week` - this_week

        * `inactive` - inactive

        * `never` - never'
    _WelcomePopularDashboard:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        team_id:
          type: integer
        url:
          type: string
      required:
      - description
      - id
      - name
      - team_id
      - url
    _WelcomeSuggestedStep:
      type: object
      properties:
        label:
          type: string
        href:
          type: string
        reason:
          type: string
        docs_href:
          type: string
        product_key:
          type: string
      required:
      - href
      - label
      - reason
    _WelcomeRecentActivity:
      type: object
      properties:
        type:
          type: string
          description: Scope.activity pair, e.g. 'Insight.created'.
        actor_name:
          type: string
        entity_name:
          type: string
        entity_url:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
      required:
      - actor_name
      - entity_name
      - entity_url
      - timestamp
      - type
    _WelcomeInviter:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - name
    _WelcomeTeamMember:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: string
          nullable: true
        role:
          type: string
        last_active:
          $ref: '#/components/schemas/LastActiveEnum'
      required:
      - avatar
      - email
      - last_active
      - name
      - role
  parameters:
    OrganizationIdPath:
      in: path
      name: organization_id
      required: true
      schema:
        type: string
      description: ID of the organization you're trying to access. To find the ID of the organization, make a call to /api/organizations/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
