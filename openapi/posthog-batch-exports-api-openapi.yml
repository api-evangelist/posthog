    IntervalEnum:
      enum:
      - hour
      - day
      - week
      - every 5 minutes
      - every 15 minutes
      type: string
      description: '* `hour` - hour

        * `day` - day

        * `week` - week

        * `every 5 minutes` - every 5 minutes

        * `every 15 minutes` - every 15 minutes'
    BatchExportDestination:
      type: object
      description: Serializer for an BatchExportDestination model.
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/BatchExportDestinationTypeEnum'
          description: 'A choice of supported BatchExportDestination types.


            * `S3` - S3

            * `Snowflake` - Snowflake

            * `Postgres` - Postgres

            * `Redshift` - Redshift

            * `BigQuery` - Bigquery

            * `Databricks` - Databricks

            * `AzureBlob` - Azure Blob

            * `Workflows` - Workflows

            * `HTTP` - Http

            * `NoOp` - Noop'
        config:
          description: A JSON field to store all configuration parameters required to access a BatchExportDestination.
        integration:
          type: integer
          nullable: true
        integration_id:
          type: integer
          writeOnly: true
          nullable: true
      required:
      - type
    PaginatedBatchExportBackfillList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchExportBackfill'
    BatchExportBackfill:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        progress:
          type: object
          nullable: true
          properties:
            total_runs:
              type: integer
              nullable: true
            finished_runs:
              type: integer
              nullable: true
            progress:
              type: number
              nullable: true
          readOnly: true
        start_at:
          type: string
          format: date-time
          nullable: true
          description: The start of the data interval.
        end_at:
          type: string
          format: date-time
          nullable: true
          description: The end of the data interval.
        status:
          allOf:
          - $ref: '#/components/schemas/BatchExportBackfillStatusEnum'
          description: 'The status of this backfill.


            * `Cancelled` - Cancelled

            * `Completed` - Completed

            * `ContinuedAsNew` - Continued As New

            * `Failed` - Failed

            * `FailedRetryable` - Failed Retryable

            * `Terminated` - Terminated

            * `TimedOut` - Timedout

            * `Running` - Running

            * `Starting` - Starting'
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp at which this BatchExportBackfill was created.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: The timestamp at which this BatchExportBackfill finished, successfully or not.
        last_updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp at which this BatchExportBackfill was last updated.
        total_records_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: The total number of records to export. Initially estimated, updated with actual count after completion.
        adjusted_start_at:
          type: string
          format: date-time
          nullable: true
          description: The actual start time after adjustment for earliest available data. May differ from start_at if user requested a date before data exists.
        team:
          type: integer
          description: The team this belongs to.
        batch_export:
          type: string
          format: uuid
          description: The BatchExport this backfill belongs to.
      required:
      - batch_export
      - created_at
      - id
      - last_updated_at
      - progress
      - status
      - team
    ModelEnum:
      enum:
      - events
      - persons
      - sessions
      type: string
      description: '* `events` - Events

        * `persons` - Persons

        * `sessions` - Sessions'
    BatchExportBackfillStatusEnum:
      enum:
      - Cancelled
      - Completed
      - ContinuedAsNew
      - Failed
      - FailedRetryable
      - Terminated
      - TimedOut
      - Running
      - Starting
      type: string
      description: '* `Cancelled` - Cancelled

        * `Completed` - Completed

        * `ContinuedAsNew` - Continued As New

        * `Failed` - Failed

        * `FailedRetryable` - Failed Retryable

        * `Terminated` - Terminated

        * `TimedOut` - Timedout

        * `Running` - Running

        * `Starting` - Starting'
    BlankEnum:
      enum:
      - ''
  parameters:
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
    OrganizationIdPath:
