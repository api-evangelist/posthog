openapi: 3.0.3
info:
  title: PostHog actions batch_exports API
  version: 1.0.0
  description: ''
tags:
- name: batch_exports
paths:
  /api/environments/{environment_id}/batch_exports/:
    get:
      operationId: environments_batch_exports_list
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - batch_exports
      security:
      - PersonalAPIKeyAuth:
        - batch_export:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatchExportList'
          description: ''
      deprecated: true
      x-explicit-tags:
      - batch_exports
    post:
      operationId: environments_batch_exports_create
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - batch_exports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchExport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchExport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchExport'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - batch_export:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchExport'
          description: ''
      deprecated: true
      x-explicit-tags:
      - batch_exports
  /api/environments/{environment_id}/batch_exports/{batch_export_id}/backfills/:
    get:
      operationId: environments_batch_exports_backfills_list
      description: 'ViewSet for BatchExportBackfill models.


        Allows creating and reading backfills, but not updating or deleting them.'
      parameters:
      - in: path
        name: batch_export_id
        schema:
          type: string
          format: uuid
          description: The BatchExport this backfill belongs to.
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - batch_exports
      security:
      - PersonalAPIKeyAuth:
        - batch_export:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatchExportBackfillList'
          description: ''
      deprecated: true
      x-explicit-tags: []
    post:
      operationId: environments_batch_exports_backfills_create
      description: Create a new backfill for a BatchExport.
      parameters:
      - in: path
        name: batch_export_id
        schema:
          type: string
          format: uuid
          description: The BatchExport this backfill belongs to.
        required: true
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - batch_exports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchExportBackfill'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchExportBackfill'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchExportBackfill'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - batch_export:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchExportBackfill'
          description: ''
      deprecated: true
      x-explicit-tags: []
  /api/environments/{environment_id}/batch_exports/{batch_export_id}/backfills/{id}/:
    get:
      operationId: environments_batch_exports_backfills_retrieve
      description: 'ViewSet for BatchExportBackfill models.


        Allows creating and reading backfills, but not updating or deleting them.'
      parameters:
      - in: path
        name: batch_export_id
        schema:
          type: string
