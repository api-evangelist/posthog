          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    DashboardTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        template_name:
          type: string
          nullable: true
          maxLength: 400
        dashboard_description:
          type: string
          nullable: true
          maxLength: 400
        dashboard_filters:
          nullable: true
        tags:
          type: array
          items:
            type: string
            maxLength: 255
          nullable: true
        tiles:
          nullable: true
        variables:
          nullable: true
        deleted:
          type: boolean
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        image_url:
          type: string
          nullable: true
          maxLength: 8201
        team_id:
          type: integer
          nullable: true
          readOnly: true
        scope:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/DashboardTemplateScopeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        availability_contexts:
          type: array
          items:
            type: string
            maxLength: 255
          nullable: true
        is_featured:
          type: boolean
