components:
  schemas:
    GitHubReposResponse:
      type: object
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/GitHubRepo'
        has_more:
          type: boolean
          description: Whether more repositories are available beyond this page.
      required:
      - has_more
      - repositories
    BulkUpdateTagsResponse:
      type: object
      properties:
        updated:
          type: array
          items:
            $ref: '#/components/schemas/BulkUpdateTagsItem'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/BulkUpdateTagsError'
      required:
      - skipped
      - updated
    PatchedProjectSecretAPIKey:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        label:
          type: string
          maxLength: 40
        value:
          type: string
          readOnly: true
        mask_value:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_rolled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        scopes:
          type: array
          items:
            type: string
    PaginatedUserGitHubIntegrationListResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserGitHubIntegrationListResponse'
    PaginatedSubscriptionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
    ReorderTilesRequest:
      type: object
      properties:
        tile_order:
          type: array
          items:
            type: integer
          description: Array of tile IDs in the desired display order (top to bottom, left to right).
          minItems: 1
      required:
      - tile_order
    PaginatedProjectSecretAPIKeyList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSecretAPIKey'
    PatchedAddPersonsToStaticCohortRequest:
      type: object
      properties:
        person_ids:
          type: array
          items:
            type: string
            format: uuid
          description: List of person UUIDs to add to the cohort
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    SubscriptionFrequencyEnum:
      enum:
      - daily
      - weekly
      - monthly
      - yearly
      type: string
      description: '* `daily` - Daily

        * `weekly` - Weekly

        * `monthly` - Monthly

        * `yearly` - Yearly'
    RunInsightsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/DashboardTileResult'
          description: Results for each insight tile on the dashboard.
      required:
      - results
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        members:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Members assigned to this role
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - is_default
      - members
      - name
    NullEnum:
      enum:
      - null
    ProjectBackwardCompat:
      type: object
      description: 'Like `ProjectBasicSerializer`, but also works as a drop-in replacement for `TeamBasicSerializer` by way of

        passthrough fields. This allows the meaning of `Team` to change from "project" to "environment" without breaking

        backward compatibility of the REST API.

        Do not use this in greenfield endpoints!'
      properties:
        id:
          type: integer
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Human-readable project name.
          maxLength: 200
          minLength: 1
        product_description:
          type: string
          nullable: true
          description: Short description of what the project is about. This is helpful to give our AI agents context about your project.
          maxLength: 1000
        created_at:
          type: string
          format: date-time
          readOnly: true
        effective_membership_level:
          allOf:
          - $ref: '#/components/schemas/EffectiveMembershipLevelEnum'
          nullable: true
          readOnly: true
        has_group_types:
          type: boolean
          readOnly: true
        group_types:
          type: array
          items:
            type: object
            additionalProperties: true
          readOnly: true
        live_events_token:
          type: string
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        api_token:
          type: string
          readOnly: true
        app_urls:
          type: array
          items:
            type: string
            nullable: true
            maxLength: 200
        anonymize_ips:
          type: boolean
          description: When true, PostHog drops the IP address from every ingested event.
        completed_snippet_onboarding:
          type: boolean
        ingested_event:
          type: boolean
          readOnly: true
        test_account_filters:
          description: Filter groups that identify internal/test traffic to be excluded from insights.
        test_account_filters_default_checked:
          type: boolean
