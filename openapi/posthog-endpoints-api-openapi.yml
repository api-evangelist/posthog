          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEndpointRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEndpointRequest'
      security:
      - PersonalAPIKeyAuth:
        - endpoint:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointResponse'
          description: ''
      deprecated: true
      x-explicit-tags:
      - endpoints
    delete:
      operationId: environments_endpoints_destroy
      description: Delete an endpoint and clean up materialized query.
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: name
        schema:
          type: string
          description: URL-safe name for the endpoint
        required: true
      tags:
      - endpoints
      security:
      - PersonalAPIKeyAuth:
        - endpoint:write
      responses:
        '204':
          description: No response body
      deprecated: true
      x-explicit-tags:
      - endpoints
