openapi: 3.0.3
info:
  title: PostHog actions endpoints API
  version: 1.0.0
  description: ''
tags:
- name: endpoints
paths:
  /api/environments/{environment_id}/endpoints/:
    get:
      operationId: environments_endpoints_list
      description: List all endpoints for the team.
      parameters:
      - in: query
        name: created_by
        schema:
          type: integer
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - endpoints
      security:
      - PersonalAPIKeyAuth:
        - endpoint:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEndpointResponseList'
          description: ''
      deprecated: true
      x-explicit-tags:
      - endpoints
    post:
      operationId: environments_endpoints_create
      description: Create a new endpoint.
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - endpoints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EndpointRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EndpointRequest'
      security:
      - PersonalAPIKeyAuth:
        - endpoint:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointResponse'
          description: ''
      deprecated: true
      x-explicit-tags:
      - endpoints
  /api/environments/{environment_id}/endpoints/{name}/:
    get:
      operationId: environments_endpoints_retrieve
      description: Retrieve an endpoint, or a specific version via ?version=N.
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: name
        schema:
          type: string
          description: URL-safe name for the endpoint
        required: true
      tags:
      - endpoints
      security:
      - PersonalAPIKeyAuth:
        - endpoint:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointVersionResponse'
          description: ''
      deprecated: true
      x-explicit-tags:
      - endpoints
    put:
      operationId: environments_endpoints_update
      description: Update an existing endpoint. Parameters are optional. Pass version in body or ?version=N query param to target a specific version.
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - in: path
        name: name
        schema:
          type: string
          description: URL-safe name for the endpoint
        required: true
      tags:
      - endpoints
      requestBody:
        content:
