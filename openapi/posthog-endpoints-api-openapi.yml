components:
  schemas:
    DataWarehousePersonPropertyFilter:
      additionalProperties: false
      properties:
        key:
          title: Key
          type: string
        label:
          default: null
          title: Label
          type: string
          nullable: true
        operator:
          $ref: '#/components/schemas/PropertyOperator'
        type:
          default: data_warehouse_person_property
          title: Type
          type: string
          enum:
          - data_warehouse_person_property
        value:
          default: null
          title: Value
          anyOf:
          - items:
              anyOf:
              - type: string
              - type: number
              - type: boolean
            type: array
          - type: string
          - type: number
          - type: boolean
          nullable: true
      required:
      - key
      - operator
      title: DataWarehousePersonPropertyFilter
      type: object
    LogPropertyFilterType:
      enum:
      - log
      - log_attribute
      - log_resource_attribute
      title: LogPropertyFilterType
      type: string
    ElementPropertyFilter:
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/Key10'
        label:
          default: null
          title: Label
          type: string
          nullable: true
        operator:
          $ref: '#/components/schemas/PropertyOperator'
        type:
          default: element
          title: Type
          type: string
          enum:
          - element
        value:
          default: null
          title: Value
          anyOf:
          - items:
              anyOf:
              - type: string
              - type: number
              - type: boolean
            type: array
          - type: string
          - type: number
          - type: boolean
          nullable: true
      required:
      - key
      - operator
      title: ElementPropertyFilter
      type: object
    MaterializationPreviewRequest:
      type: object
      properties:
        version:
          type: integer
        bucket_overrides:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: 'Per-column bucket function overrides, e.g. {"timestamp": "hour"}'
    GroupPropertyFilter:
      additionalProperties: false
      properties:
        group_key_names:
          default: null
          title: Group Key Names
          additionalProperties:
            type: string
          type: object
          nullable: true
        group_type_index:
          default: null
          title: Group Type Index
          type: integer
          nullable: true
        key:
          title: Key
          type: string
        label:
          default: null
          title: Label
          type: string
          nullable: true
        operator:
          $ref: '#/components/schemas/PropertyOperator'
        type:
          default: group
          title: Type
          type: string
          enum:
          - group
        value:
          default: null
          title: Value
          anyOf:
          - items:
              anyOf:
              - type: string
              - type: number
              - type: boolean
            type: array
          - type: string
          - type: number
          - type: boolean
          nullable: true
      required:
      - key
      - operator
      title: GroupPropertyFilter
      type: object
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

