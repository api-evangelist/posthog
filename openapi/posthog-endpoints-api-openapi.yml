          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EndpointRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EndpointRequest'
      security:
      - PersonalAPIKeyAuth:
        - endpoint:write
      responses:
        '200':
          content:
            application/json:
