openapi: 3.2.0
info:
  title: PostHog Groups Types API
  version: 1.0.0
  description: ''
tags:
- name: groups_types
paths:
  /api/projects/{project_id}/groups_types/:
    get:
      operationId: groups_types_list
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - groups_types
      security:
      - PersonalAPIKeyAuth:
        - group:read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupType'
          description: ''
      x-explicit-tags: []
      summary: Groups types list
      x-summary-source: derived
  /api/projects/{project_id}/groups_types/{group_type_index}/:
    delete:
      operationId: groups_types_destroy
      parameters:
      - in: path
        name: group_type_index
        schema:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        required: true
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - groups_types
      security:
      - PersonalAPIKeyAuth:
        - group:write
      responses:
        '204':
          description: No response body
      x-explicit-tags: []
      summary: Groups types destroy
      x-summary-source: derived
  /api/projects/{project_id}/groups_types/create_detail_dashboard/:
    put:
      operationId: groups_types_create_detail_dashboard_update
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - groups_types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupType'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GroupType'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GroupType'
      responses:
        '200':
          description: No response body
      x-explicit-tags: []
      summary: Groups types create detail dashboard update
      x-summary-source: derived
  /api/projects/{project_id}/groups_types/set_default_columns/:
    put:
      operationId: groups_types_set_default_columns_update
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - groups_types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupType'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GroupType'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GroupType'
      responses:
        '200':
          description: No response body
      x-explicit-tags: []
      summary: Groups types set default columns update
      x-summary-source: derived
  /api/projects/{project_id}/groups_types/update_metadata/:
    patch:
      operationId: groups_types_update_metadata_partial_update
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - groups_types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGroupType'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGroupType'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGroupType'
      responses:
        '200':
          description: No response body
      x-explicit-tags: []
      summary: Groups types update metadata partial update
      x-summary-source: derived
components:
  schemas:
    GroupType:
      type: object
      properties:
        group_type:
          type: string
          readOnly: true
        group_type_index:
          type: integer
          readOnly: true
        name_singular:
          type:
          - string
          - 'null'
          maxLength: 400
        name_plural:
          type:
          - string
          - 'null'
          maxLength: 400
        detail_dashboard:
          type:
          - integer
          - 'null'
        default_columns:
          type:
          - array
          - 'null'
          items:
            type: string
        created_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - group_type
      - group_type_index
    PatchedGroupType:
      type: object
      properties:
        group_type:
          type: string
          readOnly: true
        group_type_index:
          type: integer
          readOnly: true
        name_singular:
          type:
          - string
          - 'null'
          maxLength: 400
        name_plural:
          type:
          - string
          - 'null'
          maxLength: 400
        detail_dashboard:
          type:
          - integer
          - 'null'
        default_columns:
          type:
          - array
          - 'null'
          items:
            type: string
        created_at:
          type:
          - string
          - 'null'
          format: date-time
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
