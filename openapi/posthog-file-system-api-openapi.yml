components:
  schemas:
    PatchedFileSystem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        path:
          type: string
        depth:
          type: integer
          readOnly: true
          nullable: true
        type:
          type: string
          maxLength: 100
        ref:
          type: string
          nullable: true
          maxLength: 100
        href:
          type: string
          nullable: true
        meta:
          nullable: true
        shortcut:
          type: boolean
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_viewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    PaginatedFileSystemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/FileSystem'
    FileSystem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        path:
          type: string
        depth:
          type: integer
          readOnly: true
          nullable: true
        type:
          type: string
          maxLength: 100
        ref:
          type: string
          nullable: true
          maxLength: 100
        href:
          type: string
          nullable: true
        meta:
          nullable: true
        shortcut:
          type: boolean
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_viewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - depth
      - id
      - last_viewed_at
      - path
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
