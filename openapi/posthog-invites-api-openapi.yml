openapi: 3.0.3
info:
  title: PostHog actions invites API
  version: 1.0.0
  description: ''
tags:
- name: invites
paths:
  /api/organizations/{organization_id}/invites/:
    get:
      operationId: invites_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - $ref: '#/components/parameters/OrganizationIdPath'
      tags:
      - invites
      security:
      - PersonalAPIKeyAuth:
        - organization_member:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationInviteList'
          description: ''
      x-explicit-tags:
      - core
    post:
      operationId: invites_create
      parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationInvite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationInvite'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - organization_member:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvite'
          description: ''
      x-explicit-tags:
      - core
  /api/organizations/{organization_id}/invites/{id}/:
    delete:
      operationId: invites_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this organization invite.
        required: true
      - $ref: '#/components/parameters/OrganizationIdPath'
      tags:
      - invites
      security:
      - PersonalAPIKeyAuth:
        - organization_member:write
      responses:
        '204':
          description: No response body
      x-explicit-tags:
      - core
  /api/organizations/{organization_id}/invites/bulk/:
    post:
      operationId: invites_bulk_create
      parameters:
      - $ref: '#/components/parameters/OrganizationIdPath'
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationInvite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationInvite'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - organization_member:write
      responses:
        '200':
          description: No response body
      x-explicit-tags:
      - core
components:
  schemas:
    OrganizationMembershipLevelEnum:
      enum:
      - 1
      - 8
      - 15
      type: integer
      description: '* `1` - member

        * `8` - administrator

        * `15` - owner'
    BlankEnum:
      enum:
      - ''
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type: string
          nullable: true
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type: boolean
          nullable: true
        hedgehog_config:
          type: object
          additionalProperties: true
          nullable: true
          readOnly: true
        role_at_organization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    OrganizationInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        target_email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 30
        emailing_attempt_made:
          type: boolean
          readOnly: true
        level:
          $ref: '#/components/schemas/OrganizationMembershipLevelEnum'
        is_expired:
          type: boolean
          description: Check if invite is older than INVITE_DAYS_VALIDITY days.
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        message:
          type: string
          nullable: true
        private_project_access:
          nullable: true
          description: List of team IDs and corresponding access levels to private projects.
        send_email:
          type: boolean
          writeOnly: true
          default: true
        combine_pending_invites:
          type: boolean
          writeOnly: true
          default: false
      required:
      - created_at
      - created_by
      - emailing_attempt_made
      - id
      - is_expired
      - target_email
      - updated_at
    PaginatedOrganizationInviteList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationInvite'
    NullEnum:
      enum:
      - null
  parameters:
    OrganizationIdPath:
      in: path
      name: organization_id
      required: true
      schema:
        type: string
      description: ID of the organization you're trying to access. To find the ID of the organization, make a call to /api/organizations/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
