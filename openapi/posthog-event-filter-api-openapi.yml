openapi: 3.0.3
info:
  title: PostHog actions event_filter API
  version: 1.0.0
  description: ''
tags:
- name: event_filter
paths:
  /api/environments/{project_id}/event_filter/:
    get:
      operationId: event_filter_retrieve
      description: Returns the event filter config for the team, or null if not yet created.
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - event_filter
      security:
      - PersonalAPIKeyAuth:
        - event_filter:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventFilterConfig'
          description: ''
      x-explicit-tags: []
    post:
      operationId: event_filter_create
      description: Create or update the event filter config.
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - event_filter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventFilterConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventFilterConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventFilterConfig'
      security:
      - PersonalAPIKeyAuth:
        - event_filter:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventFilterConfig'
          description: ''
      x-explicit-tags: []
  /api/environments/{project_id}/event_filter/metrics/:
    get:
      operationId: event_filter_metrics_retrieve
      description: 'Single event filter per team.

        GET  /event_filter/ — returns the config (or null if not yet created)

        POST /event_filter/ — creates or updates the config (upsert)

        GET  /event_filter/metrics/ — time-series metrics

        GET  /event_filter/metrics/totals/ — aggregate totals'
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - event_filter
      security:
      - PersonalAPIKeyAuth:
        - event_filter:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppMetricsResponse'
          description: ''
      x-explicit-tags: []
  /api/environments/{project_id}/event_filter/metrics/totals/:
    get:
      operationId: event_filter_metrics_totals_retrieve
      description: 'Single event filter per team.

        GET  /event_filter/ — returns the config (or null if not yet created)

        POST /event_filter/ — creates or updates the config (upsert)

        GET  /event_filter/metrics/ — time-series metrics

        GET  /event_filter/metrics/totals/ — aggregate totals'
      parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      tags:
      - event_filter
      security:
      - PersonalAPIKeyAuth:
        - event_filter:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppMetricsTotalsResponse'
          description: ''
      x-explicit-tags: []
components:
  schemas:
    EventFilterConfigModeEnum:
      enum:
      - disabled
      - dry_run
      - live
      type: string
      description: '* `disabled` - Disabled

        * `dry_run` - Dry Run

        * `live` - Live'
    AppMetricsResponse:
      type: object
      properties:
        labels:
          type: array
          items:
            type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/AppMetricSeries'
      required:
      - labels
      - series
    AppMetricsTotalsResponse:
      type: object
      properties:
        totals:
          type: object
          additionalProperties:
            type: integer
      required:
      - totals
    EventFilterConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        mode:
          $ref: '#/components/schemas/EventFilterConfigModeEnum'
        filter_tree:
          nullable: true
          description: 'Boolean expression tree. Nodes: {"type": "and"|"or", "children": [...]}, {"type": "not", "child": {...}}, {"type": "condition", "field": "event_name"|"distinct_id", "operator": "exact"|"contains", "value": "<string>"}'
        test_cases:
          description: 'Test events to validate the filter. Each: {"event_name": "...", "distinct_id": "...", "expected_result": "drop"|"ingest"}'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
    AppMetricSeries:
      type: object
      properties:
        name:
          type: string
        values:
          type: array
          items:
            type: integer
      required:
      - name
      - values
  parameters:
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
