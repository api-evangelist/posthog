      properties:
        time:
          type: string
          description: Bucket start time (ISO 8601).
        severity:
          type: string
          description: Severity label when sparklineBreakdownBy="severity". Present only for severity-broken-down sparklines.
        service:
          type: string
          description: Service name when sparklineBreakdownBy="service". Present only for service-broken-down sparklines.
        count:
          type: integer
      required:
      - count
      - time
    _LogsCountRangeBucket:
      type: object
      properties:
        date_from:
          type: string
          description: Bucket start as ISO 8601 timestamp. Inclusive lower bound. Pass back as `dateRange.date_from` to drill in.
        date_to:
          type: string
          description: Bucket end as ISO 8601 timestamp. Exclusive upper bound. Pass back as `dateRange.date_to` to drill in.
        count:
          type: integer
          description: Log entries matching the filters within this bucket.
      required:
      - count
      - date_from
      - date_to
    _LogsCountRangesResponse:
      type: object
      properties:
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/_LogsCountRangeBucket'
          description: Buckets ordered by `date_from` ascending. Empty buckets are omitted — infer gaps by comparing each bucket's `date_to` to the next bucket's `date_from`.
        interval:
          type: string
          description: Short-form duration of the chosen bucket width (e.g. "1h", "5m", "30s", "1d"). Informational only — use each bucket's `date_from`/`date_to` for follow-up queries.
      required:
      - interval
      - ranges
    LogsSamplingRuleSimulateResponse:
      type: object
      properties:
        estimated_reduction_pct:
          type: number
          format: double
          description: Rough percent of log volume this rule would drop (0–100). Stub until ClickHouse-backed estimate ships.
        notes:
          type: string
          description: Human-readable caveats for the estimate.
      required:
      - estimated_reduction_pct
      - notes
    LogsView:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        short_id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 400
        filters:
          type: object
          additionalProperties: true
          description: Filter criteria — subset of LogsViewerFilters. May contain severityLevels, serviceNames, searchTerm, filterGroup, dateRange, and other keys.
        pinned:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBasic'
          readOnly: true
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - name
      - short_id
      - updated_at
    UserBasic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        distinct_id:
          type:
          - string
          - 'null'
          maxLength: 200
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_email_verified:
          type:
          - boolean
          - 'null'
        hedgehog_config:
          type:
          - object
          - 'null'
          additionalProperties: true
          readOnly: true
        role_at_organization:
          oneOf:
          - $ref: '#/components/schemas/RoleAtOrganizationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - hedgehog_config
      - id
      - uuid
    RoleAtOrganizationEnum:
      enum:
      - engineering
      - data
      - product
      - founder
      - leadership
      - marketing
      - sales
      - other
      type: string
      description: '* `engineering` - Engineering

        * `data` - Data

        * `product` - Product Management

        * `founder` - Founder

        * `leadership` - Leadership

        * `marketing` - Marketing

        * `sales` - Sales / Success

        * `other` - Other'
    _LogsAttributesResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/_LogAttributeEntry'
          description: Available attribute keys matching the filters.
        count:
          type: integer
          description: Total attribute keys matched (not paginated).
      required:
      - count
      - results
    _LogsSparklineRequest:
      type: object
      properties:
        query:
          allOf:
          - $ref: '#/components/schemas/_LogsSparklineBody'
          description: The sparkline query to execute.
      required:
      - query
  parameters:
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
