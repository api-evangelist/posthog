openapi: 3.2.0
info:
  title: PostHog Logs API
  version: 1.0.0
  description: ''
tags:
- name: Logs
paths:
  /api/environments/{environment_id}/logs/alerts/:
    get:
      operationId: environments_logs_alerts_list
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - Logs
      security:
      - PersonalAPIKeyAuth:
        - logs:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLogsAlertConfigurationList'
          description: ''
      deprecated: true
      x-explicit-tags:
      - logs
      summary: Environments logs alerts list
      x-summary-source: derived
    post:
      operationId: environments_logs_alerts_create
      parameters:
      - $ref: '#/components/parameters/EnvironmentIdPath'
      tags:
      - Logs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogsAlertConfiguration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogsAlertConfiguration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogsAlertConfiguration'
      security:
      - PersonalAPIKeyAuth:
        - logs:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsAlertConfiguration'
          description: ''
      deprecated: true
      x-explicit-tags:
      - logs
      summary: Environments logs alerts create
      x-summary-source: derived
  /api/environments/{environment_id}/logs/alerts/{id}/:
