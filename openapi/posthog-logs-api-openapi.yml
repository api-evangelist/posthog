          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_LogsCountRangesRequest'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - logs:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_LogsCountRangesResponse'
          description: ''
      deprecated: true
      x-explicit-tags:
      - logs
  /api/environments/{environment_id}/logs/export/:
    post:
      operationId: environments_logs_export_create
