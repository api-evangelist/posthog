          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogsSamplingRule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogsSamplingRule'
        required: true
      security:
      - PersonalAPIKeyAuth:
        - logs:write
      responses:
        '201':
