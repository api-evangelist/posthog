        last_synced_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        latest_error:
          type: string
          readOnly: true
          nullable: true
          description: The latest error that occurred when syncing this schema.
        incremental:
          type: boolean
          readOnly: true
        status:
          type: string
          nullable: true
          readOnly: true
        sync_type:
          nullable: true
          description: 'Sync strategy: incremental, full_refresh, append, or cdc.


            * `full_refresh` - full_refresh

            * `incremental` - incremental

            * `append` - append

            * `webhook` - webhook

            * `cdc` - cdc'
          oneOf:
          - $ref: '#/components/schemas/SyncTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        incremental_field:
          type: string
          nullable: true
          description: Column name used to track sync progress.
        incremental_field_type:
          nullable: true
          description: 'Data type of the incremental field.


            * `integer` - integer

