            * `30day` - 30day'
          oneOf:
          - $ref: '#/components/schemas/SyncFrequencyEnum'
          - $ref: '#/components/schemas/NullEnum'
        sync_time_of_day:
          type: string
          format: time
          nullable: true
          description: UTC time of day to run the sync (HH:MM:SS).
        description:
          type: string
          readOnly: true
          nullable: true
        primary_key_columns:
          type: array
          items:
            type: string
          nullable: true
          description: Column names for primary key deduplication.
        cdc_table_mode:
          nullable: true
          description: 'For CDC syncs: consolidated, cdc_only, or both.


            * `consolidated` - consolidated

            * `cdc_only` - cdc_only

            * `both` - both'
          oneOf:
          - $ref: '#/components/schemas/CdcTableModeEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - description
      - id
      - incremental
      - label
      - last_synced_at
      - latest_error
      - name
      - status
      - table
    PaginatedExternalDataSchemaList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDataSchema'
    CdcTableModeEnum:
      enum:
      - consolidated
      - cdc_only
      - both
      type: string
      description: '* `consolidated` - consolidated

        * `cdc_only` - cdc_only

        * `both` - both'
    NullEnum:
      enum:
      - null
  parameters:
    EnvironmentIdPath:
      in: path
      name: environment_id
      required: true
      schema:
        type: string
      description: Deprecated. Use /api/projects/{project_id}/ instead.
    ProjectIdPath:
      in: path
      name: project_id
      required: true
      schema:
        type: string
      description: Project ID of the project you're trying to access. To find the ID of the project, make a call to /api/projects/.
  securitySchemes:
    PersonalAPIKeyAuth:
      type: http
      scheme: bearer
