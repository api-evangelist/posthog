  exception_type: String
  exception_value: String
  exception_mechanism: JSON
  exception_stack_trace: JSON
  distinct_id: String
  person: Person
  properties: JSON
}

"""
A data warehouse table linked to an external source.
"""
type DataWarehouseTable {
  id: UUID!
  name: String!
  format: String
  url_pattern: String
  credential: DataWarehouseCredential
  columns: JSON
  source: ExternalDataSource
  team_id: Int!
  created_at: DateTime!
  updated_at: DateTime!
}

type DataWarehouseCredential {
  id: UUID!
  access_key: String
  access_secret: String
}

"""
An external data source synced into the PostHog data warehouse.
"""
type ExternalDataSource {
  id: UUID!
  source_type: ExternalDataSourceType!
  status: String!
  last_run_at: DateTime
  schemas: [ExternalDataSchema]
  team_id: Int!
  created_at: DateTime!
  updated_at: DateTime!
}

type ExternalDataSchema {
  id: UUID!
  name: String!
  should_sync: Boolean!
  status: String
  last_synced_at: DateTime
  sync_type: String
  table: DataWarehouseTable
}

# ---------------------------------------------------------------------------
# Root types (conceptual — PostHog uses REST, not live GraphQL)
# ---------------------------------------------------------------------------

"""
Read operations modelled after PostHog's REST API endpoints.
"""
type Query {
  """Retrieve a single event by UUID."""
  event(projectId: Int!, id: UUID!): Event

  """List events for a project with optional filters."""
  events(
    projectId: Int!
    after: DateTime
    before: DateTime
    event: String
    distinctId: String
    limit: Int
    offset: Int
  ): EventConnection

  """Retrieve a person by UUID."""
  person(projectId: Int!, id: UUID!): Person

  """List persons for a project."""
  persons(
    projectId: Int!
    search: String
    properties: [PropertyFilter]
    limit: Int
    offset: Int
  ): PersonConnection

  """Retrieve a cohort by ID."""
  cohort(projectId: Int!, id: Int!): Cohort

  """List cohorts for a project."""
  cohorts(projectId: Int!): [Cohort]

  """Retrieve a feature flag by ID."""
  featureFlag(projectId: Int!, id: Int!): FeatureFlag

  """List feature flags for a project."""
  featureFlags(projectId: Int!, active: Boolean): [FeatureFlag]

  """Retrieve an insight by short ID."""
  insight(projectId: Int!, shortId: String!): Insight

  """List insights for a project."""
  insights(
    projectId: Int!
    saved: Boolean
    favorited: Boolean
    search: String
    limit: Int
    offset: Int
  ): InsightConnection

  """Retrieve a dashboard by ID."""
  dashboard(projectId: Int!, id: Int!): Dashboard

  """List dashboards for a project."""
  dashboards(projectId: Int!): [Dashboard]

  """Retrieve an experiment by ID."""
  experiment(projectId: Int!, id: Int!): Experiment

  """List experiments for a project."""
  experiments(projectId: Int!, archived: Boolean): [Experiment]

  """Retrieve a survey by ID."""
  survey(projectId: Int!, id: UUID!): Survey

  """List surveys for a project."""
  surveys(projectId: Int!): [Survey]

  """Retrieve a recording session by session ID."""
  sessionRecording(projectId: Int!, sessionId: String!): Session

  """List session recordings for a project."""
  sessionRecordings(
    projectId: Int!
    dateFrom: String
    dateTo: String
    personUuid: UUID
    limit: Int
    offset: Int
  ): SessionConnection

  """Retrieve an action by ID."""
  action(projectId: Int!, id: Int!): Action

  """List actions for a project."""
  actions(projectId: Int!): [Action]

  """List annotations for a project."""
  annotations(projectId: Int!): [Annotation]

  """Retrieve a plugin by ID."""
  plugin(id: Int!): Plugin

  """List plugins available to an organisation."""
  plugins(organizationId: UUID!): [Plugin]

  """List plugin configs for a project."""
  pluginConfigs(projectId: Int!): [PluginConfig]

  """Retrieve an alert by ID."""
  alertThreshold(projectId: Int!, id: UUID!): AlertThreshold

  """List alerts for a project."""
  alertThresholds(projectId: Int!): [AlertThreshold]

  """Retrieve an early access feature by ID."""
  earlyAccessFeature(projectId: Int!, id: UUID!): EarlyAccessFeature

  """List early access features for a project."""
  earlyAccessFeatures(projectId: Int!): [EarlyAccessFeature]

  """Retrieve a notebook by short ID."""
  notebook(projectId: Int!, shortId: String!): Notebook

  """List notebooks for a project."""
  notebooks(projectId: Int!, search: String, limit: Int, offset: Int): NotebookConnection

  """Retrieve an error tracking issue by ID."""
  errorTrackingIssue(projectId: Int!, id: UUID!): ErrorTrackingIssue

  """List error tracking issues for a project."""
  errorTrackingIssues(
    projectId: Int!
    status: ErrorTrackingIssueStatus
    limit: Int
    offset: Int
  ): ErrorTrackingIssueConnection

  """Retrieve a data warehouse table by ID."""
  dataWarehouseTable(projectId: Int!, id: UUID!): DataWarehouseTable

  """List data warehouse tables for a project."""
  dataWarehouseTables(projectId: Int!): [DataWarehouseTable]

  """Retrieve the current authenticated user."""
  me: User

  """Retrieve a team (project) by ID."""
  team(id: Int!): Team

  """Retrieve an organization by ID."""
  organization(id: UUID!): Organization
}

"""
Write operations modelled after PostHog's REST API endpoints.
"""
type Mutation {
  """Capture a single event."""
  captureEvent(projectApiKey: String!, input: CaptureEventInput!): CaptureEventResult

  """Create a feature flag."""
  createFeatureFlag(projectId: Int!, input: FeatureFlagInput!): FeatureFlag

  """Update a feature flag."""
  updateFeatureFlag(projectId: Int!, id: Int!, input: FeatureFlagInput!): FeatureFlag

  """Delete a feature flag."""
  deleteFeatureFlag(projectId: Int!, id: Int!): Boolean

  """Create a cohort."""
  createCohort(projectId: Int!, input: CohortInput!): Cohort

  """Update a cohort."""
  updateCohort(projectId: Int!, id: Int!, input: CohortInput!): Cohort

  """Create an annotation."""
  createAnnotation(projectId: Int!, input: AnnotationInput!): Annotation

  """Create or update an insight."""
  createInsight(projectId: Int!, input: InsightInput!): Insight

  """Create a dashboard."""
  createDashboard(projectId: Int!, input: DashboardInput!): Dashboard

  """Create an experiment."""
  createExperiment(projectId: Int!, input: ExperimentInput!): Experiment

  """Launch an experiment."""
  launchExperiment(projectId: Int!, id: Int!): Experiment

  """End an experiment."""
  endExperiment(projectId: Int!, id: Int!): Experiment

  """Create a survey."""
  createSurvey(projectId: Int!, input: SurveyInput!): Survey

  """Launch a survey."""
  launchSurvey(projectId: Int!, id: UUID!): Survey

  """Stop a survey."""
  stopSurvey(projectId: Int!, id: UUID!): Survey

  """Create a subscription."""
  createSubscription(projectId: Int!, input: SubscriptionInput!): Subscription

  """Delete a person."""
  deletePerson(projectId: Int!, id: UUID!): Boolean
}

# ---------------------------------------------------------------------------
# Input types
# ---------------------------------------------------------------------------

input CaptureEventInput {
  event: String!
  distinctId: String!
  timestamp: DateTime
  properties: JSON
  groups: JSON
}

type CaptureEventResult {
  status: Int!
}

input FeatureFlagInput {
  key: String!
  name: String
  filters: JSON
  active: Boolean
  deleted: Boolean
  rollout_percentage: Float
}

input CohortInput {
  name: String!
  description: String
  filters: JSON
  is_static: Boolean
}

input AnnotationInput {
  content: String!
  date_marker: DateTime!
  scope: String
  dashboard_item: Int
}

input InsightInput {
  name: String
  description: String
  filters: JSON
  query: JSON
  saved: Boolean
  dashboards: [Int]
  tags: [String]
}

input DashboardInput {
  name: String!
  description: String
  pinned: Boolean
  tags: [String]
}

input ExperimentInput {
  name: String!
  description: String
  feature_flag_key: String!
  parameters: JSON
  metrics: [JSON]
  secondary_metrics: [JSON]
}

input SurveyInput {
  name: String!
  description: String
  type: String!
  questions: [JSON]
  conditions: JSON
  appearance: JSON
  linked_flag_id: Int
  targeting_flag_filters: JSON
  start_date: DateTime
  end_date: DateTime
}

input SubscriptionInput {
  insight: Int
  dashboard: Int
  title: String
  target_type: String!
  target_value: String!
  frequency: String!
  interval: Int
  start_date: DateTime
  until_date: DateTime
  enabled: Boolean
}

# ---------------------------------------------------------------------------
# Pagination connection types
# ---------------------------------------------------------------------------

type EventConnection {
  results: [Event]!
  next: String
}

type PersonConnection {
  results: [Person]!
  next: String
  count: Int
}

type InsightConnection {
  results: [Insight]!
  count: Int
  next: String
}

type SessionConnection {
  results: [Session]!
  has_next: Boolean
  next_cursor: String
}

type NotebookConnection {
  results: [Notebook]!
  count: Int
  next: String
}

type ErrorTrackingIssueConnection {
  results: [ErrorTrackingIssue]!
  count: Int
  next: String
}
