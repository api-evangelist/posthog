"""
PostHog GraphQL Schema
======================
PostHog does not expose a public GraphQL endpoint. Its primary API surface is
REST (https://posthog.com/docs/api) plus HogQL — a SQL-like query language
executed via the POST /api/projects/:project_id/query endpoint.

This document represents the canonical domain model extracted from PostHog's
open-source type definitions:
  - frontend/src/queries/schema/schema-general.ts
  - frontend/src/queries/schema/schema-surveys.ts
  - posthog/schema.py  (generated from the TypeScript source)

It is provided as a GraphQL SDL for discovery, tooling, and documentation
purposes.

Source: https://github.com/PostHog/posthog
Docs:   https://posthog.com/docs/api
"""

