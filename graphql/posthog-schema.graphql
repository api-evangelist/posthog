"""
A captured product analytics event stored in ClickHouse.
"""
type Event {
  id: UUID!
  uuid: UUID!
  event: String!
  timestamp: DateTime!
  distinct_id: String!
  person: Person
  properties: JSON
  elements: [Element]
  team_id: Int!
  site_url: String
  created_at: DateTime!
}

"""
Represents a known user (person) identified by one or more distinct IDs.
"""
type Person {
  id: UUID!
  uuid: UUID!
  name: String
  distinct_ids: [String!]!
  properties: JSON
  created_at: DateTime!
  is_identified: Boolean!
  team_id: Int!
}

"""
A group of users sharing a common identifier (e.g. company, org, workspace).
"""
type Group {
  index: Int!
  key: String!
  type: String!
  properties: JSON
  created_at: DateTime!
  team_id: Int!
}

"""
A browser/mobile session captured via session replay.
"""
type Session {
  id: UUID!
  session_id: String!
  person: Person
  distinct_id: String!
  start_time: DateTime!
  end_time: DateTime
  duration: Int
  click_count: Int
  keypress_count: Int
  mouse_activity_count: Int
  console_error_count: Int
  active_seconds: Int
  inactive_seconds: Int
  team_id: Int!
  properties: JSON
}

"""
A static or dynamic group of persons defined by shared properties or behaviour.
"""
type Cohort {
  id: Int!
  name: String!
  description: String
  filters: JSON
  is_static: Boolean!
  count: Int
  created_by: User
  created_at: DateTime!
  deleted: Boolean!
  team_id: Int!
}

"""
A feature flag that can be conditionally enabled for users or groups.
"""
type FeatureFlag {
  id: Int!
  key: String!
  name: String
  filters: FeatureFlagFilters
  rollout_percentage: Float
  active: Boolean!
  deleted: Boolean!
  is_simple_flag: Boolean!
  has_enriched_analytics: Boolean
  team_id: Int!
  created_by: User
  created_at: DateTime!
}

"""
The rollout conditions for a feature flag.
"""
type FeatureFlagFilters {
  groups: [FeatureFlagCondition]
  payloads: JSON
  multivariate: MultivariateOptions
  aggregation_group_type_index: Int
  super_groups: [FeatureFlagCondition]
}

"""
A single rollout condition group within a feature flag.
"""
