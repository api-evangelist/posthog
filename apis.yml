aid: posthog
name: PostHog
description: PostHog is an open source product analytics platform that provides event
  tracking, session recording, feature flags, A/B testing, and user surveys in a single
  platform. It can be self-hosted or used as a cloud service, giving teams full control
  over their product data while providing comprehensive tools for understanding and
  improving user experiences.
type: Index
