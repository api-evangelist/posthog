apis:
- aid: posthog:posthog
  name: PostHog API
  description: The PostHog API is a single consolidated REST interface that exposes every PostHog capability available in
    the UI, including event capture, person and group profiles, cohorts, feature flags, experiments, insights, dashboards,
    annotations, sessions, surveys, web analytics, and HogQL queries. It supports project-scoped and personal API key authentication
    for both PostHog Cloud and self-hosted deployments.
  humanURL: https://posthog.com/docs/api
